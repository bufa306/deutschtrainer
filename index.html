<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Training System · IT-Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#13110e;--bg2:#1a1713;--bg3:#221e18;--bg4:#2a2520;
  --bdr:#3a342c;--bdr2:#52493e;
  --ink:#e8e0d4;--ink2:#a89880;--ink3:#6b5f50;--ink4:#3d342a;
  --amber:#d4924a;--amber2:#f0b46a;--amber3:#fff0d8;
  --green:#6aab7e;--green2:#3d7a50;
  --red:#c46060;--teal:#5a9fa8;--blue:#6b9fd4;
  --mono:'IBM Plex Mono',monospace;
  --serif:'Playfair Display',serif;
  --sans:'Epilogue',sans-serif;
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;font-size:15px;line-height:1.6}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}
#app{position:relative;z-index:1}
.wrap{max-width:700px;margin:0 auto;padding:0 20px 120px}

/* HOME */
.home-hdr{padding:48px 0 36px;text-align:center;border-bottom:1px solid var(--bdr);margin-bottom:36px}
.home-title{font-family:var(--serif);font-size:32px;color:var(--amber2);margin-bottom:6px}
.home-sub{font-size:12px;color:var(--ink3);letter-spacing:.15em;text-transform:uppercase;font-family:var(--mono)}
.module-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:32px}
@media(max-width:600px){.module-grid{grid-template-columns:1fr}}
.mod-btn{background:var(--bg2);border:1px solid var(--bdr);padding:22px 18px;cursor:pointer;text-align:left;transition:all .2s;border-radius:6px;position:relative;overflow:hidden}
.mod-btn:hover{transform:translateY(-2px);border-color:var(--amber)}
.mod-icon{font-size:24px;margin-bottom:10px}
.mod-label{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:5px}
.mod-desc{font-size:12px;color:var(--ink3);line-height:1.6}
.mod-stats{font-family:var(--mono);font-size:10px;color:var(--ink4);margin-top:10px}
.mod-bar{height:2px;background:var(--bdr);margin-top:10px;border-radius:2px;overflow:hidden}
.mod-bar-fill{height:100%;border-radius:2px;transition:width .5s}

/* SHARED HEADER */
.shdr{padding:20px 0 16px;border-bottom:1px solid var(--bdr);margin-bottom:24px}
.shdr-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.back-btn{font-family:var(--mono);font-size:10px;color:var(--ink3);cursor:pointer;background:none;border:none;letter-spacing:.1em;text-transform:uppercase;padding:0;transition:color .15s}
.back-btn:hover{color:var(--ink)}
.shdr-title{font-family:var(--serif);font-size:18px;color:var(--amber2)}
.shdr-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:10px;color:var(--ink3);background:var(--bg3);border:1px solid var(--bdr);padding:3px 9px;border-radius:3px}
.pill .v{color:var(--ink);font-weight:500}
.xpbar{height:2px;background:var(--bdr);border-radius:2px;overflow:hidden}
.xpfill{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));transition:width .6s;border-radius:2px}

/* NAV TABS */
.nav{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:24px;gap:0;overflow-x:auto}
.nv{padding:9px 14px;font-size:11px;font-weight:600;color:var(--ink3);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;font-family:var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:all .15s}
.nv.on{color:var(--amber2);border-bottom-color:var(--amber)}
.nv:hover:not(.on){color:var(--ink)}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--bdr);border-radius:6px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,146,74,.15),transparent)}
.card-amber{border-left:2px solid var(--amber);border-radius:0 6px 6px 0}
.card-green{border-left:2px solid var(--green);border-radius:0 6px 6px 0}
.card-blue{border-left:2px solid var(--blue);border-radius:0 6px 6px 0}
.card-teal{border-left:2px solid var(--teal);border-radius:0 6px 6px 0}

.lbl{font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.lbl-g{color:var(--green)}.lbl-t{color:var(--teal)}.lbl-b{color:var(--blue)}.lbl-m{color:var(--ink3)}
.ctitle{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:10px;line-height:1.3}
.scene-box{background:var(--bg);border-left:2px solid var(--amber);padding:12px 16px;margin:10px 0;font-style:italic;color:var(--ink2);line-height:1.9;font-size:14px;border-radius:0 4px 4px 0}
.hint-ln{font-size:11px;color:var(--ink3);margin-bottom:8px;font-family:var(--mono)}
.kws{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.kw{font-family:var(--mono);font-size:10px;color:var(--teal);background:rgba(90,159,168,.08);border:1px solid rgba(90,159,168,.2);padding:2px 8px;border-radius:3px}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:20px}
.cat-c{background:var(--bg2);border:1px solid var(--bdr);padding:15px;cursor:pointer;transition:all .18s;border-radius:6px}
.cat-c:hover{transform:translateY(-1px);border-color:var(--amber)}
.cat-c.weak{border-color:rgba(196,96,96,.35);background:rgba(196,96,96,.03)}
.cat-name{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px}
.cat-meta{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.cat-bar{height:2px;background:var(--bdr);margin-top:10px;border-radius:2px;overflow:hidden}
.cat-fill{height:100%;background:var(--amber);transition:width .4s;border-radius:2px}
.cat-c.weak .cat-fill{background:var(--red)}
.weak-tag{font-family:var(--mono);font-size:9px;color:var(--red);letter-spacing:.1em;margin-top:3px}

/* QUESTION BOX */
.q-num{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-bottom:8px}
.q-text{font-size:15px;color:var(--ink);line-height:1.65;margin-bottom:16px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.opt{padding:12px 15px;background:var(--bg);border:1px solid var(--bdr);color:var(--ink);font-size:13px;cursor:pointer;text-align:left;transition:all .12s;font-family:var(--sans);border-radius:4px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--amber);color:var(--amber2)}
.opt.ok{border-color:var(--green);color:var(--green);background:rgba(106,171,126,.07)}
.opt.bad{border-color:var(--red);color:var(--red);background:rgba(196,96,96,.07)}
.opt:disabled{cursor:default}
.expl-box{background:var(--bg3);border:1px solid var(--bdr);border-radius:4px;padding:14px 16px;margin-top:10px;font-size:13px;line-height:1.95;color:var(--ink2)}
.prinzip{font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.08em;margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)}
.hint-box{background:rgba(90,159,168,.05);border:1px solid rgba(90,159,168,.2);border-radius:4px;padding:12px 15px;margin-top:10px;font-size:12px;color:var(--teal);line-height:1.85;font-family:var(--mono)}
.hint-box b{color:var(--amber2);font-weight:500}

/* EXPLAIN PHASE */
.phase-label{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
textarea{width:100%;background:var(--bg);border:1px solid var(--bdr);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.8;padding:11px 13px;resize:vertical;min-height:88px;outline:none;border-radius:4px;transition:border-color .15s}
textarea:focus{border-color:var(--amber)}
textarea:disabled{opacity:.55}

/* FEEDBACK */
.fb{background:var(--bg);border:1px solid var(--bdr);border-radius:4px;padding:15px;margin-top:12px;font-size:13px;line-height:2.1;color:var(--ink);white-space:pre-wrap;min-height:40px;transition:border-color .3s}
.fb.live{border-color:var(--amber)}
.model-box{background:rgba(90,159,168,.05);border:1px solid rgba(90,159,168,.2);padding:12px 15px;margin-top:10px;font-size:13px;line-height:1.9;color:var(--ink2);border-radius:4px}
.mlbl{font-family:var(--mono);font-size:9px;color:var(--teal);letter-spacing:.12em;margin-bottom:6px}

/* FILL-IN */
.fill-row{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}
.fill-sent{font-size:14px;color:var(--ink);flex:1;min-width:160px;line-height:1.7}
input[type=text]{background:var(--bg);border:1px solid var(--bdr);color:var(--ink);font-family:var(--mono);font-size:13px;padding:7px 11px;outline:none;border-radius:4px;transition:border-color .15s;width:130px}
input[type=text]:focus{border-color:var(--amber)}
input.ok{border-color:var(--green);color:var(--green)}
input.bad{border-color:var(--red);color:var(--red)}
.fhint{font-size:10px;color:var(--ink3);font-family:var(--mono)}

/* VOCAB UPGRADE */
.vocab-pair{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.vocab-weak{color:var(--red);font-family:var(--mono);background:rgba(196,96,96,.08);border:1px solid rgba(196,96,96,.2);padding:3px 9px;border-radius:3px;text-decoration:line-through}
.vocab-arrow{color:var(--ink3);font-size:12px}
.vocab-strong{color:var(--green);font-family:var(--mono);background:rgba(106,171,126,.08);border:1px solid rgba(106,171,126,.2);padding:3px 9px;border-radius:3px;font-weight:500}
.vocab-ctx{font-size:11px;color:var(--ink3);margin-top:3px;padding-left:4px;font-style:italic;line-height:1.6}

/* BUTTONS */
.row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;font-size:11px;font-weight:600;letter-spacing:.08em;cursor:pointer;border:1px solid var(--bdr2);background:transparent;color:var(--ink2);font-family:var(--sans);border-radius:4px;text-transform:uppercase;transition:all .15s}
.btn:hover{color:var(--ink);border-color:var(--ink2);background:var(--bg3)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-p{background:var(--amber);color:var(--bg);border-color:var(--amber);font-weight:700}
.btn-p:hover{background:var(--amber2);border-color:var(--amber2);color:var(--bg)}
.btn-sm{padding:6px 13px;font-size:10px}
.btn-g{color:var(--green);border-color:rgba(106,171,126,.3)}
.btn-g:hover{background:rgba(106,171,126,.07)}

/* PROFIL */
.dash2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.dash-c{background:var(--bg3);border-radius:6px;padding:16px}
.dash-num{font-family:var(--serif);font-size:38px;color:var(--amber2);line-height:1}
.dash-lbl{font-size:11px;color:var(--ink3);margin-top:4px;font-family:var(--mono)}
.prof-row{margin-bottom:16px}
.prof-meta{display:flex;justify-content:space-between;margin-bottom:5px}
.prof-name{font-size:13px;font-weight:600}
.prof-stat{font-family:var(--mono);font-size:10px;color:var(--ink3)}

/* DOTS */
.dots{display:inline-flex;gap:3px;align-items:center}
.dots span{width:4px;height:4px;background:currentColor;border-radius:50%;animation:bop 1s infinite;opacity:.3}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bop{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-4px);opacity:1}}

/* LVUP */
.lvup{background:linear-gradient(135deg,rgba(212,146,74,.1),rgba(212,146,74,.04));border:1px solid rgba(212,146,74,.25);border-radius:6px;padding:20px;text-align:center;margin-bottom:16px}

/* SETUP */
.setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.setup-box{background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:32px;max-width:400px;width:100%}
input[type=password]{background:var(--bg);border:1px solid var(--bdr);color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 11px;outline:none;border-radius:4px;width:100%;margin-bottom:8px;transition:border-color .15s}
input[type=password]:focus{border-color:var(--amber)}
a{color:var(--teal)}
.divider{height:1px;background:var(--bdr);margin:18px 0}
.progress-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.streak-fire{font-size:28px;line-height:1}

/* SITUTATION CARDS for Deutsch */
.situ-badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;padding:3px 9px;border-radius:3px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>

const DE_SITUATIONS = [
  {id:"s1",badge:"Erstkontakt",badge_color:"var(--amber)",scene:"Sie treffen einen IT-Leiter auf einem Event. Er fragt: 'Was macht IT-Check eigentlich genau?'",task:"Erkläre IT-Check in 3-4 Sätzen auf professionellem Deutsch. Keine Anglizismen, kein Pitch-Ton.",kw:["vendor-neutral","Vergleichsplattform","Mittelstand","unabhängig"],model:"IT-Check Deutschland ist eine vendor-neutrale Vergleichsplattform für IT-Infrastruktur. Wir helfen mittelständischen Unternehmen dabei, Angebote verschiedener Anbieter strukturiert zu vergleichen – unabhängig und ohne Eigeninteresse. Ziel ist es, dass IT-Leiter fundierte Entscheidungen treffen können."},
  {id:"s2",badge:"Einwand",badge_color:"var(--red)",scene:"Ein Geschäftsführer sagt: 'Wir haben gerade kein Budget dafür.'",task:"Reagiere professionell und ohne Druck. Zeige Verständnis und öffne eine Perspektive.",kw:["verstehen","nachfragen","Perspektive","zeitnah"],model:"Das ist ein verständlicher Punkt – Budgetentscheidungen haben immer ihren Rhythmus. Darf ich kurz nachfragen: Handelt es sich um eine aktuelle Priorisierung, oder sehen Sie das Thema grundsätzlich als weniger dringend? Je nach Ihrer Situation könnten wir auch einen späteren Zeitpunkt ins Auge fassen."},
  {id:"s3",badge:"Alltagsdeutsch",badge_color:"var(--teal)",scene:"Sie sind beim Bäcker in Sindelfingen. Die Verkäuferin fragt: 'Sonst noch etwas?' Sie wollen fragen ob es noch Vollkornbrot gibt.",task:"Natürliche, nicht formelle Antwort. Zeige flüssiges Alltagsdeutsch.",kw:["eigentlich","noch","hätten Sie"],model:"Ja, hätten Sie eigentlich noch Vollkornbrot? Ich weiß nicht ob das heute schon ausverkauft ist."},
  {id:"s4",badge:"Telefon",badge_color:"var(--blue)",scene:"Sie rufen einen IT-Leiter an den Sie noch nicht kennen. Er hebt ab.",task:"Einstieg in ein Kaltgespräch: Vorstellung, Zweck, um Erlaubnis bitten. Max. 3 Sätze.",kw:["kurz halten","konkret","Erlaubnis holen"],model:"Guten Tag, mein Name ist Marius Docolina, ich rufe von IT-Check Deutschland an. Wir helfen mittelständischen Unternehmen dabei, IT-Infrastrukturangebote neutral zu vergleichen. Haben Sie zwei Minuten – oder passt es gerade nicht?"},
  {id:"s5",badge:"Meeting",badge_color:"var(--green)",scene:"Sie sind in einem Meeting. Jemand erklärt etwas sehr schnell und Sie haben es nicht verstanden.",task:"Höflich nachfragen ohne inkompetent zu wirken. Zeige aktives Zuhören.",kw:["kurz nachfragen","verstehe ich richtig","noch einmal"],model:"Entschuldigung, darf ich kurz nachfragen – verstehe ich das richtig, dass Sie damit meinen...? Ich möchte sicherstellen, dass ich den Punkt korrekt erfasst habe."},

function xpForLv(l){return l*150}
function lvL(l){return l===1?'B1':l===2?'B2':'C1'}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function today(){return new Date().toISOString().split('T')[0]}
function Dots(){return '<span class="dots"><span></span><span></span><span></span></span>'}
function pct(att,err){return att>0?Math.round(((att-err)/att)*100):null}

function updStreak(P,mod){
  const t=today(); if(P.streak.lastDay===t)return;
  const y=new Date(Date.now()-86400000).toISOString().split('T')[0];
  P.streak={days:P.streak.lastDay===y?P.streak.days+1:1,lastDay:t};
  saveP(mod);
}
function award(P,mod,catId,amt,ok){
  const prev=P.level; P.xp+=amt;
  while(P.xp>=xpForLv(P.level)){P.xp-=xpForLv(P.level);P.level++;}
  const cd=P.cats[catId]; if(!cd)return;
  cd.att++;if(!ok)cd.err++;
  if(cd.att>=3){const r=cd.err/cd.att;
    if(r<0.2&&cd.lv<3)cd.lv=Math.min(3,cd.lv+1);
    else if(r>0.6&&cd.lv>1)cd.lv=Math.max(1,cd.lv-1);}
  P.weakest=Object.entries(P.cats).filter(([,v])=>v.att>=2&&(v.err/v.att)>0.4).map(([k])=>k);
  P.totalSessions=(P.totalSessions||0)+1;
  if(P.level>prev)lvUpPending=true;
  updStreak(P,mod); saveP(mod);
}

async function streamClaude(prompt, onChunk){
  const key=LS.get('ts_key');
  if(!key)throw new Error('Kein API-Key.');
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:700,stream:true,
      messages:[{role:'user',content:prompt}]})
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||'API error');}
  const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
  while(true){
    const{done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const line of lines){
      if(line.startsWith('data:')){const d=line.slice(5).trim();if(d==='[DONE]')continue;
        try{const j=JSON.parse(d);if(j.type==='content_block_delta'&&j.delta?.text)onChunk(j.delta.text);}catch{}
      }
    }
  }
}
async function callClaude(prompt){
  const key=LS.get('ts_key');
  if(!key)throw new Error('Kein API-Key.');
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:700,
      messages:[{role:'user',content:prompt}]})
  });
  const d=await resp.json();if(d.error)throw new Error(d.error.message);
  return d.content[0].text;
}

  { id:"s13", question:"Was bedeutet CPU-Overcommit in der Servervirtualisierung?", options:["Der Prozessor wird übertaktet","Mehr virtuelle CPUs werden zugewiesen als physische Kerne vorhanden sind","Zwei Prozessoren arbeiten als einer","Der Prozessor wird für Backup-Aufgaben reserviert"], correct:1, explanation:"Overcommit bedeutet: mehr vCPUs zugewiesen als physische Kerne da sind. Funktioniert weil VMs selten alle CPUs gleichzeitig maximal nutzen. Zu hoher Overcommit-Faktor führt zu Performance-Problemen (CPU-Contention)." },
  { id:"s14", question:"Was ist NUMA (Non-Uniform Memory Access) bei Servern?", options:["Ein besonders schnelles RAM-Modul","Eine Speicherarchitektur bei Multi-Prozessor-Systemen wo jede CPU schnelleren Zugriff auf ihren lokalen RAM hat","Ein Netzwerkspeicher-Protokoll","Ein RAID-ähnliches Speicherkonzept"], correct:1, explanation:"Bei Dual-Socket-Servern hat jede CPU ihren eigenen RAM-Kanal (NUMA-Node). Zugriff auf eigenen RAM ist schneller als auf den RAM der anderen CPU. Betriebssystem und Hypervisor müssen NUMA-aware sein um Performance zu optimieren." },
  { id:"s15", question:"Was versteht man unter Server-Konsolidierung?", options:["Zusammenführung mehrerer Serverstandorte in einem Gebäude","Mehrere physische Server durch Virtualisierung auf weniger Hardware zusammenfassen – weniger Kosten, weniger Energie","Backups auf einem zentralen Server sammeln","Alle Server auf denselben Hersteller vereinheitlichen"], correct:1, explanation:"Server-Konsolidierung reduziert die Anzahl physischer Server durch Virtualisierung. Statt 10 physischer Server mit je 10% Auslastung: 2 physische Hosts mit je 5 VMs. Ergebnis: geringere Hardware-, Strom- und Wartungskosten." },
  { id:"s16", question:"Was ist ein Out-of-Band Management System bei Servern?", options:["Verwaltung über das normale Betriebsnetzwerk","Separates Verwaltungsnetzwerk unabhängig vom Produktionsnetzwerk – Server ist auch bei OS-Absturz erreichbar","Verwaltung über WLAN","Verwaltung über den USB-Port"], correct:1, explanation:"Out-of-Band nutzt einen separaten Netzwerkanschluss (z.B. iDRAC bei Dell, iLO bei HPE). Selbst wenn Windows abstürzt oder der Server nicht bootet, ist er über diesen Kanal erreichbar. Essentiell für Remote-Standorte ohne lokales IT-Personal." },
  { id:"s17", question:"Was ist der Unterschied zwischen Scale-Up und Scale-Out bei Servern?", options:["Scale-Up bedeutet Software-Update, Scale-Out Hardware-Tausch","Scale-Up: bestehenden Server aufrüsten (mehr RAM, CPU). Scale-Out: weitere Server hinzufügen und Last verteilen","Es gibt keinen wesentlichen Unterschied","Scale-Up ist für kleine, Scale-Out für große Unternehmen"], correct:1, explanation:"Scale-Up (vertikal): Server bekommt mehr Ressourcen – mehr RAM, schnellere CPUs. Hat physische Grenzen. Scale-Out (horizontal): weitere Server werden hinzugefügt, Last verteilt sich. Flexibler und ohne Hardware-Grenzen, aber komplexer." },
  { id:"s18", question:"Was ist ein Serverraum-KVM-Switch?", options:["Ein besonderer Server-Prozessor","Keyboard-Video-Mouse Switch – ein Gerät das mehrere Server mit einem einzigen Monitor, Tastatur und Maus bedienbar macht","Ein Netzwerk-Switch für Server-Verbindungen","Ein Stromverteiler im Rack"], correct:1, explanation:"KVM-Switch ermöglicht die Bedienung mehrerer Server mit einer Konsole. Praktisch im Serverraum: Ein Monitor, eine Tastatur, eine Maus – und man schaltet zwischen 8, 16 oder 32 Servern um. Heute oft als IP-KVM mit Remote-Zugriff." },
  { id:"s19", question:"Was bedeutet TDP bei Server-Prozessoren?", options:["Total Data Processing – maximale Datenverarbeitungsrate","Thermal Design Power – maximale Wärmeabgabe des Prozessors in Watt","Transfer Data Protocol – ein Netzwerkstandard","Total Disk Performance"], correct:1, explanation:"TDP gibt an, wieviel Wärme (Watt) die Kühlung mindestens abführen muss. Hoher TDP bedeutet mehr Kühlaufwand und höhere Betriebskosten. Wichtig für Rechenzentrum-Planung: PDU-Kapazität, Kühlung und TCO-Kalkulation." },
  { id:"s20", question:"Was ist ein Server-Cluster und welchen Hauptvorteil bietet er?", options:["Mehrere Server im selben Rack","Mehrere Server die als Einheit zusammenarbeiten – bietet Hochverfügbarkeit oder Lastenverteilung","Eine Sammlung von Backup-Servern","Server an verschiedenen geografischen Standorten"], correct:1, explanation:"Ein Cluster verbindet mehrere Server zu einem logischen System. Failover-Cluster: fällt ein Knoten aus, übernimmt ein anderer automatisch (HA). Load-Balancing-Cluster: Anfragen werden auf mehrere Knoten verteilt. Ergebnis: höhere Verfügbarkeit und Performance." },
  { id:"s21", question:"Was versteht man unter einem 'Server-Snapshot'?", options:["Ein Screenshot des Server-Bildschirms","Momentaufnahme des kompletten Server-Zustands (RAM, Festplatte, Konfiguration) – ermöglicht schnellen Rollback","Eine Art schnelles Backup nur der Konfigurationsdateien","Ein automatisierter Server-Test"], correct:1, explanation:"Snapshots frieren den aktuellen Zustand einer VM ein. Bevor ein Update oder riskante Änderung: Snapshot erstellen. Geht etwas schief – in Sekunden auf den vorherigen Zustand zurück. Kein vollständiges Backup-Ersatz, aber essentiell für sicheres Change Management." },
  { id:"s22", question:"Was ist der Unterschied zwischen einem Dedicated Server und einem VPS?", options:["Dedicated ist teurer aber identisch in der Funktion","Dedicated: gesamte physische Hardware für einen Kunden. VPS: virtuelle Maschine auf geteilter Hardware mit garantierten Ressourcen","VPS ist immer leistungsfähiger","Dedicated Server stehen immer in der Cloud"], correct:1, explanation:"Dedicated Server: ein Kunde, ein physischer Server – volle Performance, volle Isolation. VPS (Virtual Private Server): VM auf einem geteilten Hypervisor mit definierten CPU/RAM-Kontingenten. VPS günstiger, Dedicated performanter und isolierter." },
  { id:"s23", question:"Was bedeutet 'Dual-Port' bei Server-Netzwerkkarten?", options:["Die Karte unterstützt zwei Protokolle","Zwei physische Netzwerkanschlüsse auf einer Karte – für Redundanz oder höheren Durchsatz durch Bonding/Teaming","Doppelte Übertragungsgeschwindigkeit pro Port","Die Karte wird mit zwei Kabeln mit Strom versorgt"], correct:1, explanation:"Dual-Port NIC (Network Interface Card) hat zwei unabhängige Anschlüsse. Betrieb 1: Redundanz – fällt ein Port aus, übernimmt der andere. Betrieb 2: Bonding/Teaming – beide Ports aktiv für doppelten Durchsatz. Standard in Unternehmensservern." },
  { id:"s24", question:"Was ist ein Baseboard Management Controller (BMC)?", options:["Ein Motherboard-Chipsatz für Hochleistungsserver","Ein eigenständiger Mikrocontroller auf dem Mainboard der unabhängig vom Haupt-OS funktioniert und Remote-Verwaltung ermöglicht","Ein Speichercontroller für NVME-SSDs","Ein Temperatursensor im Servergehäuse"], correct:1, explanation:"Der BMC ist ein kleiner Prozessor auf dem Mainboard mit eigener Firmware und eigenem Netzwerkanschluss. Er überwacht Sensoren (Temperatur, Spannung, Lüfter) und ermöglicht Remote-Konsole. Basis für IPMI, iDRAC (Dell), iLO (HPE)." },
  { id:"s25", question:"Was versteht man unter 'Server-Provisioning'?", options:["Die monatliche Abrechnung von Server-Ressourcen","Der Prozess der Bereitstellung und Konfiguration eines Servers für eine bestimmte Aufgabe","Die physische Installation im Rack","Die Planung des Serverraumlayouts"], correct:1, explanation:"Provisioning umfasst alle Schritte von der Bestellung bis zum einsatzbereiten Server: Hardware aufstellen, OS installieren, Software konfigurieren, in Monitoring aufnehmen. Automatisiertes Provisioning (Ansible, Puppet, Terraform) spart enorm Zeit bei größeren Umgebungen." },
  { id:"s26", question:"Was ist der Unterschied zwischen einem Webserver und einem Mailserver?", options:["Webserver sind immer schneller","Webserver liefert HTTP/HTTPS-Inhalte (Websites), Mailserver empfängt/sendet E-Mails über SMTP/IMAP/POP3","Sie erfüllen identische Aufgaben","Mailserver sind immer in der Cloud"], correct:1, explanation:"Webserver (z.B. Apache, Nginx, IIS) verarbeitet HTTP-Anfragen und liefert Webseiten aus. Mailserver (z.B. Exchange, Postfix) verwaltet E-Mail-Postfächer und Transport. Im Mittelstand oft kombiniert auf einem physischen Host als verschiedene VMs." },
  { id:"s27", question:"Was bedeutet 'Server-Hardening'?", options:["Die physische Befestigung von Servern im Rack","Sicherheitshärtung: nicht benötigte Dienste deaktivieren, Ports schließen, Updates einspielen, Berechtigungen minimieren","Leistungsoptimierung durch Übertaktung","Physikalische Absicherung des Serverraums"], correct:1, explanation:"Hardening reduziert die Angriffsfläche: unnötige Dienste stoppen, Standard-Passwörter ändern, Firewall konfigurieren, minimale Benutzerrechte vergeben. Ein frisch installierter Server ist nie 'sicher' – er muss aktiv gehärtet werden." },
  { id:"s28", question:"Was ist ein Terminalserver (Remote Desktop Server)?", options:["Ein Server ausschließlich für Druckaufgaben","Ein Server auf dem mehrere Benutzer gleichzeitig Windows-Desktops oder Anwendungen remote nutzen","Ein Server der Netzwerk-Terminals verwaltet","Ein Server für Videokonferenzen"], correct:1, explanation:"Terminalserver (Windows Server mit RDS-Rolle) ermöglicht mehreren Nutzern gleichzeitig über Remote Desktop auf Anwendungen zuzugreifen. Vorteil: Software nur einmal installieren und pflegen. Klassische Lösung für ERP-Zugriff oder Homeoffice ohne VDI." },
  { id:"s29", question:"Was versteht man unter 'Server-Lifecycle-Management'?", options:["Tägliche Wartungsaufgaben am Server","Strukturierter Prozess von der Beschaffung über den Betrieb bis zur Außerbetriebnahme – typisch 5-7 Jahre","Monatliche Sicherheitsupdates","Die Verwaltung von Server-Lizenzen"], correct:1, explanation:"Server-Lifecycle umfasst: Planung/Beschaffung → Deployment → Betrieb/Wartung → Ende des Herstellersupports → Migration → Entsorgung. Nach 5-7 Jahren steigen Ausfallwahrscheinlichkeit und Wartungskosten stark an. Proaktives Lifecycle-Management vermeidet Notfall-Investitionen." },
  { id:"s30", question:"Was ist der Unterschied zwischen einem Produkions- und einem Testsystem?", options:["Kein Unterschied – beide laufen identische Software","Produktionssystem läuft im echten Betrieb mit echten Daten. Testsystem ist isoliert für Entwicklung und Tests ohne Auswirkung auf den Betrieb","Testsysteme sind immer in der Cloud","Produktionssysteme haben kein Backup"], correct:1, explanation:"Produktionssystem ist das 'echte' System das im Tagesbetrieb genutzt wird. Testsystem (auch Staging) ist eine Kopie zum sicheren Ausprobieren. Grundregel: Niemals Änderungen direkt in Produktion testen. Im Mittelstand oft vernachlässigt – mit teuren Folgen bei Fehler." },
],

storage: [
  { id:"st1", question:"Was ist der Unterschied zwischen SAN und NAS?", options:["SAN ist schneller, NAS günstiger – sonst identisch","SAN (Storage Area Network) stellt blockbasierten Speicher über Fibre Channel oder iSCSI bereit. NAS (Network Attached Storage) stellt dateibasierten Speicher über SMB/NFS im Netzwerk bereit","NAS ist für Server, SAN für Clients","SAN ist Cloud-Speicher, NAS ist lokal"], correct:1, explanation:"SAN präsentiert sich dem Server als lokale Festplatte (Blockebene). NAS ist ein Netzwerklaufwerk (Dateiebene). SAN: hohe Performance für Datenbanken/Virtualisierung. NAS: einfache Dateifreigaben, Backup-Ziel, Archiv." },
  { id:"st2", question:"Was bedeutet RAID 1 und welchen Vorteil bietet es?", options:["Datenverteilung auf mehrere Festplatten für mehr Speed","Spiegelung: identische Daten auf zwei Festplatten – maximale Ausfallsicherheit, eine Festplatte kann ausfallen ohne Datenverlust","Kombination aus RAID 0 und 5","Verschlüsselung der gespeicherten Daten"], correct:1, explanation:"RAID 1 schreibt jeden Block identisch auf zwei Festplatten (Mirroring). Fällt eine aus, läuft alles weiter. Nachteil: 50% Kapazitätsverlust (2x 4TB = 4TB nutzbar). Ideal für Betriebssystem-Volumes oder kritische Daten in kleinen Umgebungen." },
  { id:"st3", question:"Was ist RAID 5 und wie viele Festplatten werden mindestens benötigt?", options:["Mindestens 2 Festplatten, Datenspiegelung","Mindestens 3 Festplatten – Daten und Paritätsinformationen werden über alle Festplatten verteilt, eine darf ausfallen","Mindestens 4 Festplatten, zwei dürfen ausfallen","Mindestens 5 Festplatten, daher der Name"], correct:1, explanation:"RAID 5 verteilt Daten + Parität stripe-weise über alle Festplatten. Bei 3x 4TB: 8TB nutzbar, 4TB Parität. Eine Festplatte darf ausfallen – die Daten werden aus Parität rekonstruiert. Schreibperformance etwas schlechter wegen Paritätsberechnung." },
  { id:"st4", question:"Was ist RAID 6 und wann ist es sinnvoll?", options:["RAID 5 mit einem zusätzlichen Parity-Block – zwei Festplatten dürfen gleichzeitig ausfallen","RAID mit 6 Festplatten Mindestanforderung und ohne Redundanz","Eine Kombination aus RAID 1 und 5","RAID 6 ist veraltet und wird nicht mehr eingesetzt"], correct:1, explanation:"RAID 6 verwendet doppelte Parität – zwei Festplatten dürfen gleichzeitig ausfallen. Wichtig bei großen Festplatten (8TB+): bei RAID 5 Rebuild kann eine zweite Platte ausfallen bevor der Rebuild fertig ist. Bei großen Arrays: RAID 6 oder RAID 10." },
  { id:"st5", question:"Was ist RAID 10 (1+0) und welchen Vorteil bietet es gegenüber RAID 5?", options:["RAID 10 bietet keine Vorteile gegenüber RAID 5","RAID 10 kombiniert Spiegelung und Striping – höhere Performance und schnellerer Rebuild bei Ausfall, benötigt aber 50% mehr Kapazität","RAID 10 braucht weniger Festplatten als RAID 5","RAID 10 ist nur für SSDs geeignet"], correct:1, explanation:"RAID 10: erst spiegeln (RAID 1), dann stripen (RAID 0). Vorteil: sehr hohe Lese-/Schreibperformance und schneller Rebuild (nur Spiegel-Partner muss kopiert werden). Nachteil: 50% Kapazitätsverlust. Ideal für Datenbanken die Performance und Sicherheit brauchen." },
  { id:"st6", question:"Was ist der Unterschied zwischen HDD und SSD in einem Serverkontext?", options:["SSDs sind immer besser – HDDs werden nicht mehr eingesetzt","HDD: günstig pro GB, langsam, mechanisch – gut für große Datenmengen. SSD: teuer pro GB, sehr schnell, keine beweglichen Teile – ideal für performancekritische Workloads","HDDs sind schneller für sequentielle Lese-Zugriffe","SSDs haben eine kürzere Lebensdauer als HDDs"], correct:1, explanation:"HDDs (10TB+, günstig) für Backup, Archiv, NAS. SSDs (NVMe/SATA) für Betriebssystem, Datenbanken, VM-Storage wo IOPS zählen. Hybrid: SSD-Tier für heiße Daten, HDD-Tier für kalte. In modernen Serverumgebungen oft tiered Storage." },
  { id:"st7", question:"Was bedeutet 'Thin Provisioning' beim Storage?", options:["Festplatten werden auf minimale Kapazität reduziert","Virtuellen Volumes wird mehr Speicher zugewiesen als physisch vorhanden – tatsächlicher Platz wird erst bei Bedarf genutzt","Eine Methode zur Datenkompression","Festplatten werden dünn formatiert für schnellere Performance"], correct:1, explanation:"Thin Provisioning: einem Volume werden z.B. 1TB zugewiesen, aber es belegt anfangs nur tatsächlich geschriebene Daten. Vorteil: bessere Speicherauslastung. Risiko: wenn viele Volumes gleichzeitig wachsen kann der physische Speicher voll werden (Overcommit)." },
  { id:"st8", question:"Was ist ein Storage-Tiering System?", options:["Ein System das Festplatten nach Hersteller sortiert","Automatische Verschiebung häufig genutzter Daten auf schnelle SSDs und seltener genutzter Daten auf günstige HDDs","Ein RAID-System mit drei Ebenen","Eine Backup-Strategie mit drei Kopien"], correct:1, explanation:"Storage Tiering verschiebt 'heiße' Daten (oft zugegriffen) automatisch auf schnelle SSDs (Tier 1) und 'kalte' Daten auf große, günstige HDDs (Tier 2) oder Tape (Tier 3). Maximale Performance für kritische Daten bei optimierten Kosten für Archivdaten." },
  { id:"st9", question:"Was ist iSCSI und welchen Vorteil bietet es?", options:["Ein Wireless-Storage-Protokoll","SCSI-Kommandos über normales IP-Netzwerk – günstiger als Fibre Channel SAN, nutzt vorhandene Netzwerkinfrastruktur","Ein Dateisystem für NAS-Systeme","Ein Verschlüsselungsprotokoll für Storage"], correct:1, explanation:"iSCSI kapselt SCSI-Befehle in TCP/IP-Pakete. Server sieht das Storage als lokale Festplatte (Blockzugriff), aber es läuft über normales Ethernet. Vorteil: kein teures Fibre Channel nötig. Für Mittelstand oft die beste SAN-Alternative." },
  { id:"st10", question:"Was ist der Unterschied zwischen einem All-Flash-Array und einem Hybrid-Array?", options:["All-Flash ist nur für Großunternehmen","All-Flash: ausschließlich SSDs – maximale Performance. Hybrid: Kombination aus SSDs und HDDs – ausgewogenes Preis-Leistungs-Verhältnis","Hybrid-Arrays sind immer schneller","All-Flash-Arrays haben keine Redundanz"], correct:1, explanation:"All-Flash-Arrays (AFA) bieten niedrigste Latenz und höchste IOPS – ideal für Datenbanken, VDI, ERP. Hybrid-Arrays kombinieren SSD-Cache mit HDD-Kapazität. AFAs werden immer günstiger – im Mittelstand zunehmend als Primärspeicher eingesetzt." },
  { id:"st11", question:"Was bedeutet Deduplication beim Storage?", options:["Doppelte Festplatten werden entfernt","Identische Datenblöcke werden nur einmal gespeichert – Referenzen zeigen auf dasselbe Objekt. Spart Speicherplatz besonders bei Backups und VMs","Eine Art RAID ohne Redundanz","Komprimierung von Dateinamen"], correct:1, explanation:"Deduplication erkennt identische Datenblöcke und speichert diese nur einmal. Bei Backup-Umgebungen mit ähnlichen Servern: Einsparungen bis 95% möglich. VMs mit gleichem Basis-OS haben viele identische Blocks. Primär-Storage: In-line Dedup, Backup: Post-process Dedup." },
  { id:"st12", question:"Was ist ein Object Storage und wann wird er eingesetzt?", options:["Ein Storage-System ausschließlich für Datenbankzugriffe","Speichersystem das Daten als Objekte mit Metadaten und eindeutiger ID ablegt – skalierbar, günstig, ideal für unstrukturierte Daten und Cloud-native Anwendungen","Ein schnelles SAN-System für virtuelle Maschinen","Ein lokales NAS für Bürodateien"], correct:1, explanation:"Object Storage (z.B. MinIO, AWS S3) speichert Dateien als Objekte mit Metadaten – kein klassisches Dateisystem. Skaliert auf Petabyte-Ebene, sehr günstig. Ideal für: Backup-Ziele, Archiv, Mediadaten, Cloud-Backups. S3-kompatibel ist heute Standard." },
  { id:"st13", question:"Was ist JBOD (Just a Bunch of Disks)?", options:["Ein besonders leistungsfähiges RAID-System","Festplatten werden ungruppert betrieben – jede Platte ist einzeln ansprechbar ohne RAID-Verbund","Ein Speichersystem ausschließlich für SSDs","Eine Backup-Konfiguration"], correct:1, explanation:"JBOD bedeutet: keine RAID-Konfiguration, jede Festplatte ist ein eigenes Volume. Vorteil: kein Kapazitätsverlust durch RAID-Overhead, individuelle Festplatten ansprechbar. Nachteil: keine Redundanz. Einsatz: als Erweiterungsgehäuse oder wenn Software-RAID verwendet wird." },
  { id:"st14", question:"Was ist der Unterschied zwischen NL-SAS und SAS Festplatten?", options:["NL-SAS ist schneller als SAS","NL-SAS: Near-Line SAS – günstigere, langsamere Festplatten (7.200 RPM) für Kapazität. SAS: schnellere Enterprise-Festplatten (10.000-15.000 RPM) für Performance","SAS ist veraltet, NL-SAS ist modern","Es gibt keinen Unterschied"], correct:1, explanation:"SAS (Serial Attached SCSI): 10.000 oder 15.000 RPM, hohe IOPS, teuer – für Datenbanken. NL-SAS: 7.200 RPM, günstig pro GB, hohe Kapazität – für Backup und Archiv. Heute werden NL-SAS zunehmend durch SSDs (Kapazitäts-SSDs) ersetzt." },
  { id:"st15", question:"Was versteht man unter Storage-Replication?", options:["Das Kopieren von Daten auf Tape","Synchrone oder asynchrone Spiegelung von Daten auf ein zweites Storage-System – für Disaster Recovery oder Hochverfügbarkeit","Das Erstellen von RAID-Verbünden","Das Verteilen von Daten auf mehrere Festplatten"], correct:1, explanation:"Storage Replication kopiert Daten kontinuierlich auf ein zweites System (oft anderem Standort). Synchron: Schreibvorgang gilt erst als abgeschlossen wenn beide Systeme bestätigen (null Datenverlust). Asynchron: Zeitverzögerung möglich (RPO > 0). Basis für DR-Konzepte." },
  { id:"st16", question:"Was ist ein NVMe-SSD und warum ist er schneller als SATA-SSD?", options:["NVMe und SATA sind gleichwertig","NVMe nutzt PCIe-Bus direkt statt SATA-Controller – deutlich geringere Latenz und 4-7x höhere Transferraten","NVMe ist nur bei Temperaturen über 40 Grad schneller","NVMe ist schneller wegen größerer Speicherchips"], correct:1, explanation:"SATA wurde für Festplatten entwickelt – Bottleneck bei SSDs. NVMe (Non-Volatile Memory Express) kommuniziert direkt über PCIe mit der CPU, mit Queues optimiert für Flash. Ergebnis: SATA SSD ~550 MB/s, NVMe SSD bis 7.000 MB/s. In Server-Umgebungen NVMe zunehmend Standard." },
  { id:"st17", question:"Was bedeutet RPO (Recovery Point Objective) im Storage-Kontext?", options:["Die Zeit bis ein System nach Ausfall wieder läuft","Der maximal akzeptable Datenverlust in Zeit gemessen – wie alt dürfen die wiederhergestellten Daten sein?","Die maximale Speicherkapazität eines Systems","Die Zeit für einen vollständigen Backup-Zyklus"], correct:1, explanation:"RPO definiert: wie viel Datenverlust ist tolerierbar? RPO = 0: kein Datenverlust erlaubt (synchrone Replikation nötig). RPO = 1 Stunde: bis zu einer Stunde Daten dürfen verloren gehen (stündliche Backups ausreichend). Kritisch für Backup-Strategie und Kosten." },
  { id:"st18", question:"Was ist ein SSD Write Endurance (TBW) Wert?", options:["Die maximale Lesegeschwindigkeit einer SSD","Total Bytes Written – die garantierte Datenmenge die vor dem Ausfall auf die SSD geschrieben werden kann","Die Temperaturbeständigkeit der SSD","Die Anzahl der möglichen Verbindungen"], correct:1, explanation:"Flash-Speicherzellen können nur begrenzt viele Male beschrieben werden. TBW gibt die garantierte Lebensdauer an. Beispiel: SSD mit 600 TBW – nach 600 TB Schreibzugriffen können Zellen ausfallen. Enterprise-SSDs haben deutlich höhere TBW als Consumer-SSDs." },
  { id:"st19", question:"Was ist ein Fibre Channel SAN und wann lohnt es sich?", options:["Ein drahtloses Storage-Netzwerk","Dediziertes Hochgeschwindigkeits-Netzwerk (8/16/32 Gbps) ausschließlich für Storage – maximale Performance und Zuverlässigkeit, aber teuer","Günstiger als iSCSI und einfacher zu verwalten","Ausschließlich für Backup-Systeme geeignet"], correct:1, explanation:"Fibre Channel ist ein dediziertes Netzwerk für Storage – kein normales Ethernet. Vorteile: sehr niedrige Latenz, hohe Bandbreite, kein Einfluss durch normalen Netzwerkverkehr. Nachteil: teure HBAs, Switches, Kabel und spezielles Know-how. Lohnt sich ab mittelgroßen bis großen Unternehmensumgebungen." },
  { id:"st20", question:"Was versteht man unter Snapshot-basiertem Backup?", options:["Backup durch physischen Festplatten-Klon","Konsistente Momentaufnahme des Storage-Zustands zu einem Zeitpunkt – Datenbank/VM läuft weiter während Backup erstellt wird","Regelmäßige Kopie aller Festplatten im laufenden Betrieb","Eine Art differentielles Backup"], correct:1, explanation:"Storage-Snapshots frieren den logischen Zustand ein (Copy-on-Write). Backup-Software nutzt Snapshots um konsistente Sicherungen zu erstellen ohne den Betrieb zu unterbrechen. VMs, Datenbanken, NAS-Shares können so gesichert werden während sie aktiv sind." },
  { id:"st21", question:"Was ist der Unterschied zwischen lokalem Storage und Shared Storage in Virtualisierungsumgebungen?", options:["Kein Unterschied für virtuelle Maschinen","Lokaler Storage: an einen Host gebunden, VMs können nicht verschoben werden. Shared Storage: mehrere Hosts zugreifen gleichzeitig – ermöglicht vMotion, HA und DRS","Shared Storage ist immer langsamer","Lokaler Storage ist teurer"], correct:1, explanation:"Für HA-Features wie vMotion (VM live auf anderen Host verschieben) oder automatisches Failover braucht man Shared Storage (SAN/NAS). Alle Hosts im Cluster sehen dasselbe Storage. Lokaler Storage: VM ist an diesen Host gebunden – kein Failover möglich." },
  { id:"st22", question:"Was ist ein Hot Spare bei RAID-Systemen?", options:["Eine besonders schnelle Reserve-Festplatte","Eine Ersatz-Festplatte die permanent im Array eingebaut ist und bei Ausfall einer Festplatte automatisch in den Rebuild-Prozess einspringt","Ein externes Backup-Laufwerk","Eine SSD die als Cache für HDDs dient"], correct:1, explanation:"Hot Spare: eine Festplatte sitzt bereit im Array ohne aktiv genutzt zu werden. Fällt eine Datenfestplatte aus, startet der RAID-Controller sofort automatisch den Rebuild auf dem Hot Spare – ohne manuellen Eingriff. Reduziert die gefährliche Zeit mit reduzierter Redundanz erheblich." },
  { id:"st23", question:"Was bedeutet Inline Compression beim Storage?", options:["Eine Methode zur Beschleunigung von Schreibzugriffen","Daten werden vor dem Schreiben auf Disk komprimiert – spart Kapazität bei komprimierbaren Daten (Texte, Logs, VMs)","Komprimierung von Netzwerkpaketen beim Storage-Zugriff","Eine Art von RAID-Optimierung"], correct:1, explanation:"Inline Compression komprimiert Daten direkt im Schreibpfad bevor sie auf Flash/Disk landen. Kombination mit Deduplication: oft 3:1 bis 5:1 Einsparungen bei typischen Unternehmens-Workloads. All-Flash-Arrays nutzen das intensiv um effektive Kosten pro GB zu senken." },
  { id:"st24", question:"Was ist ein Tape-Library und wann ist es noch relevant?", options:["Veraltete Technologie die nicht mehr eingesetzt wird","Automatisiertes Bandarchiv mit Roboterarm – extrem günstig pro GB, air-gapped, langlebig – ideal für Langzeitarchivierung und Ransomware-Schutz","Ein RAID-System mit Magnetband","Ein Backup-System ausschließlich für Großrechner"], correct:1, explanation:"Tape ist lebendiger denn je: 1 TB auf Tape kostet Bruchteile von Cent. Tape-Libraries speichern Petabytes. Wichtigster Vorteil heute: Air-Gap – Ransomware kann Offline-Tapes nicht verschlüsseln. LTFS-Standard macht Tapes wie USB-Sticks nutzbar. Für Langzeitarchiv und Compliance unverzichtbar." },
  { id:"st25", question:"Was ist der Unterschied zwischen einem Scale-Up und Scale-Out Storage-System?", options:["Scale-Up ist teurer, sonst gleich","Scale-Up: bestehendes System aufrüsten (mehr Festplatten, mehr Shelfs). Scale-Out: weitere Storage-Nodes hinzufügen die ihren Speicher im Cluster teilen","Scale-Out ist veraltet","Scale-Up ist für Cloud, Scale-Out für On-Premise"], correct:1, explanation:"Scale-Up hat physische Grenzen – irgendwann ist das System voll. Scale-Out (z.B. Ceph, HDFS, Nutanix Objects) wächst durch Hinzufügen weiterer Knoten theoretisch unbegrenzt. Für große Umgebungen und Object Storage ist Scale-Out heute Standard." },
  { id:"st26", question:"Was versteht man unter Storage-Virtualisierung?", options:["Das Erstellen virtueller Festplatten in VMs","Abstraktion der physischen Storage-Ressourcen – mehrere heterogene Storage-Systeme werden als einheitlicher Pool präsentiert","Eine Art von RAID-Konfiguration","Virtuelle Backups von Storage-Systemen"], correct:1, explanation:"Storage-Virtualisierung (z.B. IBM SVC, DataCore) legt eine Software-Schicht über verschiedene Storage-Systeme. Vorteil: heterogene Hardware wird einheitlich verwaltet, unterbrechungsfreie Migration, Storage-Features unabhängig von Hersteller-Hardware. Ermöglicht schrittweisen Hardwareaustausch." },
  { id:"st27", question:"Was ist CIFS/SMB und wofür wird es eingesetzt?", options:["Ein Verschlüsselungsprotokoll für Storage","Common Internet File System / Server Message Block – Windows-Protokoll für Netzwerkfreigaben. Grundlage für Dateiserver und NAS in Windows-Umgebungen","Ein iSCSI-Nachfolgeprotokoll","Ein Protokoll für Datenbanken"], correct:1, explanation:"SMB ist das native Windows-Protokoll für Dateifreigaben. Jede Windows-Netzwerkfreigabe nutzt SMB. NAS-Systeme von NetApp, Synology, QNAP sprechen SMB um Windows-Clients zu bedienen. SMB3 (Windows 8+) bietet Verschlüsselung, Multichannel und Transparent Failover." },
  { id:"st28", question:"Was ist der Unterschied zwischen einem Backup und einem Archiv?", options:["Kein Unterschied – beide sichern Daten","Backup: Sicherung aktiver Daten für schnelle Wiederherstellung nach Ausfall. Archiv: Langzeitspeicherung von Daten die nicht mehr aktiv benötigt werden, aber aus compliance- oder rechtlichen Gründen aufbewahrt werden müssen","Backups sind kürzer als Archive","Archive werden öfter erstellt"], correct:1, explanation:"Backup: operative Datensicherung, relativ kurze Aufbewahrung (Wochen/Monate), schnelle Wiederherstellung. Archiv: Langzeitspeicherung (Jahre/Jahrzehnte), Compliance, GoBD (10 Jahre für Buchhaltung), unveränderlich (WORM). Verschiedene Anforderungen brauchen verschiedene Systeme." },
  { id:"st29", question:"Was bedeutet IOPS bei Storage-Systemen?", options:["Input/Output Per Second – Anzahl der Lese-/Schreiboperationen pro Sekunde","Internet Operations Protocol Standard","Integrated On-chip Processing System","Internal Object Processing Speed"], correct:0, explanation:"IOPS misst wie viele Einzeloperationen ein Storage-System pro Sekunde verarbeiten kann. Relevant besonders bei kleinen zufälligen Zugriffen (Datenbanken, VMs). SSD: hunderttausende IOPS. HDD: einige hundert IOPS. Neben IOPS auch Latenz (ms) und Durchsatz (MB/s) beachten." },
  { id:"st30", question:"Was ist ein Veeam Ready Repository und warum ist die Zertifizierung wichtig?", options:["Ein besonders teures Backup-System","Storage-Systeme die offiziell von Veeam getestet und zertifiziert wurden – garantiert Kompatibilität mit Veeam-Features wie Immutability und Fast Clone","Ein Repository ausschließlich für Cloud-Backups","Eine spezielle RAID-Konfiguration für Veeam"], correct:1, explanation:"Veeam Ready bedeutet: der Storage-Hersteller hat sein System gegen Veeam-Software getestet. Besonders wichtig für Immutable Backups (ransomware-proof) und Fast Clone (schnelle VM-Restores). Im Mittelstand standard: Veeam + Synology/QNAP (NAS) oder Veeam + dediziertes Repository-System." },
],

netzwerk: [
  { id:"n1", question:"Was ist der Unterschied zwischen einem Hub, einem Switch und einem Router?", options:["Alle drei machen dasselbe, nur mit unterschiedlichen Ports","Hub: sendet an alle Ports (veraltet). Switch: sendet gezielt an Ziel-MAC. Router: verbindet verschiedene Netzwerke und leitet IP-Pakete","Switch und Hub sind identisch, Router ist ein Switch mit mehr Ports","Router sind nur für WAN-Verbindungen nötig"], correct:1, explanation:"Hub (veraltet): Broadcast an alle – alle teilen Bandbreite. Switch (Layer 2): lernt MAC-Adressen, sendet gezielt – effizient. Router (Layer 3): verbindet Netzwerksegmente, kennt IP-Routen, trennt Broadcast-Domänen. Im Unternehmen: Switches im LAN, Router am Gateway." },
  { id:"n2", question:"Was ist ein VLAN und welches Problem löst es?", options:["Ein besonders schnelles LAN-Netzwerk","Logische Netzwerktrennung auf einem physischen Switch – trennt Broadcast-Domänen ohne separate Hardware, erhöht Sicherheit und Übersichtlichkeit","Ein drahtloses Netzwerk für Gäste","Eine Verschlüsselungsmethode für Netzwerke"], correct:1, explanation:"VLANs trennen Netzwerksegmente logisch auf derselben physischen Infrastruktur. VLAN 10: Buchhaltung, VLAN 20: Produktion, VLAN 30: Gast-WLAN – alle auf einem Switch, aber komplett getrennt. Sicherheit: ein kompromittiertes Gerät im Gast-VLAN kommt nicht ans Firmennetz." },
  { id:"n3", question:"Was ist der Unterschied zwischen Layer 2 und Layer 3 Switches?", options:["Layer 3 Switches haben mehr Ports","Layer 2: schaltet anhand MAC-Adressen. Layer 3: kann zusätzlich IP-Routing zwischen VLANs/Subnetzen – ersetzt oft den Router für LAN-internes Routing","Layer 2 ist moderner als Layer 3","Layer 3 ist nur für WAN-Verbindungen geeignet"], correct:1, explanation:"Layer 2 Switch vermittelt Frames anhand MAC-Adressen – kennt keine IP. Layer 3 Switch versteht IP und kann zwischen VLANs routen ohne externen Router (inter-VLAN Routing). In größeren LANs: Layer 3 Core-Switch übernimmt Routing, spart separate Router." },
  { id:"n4", question:"Was ist Spanning Tree Protocol (STP) und warum ist es wichtig?", options:["Ein Protokoll für schnellere Netzwerkverbindungen","Verhindert Switching-Loops in redundanten Netzwerktopologien – deaktiviert redundante Pfade und aktiviert sie nur bei Ausfall","Ein Protokoll für VLAN-Konfiguration","Ein Verschlüsselungsprotokoll für Switches"], correct:1, explanation:"Redundante Switch-Verbindungen sind gut für HA – können aber Switching-Loops verursachen (Broadcast-Sturm lähmt Netz). STP/RSTP blockiert redundante Pfade logisch. Fällt der aktive Pfad aus, aktiviert STP automatisch den Backup-Pfad. RSTP ist moderner (schnellere Konvergenz)." },
  { id:"n5", question:"Was ist LACP (Link Aggregation Control Protocol)?", options:["Ein Protokoll zur automatischen IP-Vergabe","Bündelt mehrere physische Netzwerkleitungen zu einem logischen Link – mehr Durchsatz und Redundanz","Ein Protokoll für VLAN-Konfiguration","Eine Methode zur Verschlüsselung von Netzwerkdaten"], correct:1, explanation:"LACP (802.3ad) bündelt z.B. zwei 1-GbE-Ports zu einem 2-GbE-Trunk. Vorteile: mehr Bandbreite UND Redundanz. Fällt ein Kabel aus, arbeitet der andere Port weiter. Standard zwischen Servern und Switches in Unternehmensnetzen. Voraussetzung: Switch muss LACP unterstützen." },
  { id:"n6", question:"Was ist der Unterschied zwischen 1GbE, 10GbE und 25GbE?", options:["Nur Bezeichnungen verschiedener Hersteller ohne Leistungsunterschied","Geschwindigkeitsklassen: 1 Gigabit/s, 10 Gigabit/s, 25 Gigabit/s – höhere Klassen für Backbone, Server-Uplinks und Storage-Traffic","10GbE ist nur für WAN geeignet","25GbE ist ausschließlich für Rechenzentren"], correct:1, explanation:"1GbE: Standard-Clients und einfache Server. 10GbE: Server, Storage-Zugriff, Switch-Uplinks. 25GbE: moderne Server (kostengünstiger als 40GbE), HCI-Knoten. 100GbE: Rechenzentrum-Backbone. Im Mittelstand heute: 1GbE Clients, 10GbE Server/Uplinks becoming Standard." },
  { id:"n7", question:"Was ist BGP (Border Gateway Protocol) und wo wird es eingesetzt?", options:["Ein internes Routing-Protokoll für kleine Netzwerke","Das Routing-Protokoll des Internets – tauscht Routing-Informationen zwischen autonomen Systemen aus, relevant bei Multihoming (mehrere ISPs)","Ein Protokoll für WLAN-Verbindungen","Ein Monitoring-Protokoll für Netzwerke"], correct:1, explanation:"BGP ist das Protokoll das das Internet zusammenhält. Für Unternehmen relevant bei Multihoming: zwei ISP-Verbindungen, BGP leitet Traffic intelligent. Auch relevant bei MPLS-Anschlüssen. Im normalen LAN unnötig – dort OSPF oder statische Routen ausreichend." },
  { id:"n8", question:"Was ist OSPF und wann wird es in Unternehmensnetzen eingesetzt?", options:["Ein Protokoll nur für Internet-Provider","Open Shortest Path First – dynamisches Routing-Protokoll für Unternehmensnetze mit mehreren Standorten und redundanten Verbindungen","Ein Protokoll für VLAN-Verwaltung","Ein WLAN-Standard für Unternehmen"], correct:1, explanation:"OSPF ist ein Link-State-Protokoll: jeder Router kennt die komplette Netzwerktopologie und berechnet beste Routen selbst. Konvergiert schnell bei Ausfällen. Standard in größeren Unternehmensnetzen mit mehreren Routern und redundanten Pfaden." },
  { id:"n9", question:"Was ist eine Firewall und welche Typen gibt es?", options:["Eine Sicherheitssoftware ausschließlich für Client-PCs","Netzwerk-Sicherheitssystem das Datenverkehr filtert. Typen: Paketfilter (stateless), Stateful Inspection, Next-Generation Firewall (NGFW) mit AppControl/IPS","Eine Firewall kann ausschließlich eingehenden Verkehr filtern","Alle Firewalls funktionieren identisch"], correct:1, explanation:"Paketfilter: prüft nur Quell/Ziel-IP und Port. Stateful: kennt Verbindungsstatus. NGFW: versteht Anwendungen, hat IPS/IDS, URL-Filterung, SSL-Inspection. Im Mittelstand heute: NGFW-Appliances (Fortinet, Sophos, Palo Alto) – reine Paketfilter reichen nicht mehr." },
  { id:"n10", question:"Was ist ein Proxy-Server und welchen Zweck erfüllt er im Unternehmen?", options:["Ein Server der als Stellvertreter zwischen Clients und Internet agiert – ermöglicht Caching, Filterung und Logging von Web-Traffic","Ein Server ausschließlich für externe Benutzer","Eine Art Firewall ohne Filterungsfunktion","Ein Server für E-Mail-Verwaltung"], correct:0, explanation:"Proxy-Server sitzt zwischen Client und Internet. Funktionen: Web-Caching (spart Bandbreite), URL-Filterung (kein Social Media auf Arbeitszeit), Logging (Compliance), SSL-Inspection (verschlüsselten Traffic prüfen). Im Mittelstand oft in NGFW integriert (explicit proxy oder transparent proxy)." },
  { id:"n11", question:"Was ist der Unterschied zwischen einem Site-to-Site VPN und einem Client-VPN?", options:["Beide verbinden dasselbe, nur mit anderer Software","Site-to-Site: verbindet zwei Unternehmensstandorte permanent. Client-VPN: einzelne Benutzer wählen sich von überall sicher ins Firmennetz ein","Client-VPN ist unsicherer als Site-to-Site","Site-to-Site ist veraltet"], correct:1, explanation:"Site-to-Site VPN: Tunnel zwischen zwei Firewalls, verbindet z.B. Hauptsitz und Filiale permanent. Client-VPN (SSL-VPN, IPSec): Mitarbeiter im Homeoffice oder auf Reisen wählen sich ein. Beide nutzen Verschlüsselung – unterschiedliche Anwendungsfälle." },
  { id:"n12", question:"Was ist QoS (Quality of Service) im Netzwerk?", options:["Eine Methode zur Netzwerküberwachung","Priorisierung von Netzwerkdatenverkehr – VoIP und Videokonferenzen erhalten Vorrang vor normalem Datentransfer um Latenz und Jitter zu minimieren","Eine Sicherheitsfunktion gegen Angriffe","Ein Protokoll zur Bandbreitenmessung"], correct:1, explanation:"QoS markiert und priorisiert Pakete. Ohne QoS: ein großer File-Transfer kann VoIP-Qualität ruinieren. Mit QoS: VoIP-Pakete werden bevorzugt behandelt (niedrige Latenz, kein Jitter). Kritisch in Umgebungen mit gemischtem Verkehr (Daten + Sprache + Video)." },
  { id:"n13", question:"Was ist DHCP und welche Probleme können auftreten?", options:["Dynamic Host Configuration Protocol – verteilt automatisch IP-Adressen, Gateway und DNS an Clients","Ein Protokoll für statische IP-Adressen","Ein DNS-Ersatzprotokoll","Ein Verschlüsselungsprotokoll"], correct:0, explanation:"DHCP-Server verteilt automatisch IP-Konfiguration. Probleme: DHCP-Server fällt aus (alle neuen Verbindungen scheitern), Adresspool voll, Rogue-DHCP-Server (Angreifer verteilt falsche Gateway-Adressen). Lösung: DHCP-Redundanz, DHCP-Snooping auf Switches, ausreichend großer Adresspool." },
  { id:"n14", question:"Was ist DNS und warum ist es unternehmenskritisch?", options:["Domain Name System – übersetzt Hostnamen in IP-Adressen. Fällt DNS aus, sind alle namentlichen Verbindungen unmöglich","Ein E-Mail-Protokoll","Ein Protokoll für Dateiübertragungen","Eine Firewall-Funktion"], correct:0, explanation:"DNS ist die Grundlage aller namentlichen Kommunikation. Fällt der DNS-Server aus: Browser zeigen keine Seiten mehr, E-Mails gehen nicht, intern kommen Nutzer nicht mehr auf Server. Deshalb: mindestens zwei DNS-Server (primary/secondary), oft in AD-Umgebungen auf Domain Controllern." },
  { id:"n15", question:"Was ist NAT (Network Address Translation) und warum wird es eingesetzt?", options:["Ein Protokoll zur Netzwerkverschlüsselung","Übersetzt private IP-Adressen in öffentliche IP-Adressen – ermöglicht vielen internen Clients mit einer öffentlichen IP ins Internet zu gehen","Ein Routing-Protokoll für große Netzwerke","Eine VLAN-Konfigurationsmethode"], correct:1, explanation:"NAT ermöglicht: 1 öffentliche IP, viele interne Clients. Der Router ersetzt im Paket die private Quell-IP durch die öffentliche IP und merkt sich die Zuordnung. IPv4-Adressen sind knapp – NAT ist die Lösung. PAT (Port Address Translation) ist die häufigste Variante." },
  { id:"n16", question:"Was ist der Unterschied zwischen IPv4 und IPv6?", options:["IPv6 ist einfach eine neuere Version ohne wesentliche Unterschiede","IPv4: 32-Bit-Adressraum (~4,3 Milliarden Adressen, erschöpft). IPv6: 128-Bit (~340 Sextillionen Adressen), kein NAT nötig, eingebaute Sicherheit","IPv6 wird nicht mehr entwickelt","IPv4 ist für interne, IPv6 nur für externe Netzwerke"], correct:1, explanation:"IPv4-Adressen sind seit Jahren erschöpft. IPv6 löst das mit riesigem Adressraum. Jedes Gerät bekommt eine echte öffentliche Adresse – kein NAT mehr nötig. IPv6 hat eingebaute Autokonfiguration (SLAAC) und IPSec. Dual-Stack: IPv4 und IPv6 parallel betreiben ist heute Best Practice." },
  { id:"n17", question:"Was ist ein Netzwerk-Monitoring-Tool und welche Metriken sind wichtig?", options:["Ein Tool ausschließlich zur Überwachung von Firewalls","Software die Netzwerkgeräte überwacht: Verfügbarkeit (Ping), Bandbreite, Fehler, Latenz, Interface-Status – Alarme bei Problemen","Ein Tool für Netzwerkplanung","Ausschließlich für Sicherheitsüberwachung"], correct:1, explanation:"Monitoring-Tools (Zabbix, PRTG, Checkmk, Nagios) überwachen: Uptime/Ping, CPU/RAM von Geräten, Interface-Auslastung, Paketfehler, Latenz. Ohne Monitoring: Probleme werden erst durch Nutzer-Beschwerden entdeckt. Mit Monitoring: proaktive Reaktion vor Ausfall möglich." },
  { id:"n18", question:"Was ist 802.1X Port-Based Network Access Control?", options:["Ein Standard für WLAN-Geschwindigkeit","Authentifizierungsstandard: nur autorisierte Geräte/Nutzer bekommen Zugang zum Netzwerk-Port – via RADIUS-Server und Zertifikate/Passwörter","Eine Methode zur Port-Konfiguration","Ein VLAN-Protokoll"], correct:1, explanation:"802.1X: bevor ein Gerät Netzwerkzugriff bekommt, muss es sich authentifizieren. Kabel: Gerät steckt ein – Switch fragt RADIUS-Server – keine Antwort: nur Gast-VLAN. WLAN: WPA2-Enterprise nutzt 802.1X. Verhindert unberechtigte Geräte im Firmennetz." },
  { id:"n19", question:"Was ist ein SDN (Software Defined Networking)?", options:["Ein neues Kabelstandard für Netzwerke","Trennung von Steuerungsebene und Datenebene – Netzwerk wird zentral per Software konfiguriert statt auf jedem Gerät einzeln","Ein Protokoll für drahtlose Netzwerke","Eine Firewall-Technologie"], correct:1, explanation:"SDN zentralisiert die Netzwerkkontrolle: ein Controller steuert alle Switches und Router per Software-API. Vorteil: schnelle Konfigurationsänderungen, Automatisierung, flexibler. Nachteile: Komplexität, Abhängigkeit vom Controller. Relevant bei Cloud-Umgebungen (NSX, OpenFlow)." },
  { id:"n20", question:"Was versteht man unter einem DMZ (Demilitarisierte Zone) im Netzwerk?", options:["Ein gesicherter Bereich für Serverraum-Hardware","Netzwerksegment zwischen Internet und internem Netz – öffentlich erreichbare Server (Webserver, Mail) stehen hier, getrennt vom internen Netz durch zwei Firewalls","Eine Art besonders sicheres VLAN","Ein verschlüsseltes Netzwerk für Management-Traffic"], correct:1, explanation:"DMZ ist zwischen zwei Firewall-Ebenen: Internet → Firewall 1 → DMZ (Webserver, Mail-Relay) → Firewall 2 → internes Netz. Wird ein Server in der DMZ kompromittiert, hat der Angreifer trotzdem keine direkte Verbindung ins interne Netz. Standard-Design für Sicherheitsarchitektur." },
  { id:"n21", question:"Was ist SNMP (Simple Network Management Protocol)?", options:["Ein Protokoll für Netzwerkverschlüsselung","Protokoll zur Überwachung und Verwaltung von Netzwerkgeräten – Switches, Router, USV können Status-Daten liefern und konfiguriert werden","Ein E-Mail-Protokoll","Ein VPN-Protokoll"], correct:1, explanation:"SNMP ermöglicht Monitoring-Systemen Daten von Geräten abzufragen (GET) oder Alarme zu empfangen (TRAP). Version 1/2c: schwache Security. SNMPv3: Verschlüsselung und Authentifizierung. Standard in allen Unternehmens-Netzwerkgeräten. Basis für PRTG, Zabbix, Nagios." },
  { id:"n22", question:"Was ist ein WAN-Anschluss und welche Typen sind für den Mittelstand relevant?", options:["Ein besonders schnelles LAN","Wide Area Network – Anbindung an externe Netze/Internet. Typen: MPLS (private Standortverbindung), SD-WAN, Glasfaser/FTTH, LTE/5G als Backup","WAN ist nur für Großkonzerne relevant","Ein WAN ist immer eine drahtlose Verbindung"], correct:1, explanation:"WAN verbindet Standorte oder an Internet. MPLS: private, garantierte Bandbreite zwischen Standorten (teuer, zuverlässig). Glasfaser: hohe Bandbreite, günstig. SD-WAN: mehrere WAN-Leitungen intelligent nutzen. LTE/5G: Backup-Leitung bei Ausfall. Für Mittelstand: oft Glasfaser primär + LTE Backup." },
  { id:"n23", question:"Was ist ein Netzwerk-Tap und wofür wird er eingesetzt?", options:["Ein spezieller Netzwerk-Switch","Passives Gerät das Netzwerkverkehr kopiert ohne ihn zu beeinflussen – für Monitoring, IDS/IPS und Forensik","Ein aktiver Netzwerk-Switch mit Monitoring-Funktion","Ein Protokoll zur Netzwerkanalyse"], correct:1, explanation:"Network TAP (Test Access Point) sitzt passiv in der Leitung und erstellt eine Kopie aller Pakete an einen Monitor-Port. Im Gegensatz zum SPAN-Port eines Switches: TAP ist passiv, beeinflusst Traffic nicht, kann keine Pakete verlieren. Standard für professionelle Netzwerkanalyse und Security-Monitoring." },
  { id:"n24", question:"Was bedeutet MPLS im Kontext von WAN-Verbindungen?", options:["Eine Verschlüsselungsmethode für Netzwerke","Multi-Protocol Label Switching – private Netzwerktechnologie von ISPs die Datenpakete über Labels statt IP-Adressen leitet. Garantierte Bandbreite und Latenz für Standortverbindungen","Ein drahtloses WAN-Protokoll","Eine VPN-Technologie für Homeoffice"], correct:1, explanation:"MPLS ist eine Provider-Technologie für private WAN-Verbindungen. Pakete bekommen Labels – Vermittlung nach Label statt IP-Routing. Vorteil: feste Bandbreite, niedrige und konsistente Latenz, private (nicht über Internet). Nachteil: teuer, unflexibel. SD-WAN als moderne günstigere Alternative." },
  { id:"n25", question:"Was ist ein Netzwerk-Loadbalancer?", options:["Ein Switch der Netzwerklast misst","Verteilt eingehende Verbindungsanfragen auf mehrere Server – erhöht Kapazität und Verfügbarkeit von Diensten","Ein Router mit QoS-Funktion","Ein Tool zur Bandbreitenmessung"], correct:1, explanation:"Load Balancer sitzt vor einem Server-Pool und verteilt Anfragen (Round-Robin, Least-Connections, IP-Hash). Vorteil: mehr Kapazität durch horizontale Skalierung, HA (fällt ein Server aus, kommen keine neuen Anfragen mehr). Einsatz: Webserver-Farmen, API-Gateways, Exchange, Remote Desktop." },
  { id:"n26", question:"Was ist CDP/LLDP bei Netzwerkgeräten?", options:["Verschlüsselungsprotokolle für Switches","CDP (Cisco) / LLDP (herstellerneutral): Nachbarschafts-Erkennungsprotokolle – Geräte tauschen Informationen über direkt verbundene Nachbarn aus (Gerätename, Port, VLAN)","Routing-Protokolle für kleine Netzwerke","WLAN-Standards"], correct:1, explanation:"CDP/LLDP ermöglicht automatische Netztopologie-Erkennung. Ein Switch weiß welches Gerät an welchem Port hängt. Monitoring-Tools können damit automatisch Netzwerkkarten zeichnen. Praktisch für Troubleshooting: 'Welcher Switch-Port ist das?' sofort beantwortet." },
  { id:"n27", question:"Was ist ein Out-of-Band Management Netzwerk?", options:["Ein Netzwerk für externe Benutzer","Separates physisches oder logisches Managementnetzwerk für Netzwerkgeräte und Server – Management-Traffic getrennt vom Produktionsnetzwerk","Ein Netzwerk ausschließlich für Backups","Ein WLAN-Netzwerk für Administratoren"], correct:1, explanation:"Out-of-Band Management: dediziertes Netzwerk/VLAN für Management-Interfaces aller Geräte (IPMI, iDRAC, Switch-Management-IP). Selbst wenn das Produktionsnetz ausgefallen ist, sind Geräte erreichbar. Sicherheit: Management-Interface nicht aus dem Internet erreichbar." },
  { id:"n28", question:"Was ist IGMP Snooping bei Switches?", options:["Eine Sicherheitsfunktion gegen Netzwerkangriffe","Ermöglicht dem Switch Multicast-Streams nur an Ports zu senden die ein IGMP-Interesse angemeldet haben – verhindert Multicast-Flooding","Ein Protokoll für VLAN-Konfiguration","Eine Methode zur Bandbreitenoptimierung"], correct:1, explanation:"Ohne IGMP Snooping: Multicast-Traffic wird wie Broadcast an alle Ports geflutet. Mit IGMP Snooping: Switch kennt welche Ports Multicast-Gruppen abonniert haben und sendet nur dort hin. Wichtig für: IP-TV, Videokonferenz-Systeme, Echtzeit-Datenfeeds – ohne IGMP Snooping leiden alle anderen Verbindungen." },
  { id:"n29", question:"Was ist der Unterschied zwischen symmetrischer und asymmetrischer Internetanbindung?", options:["Es gibt keinen Unterschied","Symmetrisch: gleiche Up- und Downloadgeschwindigkeit (Glasfaser Business). Asymmetrisch: Download viel schneller als Upload (DSL, Kabel) – für Server-Hosting oder VoIP oft problematisch","Symmetrisch ist immer teurer ohne Vorteil","Asymmetrisch ist für Unternehmen besser"], correct:1, explanation:"DSL/Kabel: 100/10 Mbit – Upload ist Engpass für Videokonferenzen, Cloud-Backup, VoIP. Glasfaser Business: 1000/1000 Mbit – identischer Upload. Für Unternehmen mit Remote-Mitarbeitern, VoIP und Cloud-Anbindung: symmetrische Anbindung essentiell." },
  { id:"n30", question:"Was ist ein Wireless Controller (WLAN Controller) und wann ist er sinnvoll?", options:["Ein Router mit integriertem WLAN","Zentrales Management-System für viele Access Points – einheitliche Konfiguration, Roaming, Monitoring und Sicherheitsrichtlinien über alle APs","Ein besonders leistungsfähiger Access Point","Ein Tool zur WLAN-Diagnose"], correct:1, explanation:"Ab ~5 Access Points: WLAN-Controller lohnt sich. Vorteile: alle APs zentral konfigurieren, nahtloses Roaming (Gerät wechselt AP ohne Verbindungsunterbrechung), zentrale Sicherheitsrichtlinien, Monitoring. Formen: physischer Controller, VM, oder Cloud-managed (Cisco Meraki, Aruba Central, Ubiquiti UniFi)." },
],

cloud: [
  { id:"c1", question:"Was ist der Unterschied zwischen Public Cloud, Private Cloud und Hybrid Cloud?", options:["Nur Bezeichnungen verschiedener Anbieter","Public: Ressourcen bei externem Anbieter geteilt (AWS, Azure). Private: dedizierte Infrastruktur on-premise oder beim Provider. Hybrid: Kombination aus beidem","Private Cloud ist immer on-premise","Hybrid Cloud ist die günstigste Option"], correct:1, explanation:"Public Cloud: flexibel, pay-per-use, kein Capex, aber geteilte Infrastruktur. Private Cloud: volle Kontrolle, Datensouveränität, höhere Kosten. Hybrid: Workloads je nach Anforderung verteilen – sensible Daten on-premise, skalierbare Workloads in Public Cloud. Im Mittelstand zunehmend Hybrid." },
  { id:"c2", question:"Was ist ein Hypervisor und welche zwei Typen gibt es?", options:["Ein besonders leistungsstarker Server-Prozessor","Software die Hardware-Ressourcen virtualisiert. Typ 1 (Bare Metal): läuft direkt auf Hardware (VMware ESXi, Hyper-V). Typ 2 (Hosted): läuft auf OS (VirtualBox, VMware Workstation)","Ein Cloud-Management-System","Ein Netzwerkvirtualisierungssystem"], correct:1, explanation:"Typ-1-Hypervisor (Bare Metal): läuft direkt auf Hardware ohne Betriebssystem dazwischen – maximale Performance. Produktiveinsatz: VMware ESXi, Microsoft Hyper-V, KVM. Typ-2-Hypervisor: läuft auf Windows/Linux – für Tests und Entwicklung. Im Unternehmen: immer Typ 1." },
  { id:"c3", question:"Was ist VMware vSphere und aus welchen Komponenten besteht es?", options:["Ein Cloud-Speichersystem von VMware","VMwares Virtualisierungsplattform: ESXi (Hypervisor auf Server), vCenter Server (zentrale Verwaltung aller Hosts und VMs)","Ein Netzwerkvirtualisierungssystem","Ein Backup-System für virtuelle Maschinen"], correct:1, explanation:"vSphere = ESXi + vCenter. ESXi läuft auf jedem physischen Host und stellt die Virtualisierung bereit. vCenter verwaltet alle Hosts zentral: VM-Migration, HA-Konfiguration, DRS, Updates. Ohne vCenter: jeder ESXi einzeln verwalten. Mit vCenter: kompletter Überblick und Automatisierung." },
  { id:"c4", question:"Was ist vMotion und welche Voraussetzungen braucht es?", options:["Eine VMware-Backup-Funktion","Live-Migration einer laufenden VM von einem ESXi-Host auf einen anderen ohne Unterbrechung – braucht Shared Storage und kompatible CPUs","Eine Methode zur VM-Erstellung","Ein Monitoring-Tool für virtuelle Maschinen"], correct:1, explanation:"vMotion verschiebt eine laufende VM (RAM-Inhalt, CPU-Zustand, Netzwerkverbindungen) ohne Downtime. Voraussetzungen: Shared Storage (SAN/NAS), beide Hosts im gleichen Netzwerk, CPU-Kompatibilität, vCenter. Einsatz: Hosts für Wartung leeren, Last verteilen (DRS)." },
  { id:"c5", question:"Was ist VMware HA (High Availability) und wie funktioniert es?", options:["Ein System das VMs automatisch zwischen Hosts verteilt","Überwacht ESXi-Hosts: fällt ein Host aus, werden seine VMs automatisch auf anderen Hosts im Cluster neu gestartet","Ein System für automatische VM-Backups","Ein Load-Balancing-System für VMs"], correct:1, explanation:"VMware HA: Agent auf jedem Host überwacht per Heartbeat. Fällt ein Host aus: alle VMs werden auf verbleibenden Hosts neu gestartet. Downtime: nur der Neustart der VM (Minuten). Voraussetzungen: Cluster mit Shared Storage, ausreichend freie Ressourcen (Admission Control). Standard in Produktionsumgebungen." },
  { id:"c6", question:"Was ist DRS (Distributed Resource Scheduler) in VMware?", options:["Ein Backup-System für verteilte VMs","Verschiebt VMs automatisch zwischen Hosts um Ressourcenauslastung auszugleichen – verhindert Hot-Spots, optimiert Performance","Ein Netzwerk-Load-Balancer für VMs","Ein System zur automatischen VM-Erstellung"], correct:1, explanation:"DRS überwacht CPU/RAM-Auslastung aller Hosts im Cluster. Wird ein Host überlastet: DRS verschiebt VMs per vMotion auf andere Hosts. Vollautomatisch oder nur Empfehlungen. Kombiniert mit Power Management: ungebrauchte Hosts ausschalten um Strom zu sparen (DPM)." },
  { id:"c7", question:"Was ist Microsoft Azure Arc und wofür wird es eingesetzt?", options:["Ein Cloud-Speicherdienst von Microsoft","Erweitert Azure-Management auf on-premise Server, andere Clouds und Edge-Geräte – einheitliches Management-Plane für hybride Umgebungen","Ein VPN-Dienst von Microsoft","Ein Backup-Dienst für Azure VMs"], correct:1, explanation:"Azure Arc bringt Azure-Verwaltung zu beliebiger Infrastruktur. On-premise Server, AWS-VMs, Edge-Geräte werden im Azure Portal sichtbar und können mit Azure-Policies, Defender und Monitoring verwaltet werden. Ideal für Hybrid-Strategien: eine Konsole für alles." },
  { id:"c8", question:"Was ist Infrastructure as Code (IaC) und welche Tools werden verwendet?", options:["Code der auf Servern ausgeführt wird","Infrastruktur (Server, Netzwerk, Storage) wird in Code-Dateien beschrieben und automatisch bereitgestellt. Tools: Terraform, Ansible, ARM Templates, Pulumi","Ein Programmierstandard für Cloud-Anwendungen","Ein System zur automatischen Code-Kompilierung"], correct:1, explanation:"IaC: statt Klicks im Portal werden Server und Konfigurationen in Textdateien beschrieben und automatisch bereitgestellt. Vorteil: reproduzierbar, versioniert (Git), schnell. Terraform (cloud-agnostisch), Ansible (Konfiguration), ARM/Bicep (Azure). Im modernen IT-Betrieb Standard." },
  { id:"c9", question:"Was ist Containerisierung und wie unterscheidet sie sich von Virtualisierung?", options:["Containerisierung und Virtualisierung sind identisch","VM: vollständiges Betriebssystem pro Instanz. Container (Docker): teilt Host-OS-Kernel – leichtgewichtiger, startet in Sekunden, weniger Overhead","Container sind unsicherer als VMs","Container können nicht auf Windows laufen"], correct:1, explanation:"VMs: jede hat eigenen Kernel, eigene OS-Instanz – Gigabytes, Minuten zum Starten. Container: teilen Host-Kernel, haben nur Anwendung + Dependencies – Megabytes, Sekunden zum Starten. Container sind effizienter für Microservices und DevOps. VMs für stärkere Isolation." },
  { id:"c10", question:"Was ist Kubernetes und wofür wird es eingesetzt?", options:["Ein Container-Betriebssystem","Container-Orchestrierungsplattform: verwaltet, skaliert und vernetzt Container-Cluster automatisch","Ein Cloud-Anbieter","Ein Monitoring-System für Container"], correct:1, explanation:"Kubernetes (K8s) verwaltet Container in einem Cluster: deployt Anwendungen, skaliert bei Last automatisch hoch/runter, startet ausgefallene Container neu, verteilt Traffic. Standard für moderne Cloud-native Anwendungen. On-premise: Rancher, OpenShift. Cloud: AKS (Azure), EKS (AWS), GKE (Google)." },
  { id:"c11", question:"Was ist der Unterschied zwischen IaaS, PaaS und SaaS mit konkreten Beispielen?", options:["Nur verschiedene Preismodelle","IaaS: virtuelle Hardware (Azure VMs, AWS EC2). PaaS: Entwicklungsplattform ohne OS-Verwaltung (Azure App Service, Google Cloud Run). SaaS: fertige Anwendung (Office 365, Salesforce)","Alle drei sind identisch in Funktion","SaaS ist immer günstiger als IaaS"], correct:1, explanation:"IaaS: du verwaltest OS, Middleware, Anwendung – maximale Kontrolle. PaaS: du kümmerst dich nur um Code und Daten, Provider um alles darunter. SaaS: du nutzt einfach die Anwendung. Mehr Managed Service = weniger Kontrolle aber weniger Verwaltungsaufwand. Richtige Wahl hängt vom Use Case ab." },
  { id:"c12", question:"Was ist eine Availability Zone (AZ) in Cloud-Umgebungen?", options:["Eine geografische Region eines Cloud-Anbieters","Physisch getrennte Rechenzentren innerhalb einer Region – unabhängige Stromversorgung und Kühlung. Deployment über mehrere AZs schützt vor Rechenzentrumsausfall","Eine Netzwerkzone in der Cloud","Ein Sicherheitssegment in der Cloud"], correct:1, explanation:"AWS/Azure/GCP haben Regionen (z.B. 'West Europe') die aus mehreren AZs bestehen. Jede AZ ist ein separates RZ mit eigener Infrastruktur. Deployment über 2-3 AZs: selbst wenn ein komplettes RZ ausfällt läuft die Anwendung weiter. Standard für produktionskritische Cloud-Workloads." },
  { id:"c13", question:"Was ist Cloud-Bursting und wann wird es eingesetzt?", options:["Eine Methode zur Cloud-Datenverschlüsselung","Private Cloud läuft normal, bei Spitzenlast werden automatisch zusätzliche Ressourcen in der Public Cloud genutzt – zahle nur bei Bedarf","Ein Backup-Konzept für die Cloud","Eine Migration von on-premise in die Cloud"], correct:1, explanation:"Cloud-Bursting: Basis-Last on-premise, Spitzenlast in Public Cloud. Typisch: Jahresabschluss braucht 10x normale Rechenleistung für 3 Tage – statt permanent teure Hardware kaufen, nur diese 3 Tage in AWS/Azure burstend. Setzt Hybrid-Cloud-Architektur voraus." },
  { id:"c14", question:"Was ist ein Cloud Landing Zone?", options:["Ein physischer Serverraum beim Cloud-Anbieter","Vorkonfigurierte, sichere Basis-Umgebung in der Cloud mit definierten Netzwerken, Security-Policies, Logging und Governance-Strukturen – bevor Workloads migriert werden","Ein Disaster-Recovery-Standort in der Cloud","Ein Cloud-Speicher für Backups"], correct:1, explanation:"Landing Zone ist die 'Grundlage' der Cloud-Umgebung: Management-Account, Netzwerktopologie (Hub-Spoke), Security-Baseline, Logging, IAM-Konzept – alles bevor die erste Workload migriert. Ohne Landing Zone: Cloud wächst unkontrolliert, Security-Probleme häufen sich. Azure Landing Zone / AWS Control Tower helfen dabei." },
  { id:"c15", question:"Was ist FinOps und warum ist es in Cloud-Umgebungen wichtig?", options:["Finanzielle Buchhaltung für Cloud-Dienstleister","Disziplin zur Optimierung von Cloud-Kosten: Ressourcen richtig dimensionieren, ungenutzte Ressourcen löschen, Reserved Instances nutzen, Kosten transparent machen","Ein Sicherheitsrahmen für Cloud-Umgebungen","Ein Compliance-Standard für Cloud-Anbieter"], correct:1, explanation:"Cloud-Kosten können schnell explodieren: vergessene VMs, übergroße Instanzen, teure Datenübertragungen. FinOps bringt Ingenieure, Finance und Business zusammen um Kosten sichtbar und optimierbar zu machen. Tools: Azure Cost Management, AWS Cost Explorer. Im Mittelstand oft vernachlässigt – mit teuren Folgen." },
  { id:"c16", question:"Was ist Multi-Cloud und welche Herausforderungen bringt es?", options:["Mehrere Cloud-Accounts bei einem Anbieter","Nutzung mehrerer Cloud-Anbieter (AWS + Azure + GCP) – vermeidet Vendor Lock-in, nutzt Best-of-Breed, erhöht aber Komplexität bei Management und Skills","Eine Backup-Strategie mit mehreren Cloud-Kopien","Ein Load-Balancing-System zwischen Cloud-Regionen"], correct:1, explanation:"Multi-Cloud: verschiedene Anbieter für verschiedene Workloads oder als Strategie gegen Lock-in. Herausforderungen: jeder Anbieter hat eigene APIs, Tools, IAM-Konzepte, unterschiedliche Skills nötig. Lösung: Management-Ebene (HashiCorp, Anthos) oder pragmatisch: Primary Cloud + Secondary für spezifische Services." },
  { id:"c17", question:"Was ist Serverless Computing (FaaS)?", options:["Cloud-Computing ohne physische Server beim Anbieter","Anwendungscode wird in Funktionen aufgeteilt die bei Bedarf ausgeführt werden – kein Server-Management, Bezahlung nur für tatsächliche Ausführungszeit","Ein Cloud-Service ohne Kosten","Ein Container-Service ohne Kubernetes"], correct:1, explanation:"Serverless (AWS Lambda, Azure Functions): du schreibst nur Funktionen, kein Server-Management, automatische Skalierung auf null (keine Last = keine Kosten). Ideal für: Event-driven Workloads, APIs mit stark variierender Last, Automation-Aufgaben. Nicht für: langläufige Prozesse oder Anwendungen mit konstantem Traffic." },
