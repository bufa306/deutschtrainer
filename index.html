      <div class="lbl">Narration · ${lvL(P.cats['Narration']?.lv||1)}</div>
      <div class="ctitle">Beschreibe die Szene</div>
      <div class="scene-box">${activeQ.scene}</div>
      <div class="hint-ln">💡 ${activeQ.hint}</div>
      <div class="kws">${activeQ.kw.map(k=>`<span class="kw">${k}</span>`).join('')}</div>
      <textarea id="narTA" placeholder="Schreib hier auf Deutsch..." ${narFb?'disabled':''}>${fillVal}</textarea>
      <div class="row">
        ${!narFb?`<button class="btn btn-p" onclick="doNar()" ${loading?'disabled':''}>${loading?Dots():'Auswerten'}</button>`:''}
        ${narFb&&!showMod?`<button class="btn btn-sm" onclick="showMod=true;render()">Musterlösung</button>`:''}
        ${narFb?`<button class="btn btn-p" onclick="resetExercise()">Neue Aufgabe →</button>`:''}
      </div>
      ${narFb?`<div class="fb ${loading?'live':''}">${narFb}</div>`:''}
      ${showMod?`<div class="model-box"><div class="mlbl">Musterlösung</div>${activeQ.model}</div>`:''}
    </div>`;
  }

  // ── SITUATION ──
  else if(activeExType==='situation'){
    h+=`<div class="card card-teal">
      <span class="situ-badge" style="background:rgba(90,159,168,.1);color:var(--teal);border:1px solid rgba(90,159,168,.2)">${activeQ.badge}</span>
      <div class="ctitle">${activeQ.scene}</div>
      <div style="font-size:12px;color:var(--ink3);margin-bottom:12px;font-family:var(--mono)">Aufgabe: ${activeQ.task}</div>
      <div class="kws">${activeQ.kw.map(k=>`<span class="kw">${k}</span>`).join('')}</div>
      <textarea id="situTA" placeholder="Antworte auf Deutsch..." ${narFb?'disabled':''}>${fillVal}</textarea>
      <div class="row">
        ${!narFb?`<button class="btn btn-p" onclick="doSitu()" ${loading?'disabled':''}>${loading?Dots():'Auswerten'}</button>`:''}
        ${narFb&&!showMod?`<button class="btn btn-sm" onclick="showMod=true;render()">Musterlösung</button>`:''}
        ${narFb?`<button class="btn btn-p" onclick="resetExercise()">Nächste Situation →</button>`:''}
      </div>
      ${narFb?`<div class="fb ${loading?'live':''}">${narFb}</div>`:''}
      ${showMod?`<div class="model-box"><div class="mlbl">Musterlösung</div><pre style="white-space:pre-wrap;font-size:13px;color:var(--ink2);font-family:var(--sans)">${activeQ.model}</pre></div>`:''}
    </div>`;
  }

  // ── VOCAB UPGRADE ──
  else if(activeExType==='vocab'){
    const v=activeQ;
    h+=`<div class="card card-green">
      <div class="lbl lbl-g">Vocab · Upgrade</div>
      <div class="ctitle">Ersetze das schwache Wort</div>
      <div style="margin:14px 0">
        <div class="vocab-pair">
          <span class="vocab-weak">${v.weak}</span>
          <span class="vocab-arrow">→</span>
          <span class="vocab-strong">${v.strong}</span>
        </div>
        <div class="vocab-ctx">${v.ctx}</div>
      </div>
      <div style="font-size:12px;color:var(--ink3);margin-top:14px;padding-top:12px;border-top:1px solid var(--bdr)">
        Merke dir dieses Upgrade. Verwende <strong style="color:var(--green)">${v.strong.split(' / ')[0]}</strong> ab sofort statt <strong style="color:var(--red)">${v.weak}</strong>.
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn btn-p" onclick="resetExercise()">Nächstes Upgrade →</button>
      </div>
    </div>`;
  }

  // ── FILL IN ──
  else if(activeExType==='fill'){
    h+=`<div class="card card-amber">
      <div class="lbl">${activeCat} · ${lvL(P.cats[activeCat]?.lv||1)}</div>
      <div class="ctitle">Lückentext</div>
      <div class="fill-row">
        <div class="fill-sent">${activeQ.q.replace('___','<span style="color:var(--amber2);font-family:var(--mono)">[?]</span>')}</div>
        <input type="text" id="fillIn" class="${fillCk===null?'':(fillCk?'ok':'bad')}" value="${fillVal}" placeholder="..." ${fillCk!==null?'disabled':''} onkeydown="if(event.key==='Enter'&&fillCk===null)doFill()"/>
        ${fillCk===false?`<span class="fhint">→ ${activeQ.a} (${activeQ.hint})</span>`:''}
      </div>
      <div class="row">
        ${fillCk===null?`<button class="btn btn-p" onclick="doFill()" ${!fillVal.trim()?'disabled':''}>Prüfen</button>`:`<button class="btn btn-p" onclick="resetExercise()">Neue Aufgabe →</button>`}
      </div>
      ${fillCk!==null?`<div class="expl-box">${fillCk?'✓ Richtig!':`✗ Falsch. Richtig: ${activeQ.a}\n${activeQ.hint}`}</div>`:''}
    </div>`;
  }

  // ── MC (Deutsch grammar) ──
  else if(activeExType==='mc'){
    h+=`<div class="card card-amber">
      <div class="lbl">${activeCat} · ${lvL(P.cats[activeCat]?.lv||1)}</div>
      <div class="ctitle">${activeQ.q}</div>
      <div class="opts" id="mc-opts"></div>
      <div id="mc-expl"></div>
    </div>`;
  }

  // ── MC + EXPLAIN (IT & Vertrieb) ──
  else if(activeExType==='mc_explain'){
    const isIT=mod==='it';
    const catColor=isIT?'var(--green)':'var(--blue)';
    const catLbl=isIT?'lbl-g':'lbl-b';

    h+=`<div class="card" style="border-left:2px solid ${catColor};border-radius:0 6px 6px 0">
      <div class="lbl ${catLbl}">${activeCat}</div>
      <div class="q-text">${activeQ.question}</div>`;

    if(phase==='question'){
      h+='<div class="opts" id="mc-opts"></div>';
      if(showEx){
        h+=`<div class="expl-box">${activeQ.explanation}`;
        if(activeQ.prinzip)h+=`<div class="prinzip">⚡ ${activeQ.prinzip}</div>`;
        if(activeQ.hint)h+=`<div class="hint-box"><b>Praxis:</b> ${activeQ.hint}</div>`;
        h+=`</div>
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--bdr)">
          <div class="phase-label">Jetzt erklären — schreib auf Deutsch:</div>
          <div style="font-size:12px;color:var(--ink3);margin-bottom:8px">${mcSel===activeQ.correct?'Wie würdest du das einem IT-Leiter erklären?':'Was ist der richtige Ansatz und warum?'}</div>
          <textarea id="explainTA" placeholder="Erkläre auf Deutsch..."></textarea>
          <div class="row">
            <button class="btn btn-p" onclick="doExplain()" ${loading?'disabled':''}>${loading?Dots():'KI-Feedback →'}</button>
            <button class="btn btn-sm" onclick="resetExercise()">Überspringen</button>
          </div>
        </div>`;
      }
    }

    if(phase==='feedback'){
      h+=`<div class="opts" id="fb-opts"></div>
      <div class="expl-box" style="margin-top:10px">${activeQ.explanation}${activeQ.prinzip?`<div class="prinzip">⚡ ${activeQ.prinzip}</div>`:''}</div>
      <div class="fb ${loading?'live':''}" style="margin-top:12px">${fbText||Dots()}</div>
      ${!loading?`<div class="row"><button class="btn btn-p" onclick="resetExercise()">Nächste Frage →</button></div>`:''}`;
    }

    h+=`</div>`;
  }

  // ── DYNQ ──
  if(dynQ&&dynQ.type!=='error'){
    h+=`<div class="card card-teal"><div class="lbl lbl-t">KI-generiert</div>`;
    if(dynQ.type==='fill'){
      h+=`<div class="ctitle">${dynQ.question||''}</div>
      <div class="fill-row"><div class="fill-sent">${(dynQ.sentence||'').replace('___','<span style="color:var(--amber2);font-family:var(--mono)">[?]</span>')}</div>
      <input type="text" id="dynFill" class="${fillCk===null?'':(fillCk?'ok':'bad')}" value="${fillVal}" placeholder="..." ${fillCk!==null?'disabled':''}/>
      ${fillCk===false?`<span class="fhint">→ ${dynQ.answer}</span>`:''}</div>
      <div class="row">${fillCk===null?`<button class="btn btn-p" onclick="doDynFill()">Prüfen</button>`:`<button class="btn btn-p" onclick="resetExercise()">Neue Aufgabe →</button>`}</div>
      ${fillCk!==null?`<div class="expl-box">${fillCk?'✓ ':''} ${dynQ.explanation}</div>`:''}`;
    } else if(dynQ.type==='mc'&&dynQ.options){
      h+=`<div class="ctitle">${dynQ.question||''}</div>
      <div class="opts" id="dyn-opts"></div>
      <div id="dyn-expl"></div>`;
    }
    h+=`</div>`;
  }
  if(dynQ&&dynQ.type==='error'){
    h+=`<div class="card"><div class="lbl lbl-m">Fehler</div><p style="font-size:13px;color:var(--red)">${dynQ.msg}</p></div>`;
  }

  // Gen button
  if(!dynQ&&phase!=='feedback'&&!(narFb)&&!(fillCk!==null)&&!showEx){
    h+=`<div class="card"><div class="lbl lbl-m">KI-Aufgabe</div>
    <p style="font-size:13px;color:var(--ink3);margin-bottom:10px">Neue Aufgabe generieren — Niveau ${lvL((activeModule==='de'?P_DE:activeModule==='it'?P_IT:P_VT).cats[activeCat]?.lv||1)}.</p>
    <button class="btn" onclick="genDynExercise()" ${genLoading?'disabled':''}>${genLoading?Dots():'Aufgabe generieren'}</button></div>`;
  }

  return h;
}

function renderProfil(mod){
  const P=mod==='de'?P_DE:mod==='it'?P_IT:P_VT;
  const xpPct=Math.round((P.xp/xpForLv(P.level))*100);
  const cats=Object.entries(P.cats);
  const getCatLabel=(id)=>{
    if(mod==='it'){const c=IT_CATEGORIES.find(x=>x.id===id);return c?c.label:id;}
    if(mod==='vt'){const c=VT_CATEGORIES.find(x=>x.id===id);return c?c.label:id;}
    return id;
  };
  let h=`<div class="card">
    <div class="lbl">Übersicht</div>
    <div class="dash2">
      <div class="dash-c"><div class="dash-num">Lv ${P.level}</div><div class="dash-lbl">${P.xp} / ${xpForLv(P.level)} XP</div></div>
      <div class="dash-c"><div class="dash-num">${P.streak.days} 🔥</div><div class="dash-lbl">Tage in Folge</div></div>
    </div>
    <div class="xpbar"><div class="xpfill" style="width:${xpPct}%"></div></div>
  </div>
  <div class="card"><div class="lbl">Kategorien</div><div style="margin-top:12px">`;
  for(const[id,d]of cats){
    const acc=pct(d.att,d.err); const isWeak=P.weakest.includes(id);
    h+=`<div class="prof-row"><div class="prof-meta">
      <span class="prof-name">${getCatLabel(id)}</span>
      <span class="prof-stat" style="color:${isWeak?'var(--red)':'var(--ink3)'}">${lvL(d.lv)} · ${acc!==null?acc+'%':'–'} · ${d.att} Vers.</span>
    </div><div class="cat-bar"><div class="cat-fill" style="width:${(d.lv/3)*100}%;background:${isWeak?'var(--red)':'var(--amber)'}"></div></div></div>`;
  }
  h+=`</div></div>
  <div style="height:1px;background:var(--bdr);margin:16px 0"></div>
  <button class="btn btn-sm" style="color:var(--red);border-color:rgba(196,96,96,.3)" onclick="resetMod('${mod}')">Fortschritt zurücksetzen</button>`;
  return h;
}


// ─── MAIN RENDER ────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(!app)return;
  const key=LS.get('ts_key');
  if(!key||screen==='setup'){app.innerHTML=renderSetup();return;}

  if(screen==='home'){
    app.innerHTML=`<div class="wrap">${renderHome()}</div>`;return;
  }

  const mod=screen; // 'de'|'it'|'vt'
  const tab=mod==='de'?deTab:mod==='it'?itTab:vtTab;
  const tabs=['home','üben','profil'];

  let h=`<div class="wrap">${renderModHeader(mod)}
  <div class="nav">
    ${tabs.map(t=>`<button class="nv ${tab===t||((t==='üben'||t==='ex')&&(tab==='üben'||tab==='ex'))?'on':''}" onclick="setTab('${mod}','${t}')">${t==='home'?'Start':t==='üben'?'Üben':t==='profil'?'Profil':t}</button>`).join('')}
  </div>`;

  if(tab==='home'){
    const P=mod==='de'?P_DE:mod==='it'?P_IT:P_VT;
    h+=`<div class="card card-amber">
      <div class="lbl">Tagesroutine</div>
      <div class="ctitle" style="font-size:16px;margin-bottom:8px">${mod==='de'?'15 Minuten schreiben und korrigieren':mod==='it'?'10 Fragen, dann weiterdenken':'10 Szenarien, dann üben'}</div>`;
    if(P.weakest.length>0){
      const weakHtml=P.weakest.map(w=>{
        const lbl=mod==='it'?(IT_CATEGORIES.find(x=>x.id===w)?.label||w):mod==='vt'?(VT_CATEGORIES.find(x=>x.id===w)?.label||w):w;
        return '<span class="kw" style="color:var(--red);border-color:rgba(196,96,96,.3);cursor:pointer" data-mod="'+mod+'" data-cat="'+w+'" onclick="loadExercise(this.dataset.mod,this.dataset.cat)">⚠ '+lbl+'</span>';
      }).join('');
      h+='<div style="margin:10px 0"><div class="lbl lbl-m" style="margin-bottom:6px">Schwachstellen fokussieren</div><div class="kws">'+weakHtml+'</div></div>';}
    h+=`<div class="row"><button class="btn btn-p" onclick="setTab('${mod}','üben')">Üben starten →</button></div></div>`;
  }
  if(tab==='üben'){h+=renderCatGrid(mod);}
  if(tab==='ex'){h+=renderExercise();}
  if(tab==='profil'){h+=renderProfil(mod);}

  h+=`</div>`;
  app.innerHTML=h;


// ─── POST-RENDER DOM FIXES ──────────────────
function fillMCOpts(){
  // Deutsch MC
  const mcDiv = document.getElementById('mc-opts');
  if(mcDiv && activeQ && activeQ.opts){
    mcDiv.innerHTML = activeQ.opts.map((o,i)=>{
      let cls='opt';
      if(showEx){cls+=(i===activeQ.a?' ok':mcSel===i?' bad':'');}
      return '<button class="'+cls+'" onclick="doMC('+i+')" '+(showEx?'disabled':'')+'>'+o+'</button>';
    }).join('');
    const explDiv=document.getElementById('mc-expl');
    if(explDiv && showEx){
      explDiv.innerHTML='<div class="expl-box">'+activeQ.expl+'</div><div class="row"><button class="btn btn-p" onclick="resetExercise()">Neue Aufgabe →</button></div>';
    }
  }
  // IT/Vertrieb MC
  const itDiv = document.getElementById('mc-opts');
  if(itDiv && activeQ && activeQ.options && activeExType==='mc_explain' && phase==='question'){
    itDiv.innerHTML = activeQ.options.map((o,i)=>{
      let cls='opt';
      if(showEx){cls+=(i===activeQ.correct?' ok':mcSel===i?' bad':'');}
      return '<button class="'+cls+'" onclick="doMCIT('+i+')" '+(showEx?'disabled':'')+'>'+o+'</button>';
    }).join('');
  }
  // Feedback phase opts
  const fbDiv = document.getElementById('fb-opts');
  if(fbDiv && activeQ && activeQ.options){
    fbDiv.innerHTML = activeQ.options.map((o,i)=>{
      let cls='opt '+(i===activeQ.correct?'ok':mcSel===i&&i!==activeQ.correct?'bad':'');
      return '<button class="'+cls+'" disabled>'+o+'</button>';
    }).join('');
  }
  // Dyn MC
  const dynDiv = document.getElementById('dyn-opts');
  if(dynDiv && dynQ && dynQ.options){
    dynDiv.innerHTML = dynQ.options.map((o,i)=>{
      let cls='opt';
      if(showEx){cls+=(i===Number(dynQ.answer)?' ok':mcSel===i?' bad':'');}
      return '<button class="'+cls+'" onclick="doDynMC('+i+')" '+(showEx?'disabled':'')+'>'+o+'</button>';
    }).join('');
    const dynExpl=document.getElementById('dyn-expl');
    if(dynExpl && showEx){
      dynExpl.innerHTML='<div class="expl-box">'+dynQ.explanation+'</div><div class="row"><button class="btn btn-p" onclick="resetExercise()">Neue Aufgabe →</button></div>';
    }
  }
}
  // re-attach textarea listeners
  if(tab==='ex'){
    const narTA=document.getElementById('narTA');
    if(narTA){narTA.addEventListener('input',e=>{fillVal=e.target.value});narTA.value=fillVal;}
    const situTA=document.getElementById('situTA');
    if(situTA){situTA.addEventListener('input',e=>{fillVal=e.target.value});situTA.value=fillVal;}
    const fillIn=document.getElementById('fillIn');
    if(fillIn)fillIn.addEventListener('input',e=>{fillVal=e.target.value;});
    const dynFill=document.getElementById('dynFill');
    if(dynFill)dynFill.addEventListener('input',e=>{fillVal=e.target.value;});
  }
  fillMCOpts();
}

// ─── EVENT HANDLERS ─────────────────────────
function saveKey(){
  const v=document.getElementById('apiInput')?.value?.trim();
  if(!v)return;
  LS.set('ts_key',v);
  screen='home';render();
}
function showSetup(){screen='setup';render();}
function openModule(mod){
  screen=mod;
  if(mod==='de')deTab='home';
  else if(mod==='it')itTab='home';
  else vtTab='home';
  activeCat=null;activeQ=null;activeModule=mod;
  render();
}
function goHome(){screen='home';activeCat=null;activeQ=null;render();}
function setTab(mod,t){
  if(mod==='de')deTab=t;
  else if(mod==='it')itTab=t;
  else vtTab=t;
  if(t!=='ex'){activeCat=null;activeQ=null;}
  render();
}
function backToCats(){
  if(activeModule==='de')deTab='üben';
  else if(activeModule==='it')itTab='üben';
  else vtTab='üben';
  activeCat=null;activeQ=null;render();
}

function doNar(){const ta=document.getElementById('narTA');if(ta)fillVal=ta.value;submitNarration(fillVal);}
function doSitu(){const ta=document.getElementById('situTA');if(ta)fillVal=ta.value;submitSituation(fillVal);}
function doFill(){
  const inp=document.getElementById('fillIn');if(inp)fillVal=inp.value;
  const P=activeModule==='de'?P_DE:activeModule==='it'?P_IT:P_VT;
  submitFill(activeQ,P,activeModule,activeCat);
}
function doMC(i){
  const P=P_DE;
  submitMC(i,activeQ,P,'de',activeCat);
}
function doMCIT(i){
  if(showEx)return;
  const P=activeModule==='it'?P_IT:P_VT;
  mcSel=i; showEx=true;
  const ok=i===activeQ.correct;
  award(P,activeModule,activeCat,ok?15:5,ok);
  render();
}
function doExplain(){
  const ta=document.getElementById('explainTA');
  if(!ta||!ta.value.trim())return;
  const P=activeModule==='it'?P_IT:P_VT;
  submitExplain(ta.value,P,activeModule,activeCat);
}
function doDynFill(){
  const inp=document.getElementById('dynFill');if(inp)fillVal=inp.value;
  const ok=fillVal.trim().toLowerCase()===dynQ.answer?.toLowerCase();
  fillCk=ok;
  const P=activeModule==='de'?P_DE:activeModule==='it'?P_IT:P_VT;
  award(P,activeModule,activeCat,ok?15:5,ok);render();
}
function doDynMC(i){
  if(showEx)return;mcSel=i;showEx=true;
  const ok=i===Number(dynQ.answer);
  const P=activeModule==='de'?P_DE:activeModule==='it'?P_IT:P_VT;
  award(P,activeModule,activeCat,ok?15:5,ok);render();
}
function resetMod(mod){
  if(!confirm('Fortschritt für dieses Modul löschen?'))return;
  if(mod==='de'){P_DE=JSON.parse(JSON.stringify(DEF_DE));LS.del('ts_de');}
  else if(mod==='it'){P_IT=JSON.parse(JSON.stringify(DEF_IT));for(const c of IT_CATEGORIES)P_IT.cats[c.id]={lv:1,att:0,err:0};LS.del('ts_it');}
  else{P_VT=JSON.parse(JSON.stringify(DEF_VT));for(const c of VT_CATEGORIES)P_VT.cats[c.id]={lv:1,att:0,err:0};LS.del('ts_vt');}
  render();
}

// ─── BOOT ───────────────────────────────────
loadProfiles();
render();
</script>
</body>
</html>
