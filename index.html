  { id:"c18", question:"Was ist Cloud-native Entwicklung?", options:["Anwendungen die nur in der Cloud entwickelt werden","Designprinzip: Anwendungen werden für Cloud-Umgebungen optimiert – Microservices, Container, CI/CD, elastische Skalierung, Resilienz durch Design statt Hardware-Redundanz","Eine Programmiersprache für Cloud","Ein Cloud-Anbieter-spezifischer Standard"], correct:1, explanation:"Cloud-native: Anwendung als Microservices (kleine unabhängige Teile), in Containern verpackt, per Kubernetes orchestriert, per CI/CD automatisch deployed. Jeder Service skaliert unabhängig, Ausfälle werden erwartet und abgefangen (Circuit Breaker, Retry). Gegenteil: Monolithische Anwendung einfach in Cloud gehoben (Lift & Shift)." },
  { id:"c19", question:"Was ist Azure Active Directory (Entra ID) und wie unterscheidet es sich von on-premise AD?", options:["Identisch mit on-premise Active Directory, nur in der Cloud","Cloud-Identitätsservice: kein LDAP/Kerberos, stattdessen OAuth2/OIDC/SAML. Verwaltet Benutzer für Cloud-Apps (Office 365, SaaS). Azure AD Connect synchronisiert mit on-premise AD","Ein Backup-System für Active Directory","Ein Netzwerkvirtualisierungssystem von Microsoft"], correct:1, explanation:"Azure AD (Entra ID): cloud-nativer Identity Provider. Protokolle: OAuth2, OIDC, SAML – nicht Kerberos/LDAP. Verwaltet Zugriff auf Office 365, Azure, SaaS-Apps. Azure AD Connect: synchronisiert Benutzer vom on-premise AD. In Hybrid-Umgebungen: beide zusammen, Single Sign-On über beide Welten." },
  { id:"c20", question:"Was ist ein Cloud-Service Level Agreement (SLA) und worauf sollte man achten?", options:["Ein Vertrag über Cloud-Sicherheit","Vereinbarung über Verfügbarkeit und Performance des Cloud-Services. Wichtig: 99,9% (8,7h Ausfall/Jahr) vs 99,99% (52 Min/Jahr), Ausnahmen, Gutschriften bei Nicht-Einhaltung, wie Verfügbarkeit gemessen wird","Ein Preismodell für Cloud-Services","Ein Datenschutzvertrag mit Cloud-Anbietern"], correct:1, explanation:"Cloud-SLAs klingen gut: 99,9% klingt nach fast keinem Ausfall – sind aber 8,7 Stunden pro Jahr. 99,99%: 52 Minuten. Wichtig: was ist der Kompensationsmechanismus (meist nur Gutschriften, kein Schadensersatz), was zählt als Ausfall, gibt es geplante Wartungsfenster. Für kritische Systeme: Redundanz über mehrere AZs schafft eigene höhere Verfügbarkeit." },
  { id:"c21", question:"Was ist VMware vSAN und wie funktioniert es?", options:["Ein Backup-System für VMware-Umgebungen","Software-defined Storage: lokale Festplatten der ESXi-Hosts werden zu einem gemeinsamen Storage-Pool zusammengefasst – kein externes SAN nötig","Ein Netzwerkvirtualisierungssystem von VMware","Ein Monitoring-Tool für Storage-Systeme"], correct:1, explanation:"vSAN kombiniert lokale SSDs und HDDs aller Cluster-Hosts zu einem verteilten Datastore. VMs sehen einen einheitlichen Storage-Pool. Keine externe SAN/NAS-Hardware nötig – Knoten bringen Storage mit. Resilienz durch Replication zwischen Knoten. Basis für HCI mit VMware." },
  { id:"c22", question:"Was ist ein Terraform-State und warum ist er kritisch?", options:["Ein Sicherheits-Feature von Terraform","Datei die den aktuellen Zustand der verwalteten Infrastruktur speichert – Terraform vergleicht gewünschten Zustand (Code) mit aktuellem Zustand um Änderungen zu planen","Eine Backup-Datei der Cloud-Konfiguration","Ein Protokoll aller Terraform-Ausführungen"], correct:1, explanation:"Terraform State (terraform.tfstate) ist das Gedächtnis von Terraform: welche Ressourcen wurden erstellt, welche IDs haben sie. Ohne State: Terraform weiß nicht was bereits existiert und würde alles neu erstellen. State muss sicher gespeichert werden (remote: S3, Azure Blob) und darf nicht verloren gehen." },
  { id:"c23", question:"Was ist Cloud-Compliance und welche Regularien sind für deutsche Unternehmen relevant?", options:["Ein Marketing-Begriff ohne technische Relevanz","Einhaltung von Datenschutz und Regulierungen in der Cloud: DSGVO (Datenspeicherung EU), ISO 27001, BSI C5 (Deutsche Behörden), HIPAA (Healthcare USA)","Eine Cloud-Sicherheitszertifizierung","Ein Vertragsrahmen zwischen Cloud-Anbietern"], correct:1, explanation:"Deutsche Unternehmen müssen DSGVO-konform sein: personenbezogene Daten dürfen nicht unkontrolliert in Nicht-EU-Länder fließen. Wichtig: Auftragsverarbeitungsvertrag (AVV) mit Cloud-Anbieter, Datenstandort (Azure/AWS haben EU-Regionen), ISO 27001-Zertifizierung des Anbieters prüfen. Behörden: BSI C5-Zertifizierung (z.B. Microsoft Azure)." },
  { id:"c24", question:"Was ist ein Cloud-Backup vs. Cloud-native Backup?", options:["Identisch","Cloud-Backup: lokale Daten werden in die Cloud gesichert (z.B. Veeam zu Azure Blob). Cloud-native Backup: Backup von Cloud-Ressourcen selbst (z.B. Azure Backup für Azure VMs)","Cloud-native Backup ist immer günstiger","Cloud-Backup ist veraltet"], correct:1, explanation:"Cloud-Backup: klassische on-premise Daten gehen als Backup in die Cloud (günstiger Offsite-Speicher). Cloud-native Backup: Azure VMs, RDS-Datenbanken brauchen eigene Backup-Lösungen (Azure Backup, AWS Backup). Kombination beider Ansätze in Hybrid-Umgebungen nötig." },
  { id:"c25", question:"Was ist Zero Trust Network Access (ZTNA) und warum ersetzt es klassisches VPN?", options:["Eine verstärkte VPN-Technologie","Sicherheitsmodell: kein implizites Vertrauen, jede Anfrage wird unabhängig von Netzwerkstandort authentifiziert und autorisiert – nur Zugriff auf explizit erlaubte Ressourcen statt komplettes Netzwerk","Ein Cloud-Firewall-System","Eine Authentifizierungsmethode für Cloud-Apps"], correct:1, explanation:"Klassisches VPN: einmal verbunden, Zugriff auf gesamtes Netzwerksegment – riskant. ZTNA: Benutzer bekommt nur Zugriff auf spezifische Anwendungen, jede Anfrage neu authentifiziert und autorisiert (MFA, Gerätezustand, Kontext). Auch aus dem internen Netz. Moderner Ansatz für Remote Access und Cloud-Zugriff." },
  { id:"c26", question:"Was ist ein Cloud-Egress-Cost und warum ist er relevant?", options:["Die Kosten für Cloud-Server-Ressourcen","Kosten für Daten die aus der Cloud heraus übertragen werden – teuer bei großen Datenmengen, oft unterschätzt bei Cloud-Migration","Die Kosten für Cloud-Datenbankzugriffe","Die monatliche Grundgebühr beim Cloud-Anbieter"], correct:1, explanation:"Daten rein in die Cloud: oft kostenlos. Daten raus (Egress): teuer – AWS/Azure berechnen pro GB. Bei großen Datentransfers (Backups, Medien, Analytics) können Egress-Kosten die größten Cloud-Kostenfaktoren sein. Wichtig bei Cloud-Kostenplanung: Egress-Modell des Anbieters verstehen und ggf. CDN oder Datenlokalität optimieren." },
  { id:"c27", question:"Was ist VMware NSX und wofür wird es eingesetzt?", options:["Ein Backup-System für VMware-Umgebungen","Netzwerkvirtualisierungsplattform: virtuelle Netzwerke, Firewalls, Load Balancer rein in Software – unabhängig von physischer Netzwerkhardware","Ein Storage-System von VMware","Ein Monitoring-Tool für virtuelle Maschinen"], correct:1, explanation:"NSX virtualisiert das komplette Netzwerk: VLANs, Routing, Firewall, NAT, Load Balancing – alles als Software. VMs können mit ihrer Netzwerkkonfiguration zwischen Hosts migriert werden (vMotion mit Netzwerk). Mikrosegmentierung: jede VM hat eigene Firewall-Regel. Komplexer, aber maximale Flexibilität." },
  { id:"c28", question:"Was ist der Unterschied zwischen Cloud-Migration Lift & Shift und Re-Architecting?", options:["Beide Methoden sind identisch","Lift & Shift: VM 1:1 in Cloud verschieben, wenig Änderung, schnell, aber keine Cloud-Vorteile genutzt. Re-Architecting: Anwendung cloud-nativ umbauen (Microservices, PaaS) – aufwendig aber maximale Cloud-Benefits","Lift & Shift ist immer günstiger","Re-Architecting ist schneller"], correct:1, explanation:"Die '6 Rs' der Cloud-Migration: Lift & Shift (Rehost): schnellste Migration, keine Optimierung. Replatform: kleine Anpassungen (z.B. DB auf managed RDS). Refactor/Re-architect: kompletter Umbau für Cloud-native. Für den Mittelstand oft pragmatisch: Lift & Shift zuerst, dann schrittweise optimieren." },
  { id:"c29", question:"Was ist ein Service Mesh in Container-Umgebungen?", options:["Ein Netzwerk-Monitoring-Tool","Infrastrukturschicht für Microservice-Kommunikation: managt Traffic zwischen Services, bietet Observability, Security (mTLS) und Resilienz (Retry, Circuit Breaker) transparent ohne Code-Änderungen","Ein Container-Netzwerk-Plugin","Ein Load Balancer für Container"], correct:1, explanation:"Service Mesh (Istio, Linkerd) fügt einen Sidecar-Proxy zu jedem Container hinzu. Dieser Proxy managt alle ein-/ausgehenden Verbindungen. Vorteile: automatisch verschlüsselte Service-zu-Service-Kommunikation (mTLS), Canary Deployments, detailliertes Tracing. Kommt zum Einsatz wenn Kubernetes-Umgebungen komplex werden." },
  { id:"c30", question:"Was ist Cloud-Observability und wie unterscheidet sie sich von Monitoring?", options:["Identisch mit Monitoring","Observability: tieferes Verständnis des System-Zustands durch Metrics, Logs und Traces. Monitoring: überwacht bekannte Metriken und schlägt Alarm. Observability ermöglicht unbekannte Probleme zu debuggen","Observability ist nur für große Unternehmen relevant","Monitoring ist moderner als Observability"], correct:1, explanation:"Monitoring: vordefinierte Metriken und Schwellwerte (CPU > 90% = Alarm). Observability: Logs, Metrics und Traces zusammen – damit kann man auch unbekannte Probleme explorativ untersuchen ('Warum ist Response-Time plötzlich hoch?'). Tools: Datadog, Grafana Stack (Prometheus + Loki + Tempo), Azure Monitor." },
],

hci: [
  { id:"h1", question:"Was bedeutet HCI (Hyper-Converged Infrastructure) genau?", options:["Ein besonders leistungsstarker Server","Integration von Compute, Storage und Netzwerk in Software-definierter Form auf Standard-Hardware – alle Funktionen laufen als Software auf denselben Knoten","Eine Cloud-Infrastruktur","Ein Hochleistungs-Netzwerksystem"], correct:1, explanation:"HCI ersetzt separate Server, Storage-Arrays und Netzwerkgeräte durch einheitliche Nodes. Jeder Node hat CPU, RAM, SSDs/HDDs. Die Software (z.B. Nutanix AOS, VMware vSAN, Microsoft S2D) verbindet alle Nodes zu einem gemeinsamen Pool. Skalierung: einfach weitere Nodes hinzufügen." },
  { id:"h2", question:"Was ist Nutanix und welche Hauptkomponenten hat die Plattform?", options:["Ein Cloud-Anbieter","HCI-Plattform: AOS (Betriebssystem/Storage-Software), AHV (Hypervisor), Prism (Management UI). Läuft auf Nutanix- oder zertifizierter Dell/HPE/Lenovo-Hardware","Ein Netzwerkvirtualisierungssystem","Ein Backup-System für virtuelle Maschinen"], correct:1, explanation:"Nutanix AOS verwaltet den distribuierten Storage (Nutanix Distributed File System, NDFS). AHV ist der mitgelieferte Hypervisor (basiert auf KVM). Prism ist die einheitliche Verwaltungsoberfläche. Nutanix kann auch auf VMware ESXi laufen – dann ohne AHV aber mit AOS." },
  { id:"h3", question:"Was ist Nutanix Prism und welche Versionen gibt es?", options:["Ein Backup-Tool von Nutanix","Einheitliche Management-Oberfläche. Prism Element: verwaltet einen einzelnen Cluster. Prism Central: verwaltet mehrere Cluster zentral, bietet erweiterte Analytics und Automatisierung","Ein Netzwerk-Monitoring-Tool","Ein Security-System von Nutanix"], correct:1, explanation:"Prism Element: eingebaut in jeden Cluster, HTML5-basiert, verwaltet VMs, Storage, Netzwerk des lokalen Clusters. Prism Central: separate VM die mehrere Cluster aggregiert. Zusatzfunktionen: Flow (Netzwerk-Mikrosegmentierung), Calm (Automation), Karbon (Kubernetes). PC ist Pflicht für größere Umgebungen." },
  { id:"h4", question:"Was ist VMware vSAN als HCI-Lösung?", options:["Ein Backup-System von VMware","VMware-eigene HCI-Software: lokale Festplatten der ESXi-Hosts werden zu gemeinsamen Datastore zusammengefasst. Voll integriert in vSphere-Ökosystem","Ein Netzwerkvirtualisierungssystem","Ein Cloud-Storage-Dienst von VMware"], correct:1, explanation:"vSAN integriert sich nativ in vSphere: im vCenter konfiguriert, keine separate Management-Konsole nötig. Disk Groups: SSDs als Cache-Tier, HDDs oder SSDs als Kapazitäts-Tier. Policies: Anzahl der Fehler-Toleranz pro VM definierbar. vSAN Express Storage Architecture (ESA) für All-Flash mit NVMe optimiert." },
  { id:"h5", question:"Was ist Microsoft Storage Spaces Direct (S2D)?", options:["Ein Cloud-Speichersystem von Microsoft","Windows Server Feature das lokale Festplatten zu einem Software-defined Storage-Cluster kombiniert – Basis für Azure Stack HCI","Ein Backup-System für Windows Server","Ein NAS-System von Microsoft"], correct:1, explanation:"S2D: Windows Server (2016+) Feature für HCI. Kombiniert lokale NVMe/SSD/HDD zu einem gemeinsamen Storage-Pool. Basis für Azure Stack HCI (dediziertes HCI-OS von Microsoft). Vorteil: tiefe Hyper-V und Windows-Integration, bekannte Werkzeuge. Nachteil: Windows-only, komplexer als Nutanix." },
  { id:"h6", question:"Was ist das Nutanix Distributed File System (NDFS)?", options:["Ein NAS-Protokoll von Nutanix","Verteiltes Software-definiertes Dateisystem das auf allen Nutanix-Knoten läuft. Daten werden in 'Extents' aufgeteilt und über Knoten verteilt – kein zentraler Storage-Controller","Ein Cloud-Speichersystem","Ein Backup-Dateisystem"], correct:1, explanation:"NDFS ist das Herzstück von Nutanix: Daten werden in Extents (1MB) aufgeteilt und auf mehreren Knoten repliziert (Replication Factor 2 oder 3). Controller VM (CVM) auf jedem Knoten verwaltet lokalen Storage und kommuniziert mit CVMs anderer Knoten. Kein SPOF: jeder Knoten hat komplette Storage-Logik." },
  { id:"h7", question:"Was ist ein HCI Replication Factor (RF)?", options:["Die Anzahl der physischen Backups","Anzahl der Datenkopien im Cluster: RF2 = 2 Kopien (1 Knoten darf ausfallen), RF3 = 3 Kopien (2 Knoten dürfen ausfallen)","Die Anzahl der Cluster-Knoten","Die Replikationsgeschwindigkeit zwischen Knoten"], correct:1, explanation:"RF2: Standardkonfiguration, 1 Knoten-Ausfall toleriert. RF3: 2 gleichzeitige Knoten-Ausfälle toleriert, benötigt aber 3 Knoten Minimum und 50% mehr Storage-Overhead. Pro VM konfigurierbar in Nutanix: kritische VMs RF3, weniger kritische RF2. Bei RF2-Cluster: mindestens 3 Knoten für Quorum." },
  { id:"h8", question:"Was ist die Controller VM (CVM) bei Nutanix und welche Rolle spielt sie?", options:["Eine gewöhnliche virtuelle Maschine für Anwendungen","Spezielle VM auf jedem Nutanix-Knoten die den lokalen Storage verwaltet und NDFS-Kommunikation koordiniert – läuft auf allen Hypervisoren, darf nie abgeschaltet werden","Ein Monitoring-Agent für den Knoten","Ein Netzwerk-Controller"], correct:1, explanation:"CVM ist das Gehirn jedes Nutanix-Knotens: verwaltet lokale SSDs/HDDs, spricht mit anderen CVMs, stellt iSCSI/NFS/SMB für Hypervisor bereit, führt Daten-Tiering, Kompression und Deduplizierung durch. CVM hat reservierte Ressourcen (CPU/RAM) die andere VMs nicht nutzen können. Fällt CVM aus: Knoten nutzt Storage anderer CVMs." },
  { id:"h9", question:"Was ist HCI Stretched Cluster (Metro Cluster)?", options:["Ein besonders großer HCI-Cluster","HCI-Cluster über zwei Standorte verteilt: VMs laufen aktiv-aktiv oder aktiv-passiv über Standorte, Daten werden synchron repliziert – schützt vor komplettem Standortausfall","Eine Art Cloud-Verbindung für HCI","Ein Backup-Cluster am zweiten Standort"], correct:1, explanation:"Stretched Cluster (Nutanix Sync Rep, vSAN Stretched): Daten synchron über zwei Standorte repliziert. Fällt ein Standort komplett aus: VMs laufen am anderen Standort weiter (oder starten neu bei aktiv-passiv). Witness-VM am dritten Standort für Quorum. Für echte RTO/RPO=0 Anforderungen." },
  { id:"h10", question:"Was ist der Unterschied zwischen HCI und klassischer 3-tier Architektur?", options:["Es gibt keinen Unterschied in der Praxis","3-tier: separate Schichten für Compute (Server), Storage (SAN/NAS), Netzwerk – verschiedene Teams, Silos. HCI: alle drei Schichten auf denselben Knoten, einheitliche Verwaltung, weniger Komplexität","3-tier ist veraltet und wird nicht mehr eingesetzt","HCI ist immer günstiger als 3-tier"], correct:1, explanation:"3-tier: Flexibilität durch Trennung, aber Silos, komplexes Management, viele Schnittstellen. HCI: einfacher (eine Plattform), schnelleres Deployment, weniger Vendor-Management. Nachteile HCI: weniger Flexibilität bei Skalierung (immer ganze Nodes kaufen), Storage und Compute skalieren zusammen auch wenn nur eines benötigt wird." },
  { id:"h11", question:"Was ist Nutanix Flow und wofür wird es eingesetzt?", options:["Ein Netzwerk-Monitoring-Tool","Mikrosegmentierungs-Funktion in Nutanix: definiert detaillierte Firewall-Regeln zwischen VMs direkt in der Plattform – kein externes Firewall-System nötig für East-West-Traffic","Ein Load-Balancing-System","Ein VPN-System für Nutanix"], correct:1, explanation:"Flow (jetzt 'Flow Network Security') ermöglicht Microsegmentierung: jede VM bekommt detaillierte Firewall-Regeln basierend auf Kategorien/Tags. East-West-Traffic (VM zu VM) wird gefiltert – ohne physische Firewall zwischen Hosts. Im 3-tier-Modell schwer realisierbar, in HCI nativ integriert." },
  { id:"h12", question:"Was ist Nutanix Calm?", options:["Ein Monitoring-Tool für Nutanix-Cluster","Application Lifecycle Management und Automation-Plattform: Blueprints definieren komplette Anwendungsumgebungen, die per Klick oder API bereitgestellt werden können","Ein Backup-System für Nutanix","Ein Sicherheitssystem für VMs"], correct:1, explanation:"Calm: Infrastructure-as-Code light für Nutanix. Blueprints beschreiben Anwendungen (VMs, Netzwerk, Konfiguration). Nutzer können aus Self-Service-Katalog Umgebungen anfordern. Automation: Skalierung, Updates, Day-2-Operations. Auch Multi-Cloud: gleiche Blueprints für AWS/Azure/on-premise." },
  { id:"h13", question:"Was ist Nutanix Karbon?", options:["Ein Container-Registrierungssystem","Kubernetes-as-a-Service auf Nutanix: deployt und verwaltet Kubernetes-Cluster auf Nutanix-Infrastruktur automatisch","Ein Cloud-Dienst von Nutanix","Ein Netzwerk-Virtualisierungssystem"], correct:1, explanation:"Karbon vereinfacht Kubernetes-Deployment auf Nutanix: Cluster per Klick erstellen, automatische Updates, Integration mit Nutanix Storage (volumes für PersistentVolumeClaims), Monitoring. Für Teams die Container-Workloads auf ihrer HCI-Infrastruktur betreiben wollen ohne Kubernetes-Cluster manuell zu verwalten." },
  { id:"h14", question:"Was ist ein HCI-Node Minimum und warum?", options:["1 Node ist ausreichend","Minimum 3 Nodes für RF2-Betrieb: 2 Nodes für Daten, 1 Node für Quorum/Metadaten – bei 2 Nodes kein Split-Brain-Schutz möglich","Minimum 5 Nodes für Produktionsbetrieb","Minimum 10 Nodes für sinnvollen Betrieb"], correct:1, explanation:"HCI braucht Quorum für Entscheidungen (z.B. welche Node hat die aktuellsten Daten bei Split-Brain). Mit 2 Nodes: 50/50 – kein Mehrheitsentscheid möglich. Mit 3 Nodes: eine Seite hat immer Mehrheit. Ausnahme: Nutanix bietet '2-Node-Cluster' mit externem Witness als Quorum – für kleine Standorte." },
  { id:"h15", question:"Was ist All-Flash HCI vs. Hybrid HCI?", options:["Identisch in der Performance","All-Flash: ausschließlich SSDs (NVMe/SATA) – maximale IOPS und niedrigste Latenz, höhere Kosten. Hybrid: SSD als Cache-Tier + HDD als Kapazitäts-Tier – günstiger, aber SSD-Tier als Engpass","Hybrid ist immer teurer","All-Flash ist nur für Großrechenzentren"], correct:1, explanation:"Hybrid: SSD (10-30% der Kapazität) dient als read/write Cache für HDDs. Häufig genutzte Daten bleiben auf SSD (hot), kalte Daten wandern auf HDD. Ergebnis: gute Performance für typische Workloads. All-Flash: alles NVMe – für OLTP-Datenbanken, VDI. Preisunterschied wird kleiner – All-Flash wird Standard." },
  { id:"h16", question:"Was ist Nutanix AHV (Acropolis Hypervisor)?", options:["Ein separater Hypervisor der auf eigener Hardware läuft","Nutanix eigener Hypervisor basierend auf KVM/QEMU – kostenlos in Nutanix enthalten, vollständig in Prism integriert, Alternative zu VMware ESXi und Hyper-V","Ein Cloud-Hypervisor","Ein Typ-2-Hypervisor für Entwicklungsumgebungen"], correct:1, explanation:"AHV ist KVM-basiert und ohne zusätzliche Lizenzkosten in Nutanix enthalten. Vollständig über Prism verwaltet: VM-Erstellung, Snapshots, Networking, Storage. Für viele Workloads ausreichend. Vorteil: keine VMware-Lizenzkosten. Nachteil: weniger mature als vSphere für komplexe Anforderungen, kleineres Ecosystem." },
  { id:"h17", question:"Was ist Nutanix Leap (Disaster Recovery)?", options:["Ein Hochverfügbarkeits-Feature innerhalb eines Clusters","DR-as-a-Service: automatisiert Disaster Recovery zwischen Nutanix-Clustern oder zu Nutanix Xi Cloud. Runbooks definieren Recovery-Reihenfolge, automatisches Failover und Failback","Ein Backup-System für Nutanix","Ein Migration-Tool"], correct:1, explanation:"Nutanix Leap: Replikation von VMs zu Ziel-Cluster (on-premise oder Xi Cloud), Runbooks für Recovery-Reihenfolge und Netzwerk-Remapping, Failover-Test ohne Produktionsunterbrechung. Alles aus Prism Central gesteuert ohne separate DR-Software. Vereinfacht DR erheblich." },
  { id:"h18", question:"Was ist Intel Optane/PMem und welche Rolle spielt es in HCI?", options:["Ein neuer SSD-Standard","Persistent Memory: Speicher mit RAM-Geschwindigkeit aber Persistenz wie NVME – kann als extrem schneller Cache oder direkt addressierbarer persistenter Speicher genutzt werden","Ein neuer Netzwerkstandard","Ein Prozessor-Cache-Technologie"], correct:1, explanation:"Intel Optane DIMM sitzt in RAM-Slots, hat RAM-ähnliche Geschwindigkeit (ns-Latenz) aber behält Daten bei Stromausfall. In HCI: als ultra-schneller Write-Cache vor SSDs (eliminiert SSD-Schreib-Latenz). Nutanix und vSAN unterstützen Optane als Metadaten-Cache. Technologie eingestellt von Intel aber im Einsatz bei bestehenden Systemen." },
  { id:"h19", question:"Was ist Erasure Coding bei HCI-Systemen?", options:["Eine Datenverschlüsselungsmethode","Alternative zu vollständiger Replikation: Daten werden in Fragmente aufgeteilt mit Parity-Informationen – spart Speicherplatz bei ähnlicher Redundanz","Eine Backup-Methode","Eine Komprimierungsmethode"], correct:1, explanation:"Erasure Coding (EC): ähnlich wie RAID 5/6 aber verteilt über Nodes statt Festplatten. Bei RF2 braucht man 2x Speicher. EC-X 4+1: Daten in 4 Fragmente + 1 Parity = 1,25x Overhead. Weniger Speicher-Overhead bei ähnlicher Redundanz. Nachteil: mehr CPU-Last für Berechnung. Nutanix EC-X, vSAN Erasure Coding." },
  { id:"h20", question:"Was ist NCI (Nutanix Cloud Infrastructure) im modernen Nutanix-Portfolio?", options:["Ein Cloud-Anbieter von Nutanix","Neue Bezeichnung für die HCI-Plattform in Nutanix Cloud Platform (NCP): kombiniert AOS, AHV, vSAN-Funktionalität unter einheitlichem Software-Lizenzmodell","Ein Netzwerkvirtualisierungssystem","Ein Monitoring-System"], correct:1, explanation:"Nutanix hat Produktnamen reorganisiert: Nutanix Cloud Platform (NCP) ist das Gesamtpaket. NCI (Cloud Infrastructure): HCI mit AOS + AHV. NCM (Cloud Manager): Prism Central + Calm + Cost Governance. NCS (Cloud Security): Security-Funktionen. Wichtig für Angebote und Gespräche mit Kunden die nach aktuellen Produktnamen fragen." },
  { id:"h21", question:"Was sind die typischen Vorteile von HCI für den Mittelstand?", options:["HCI ist für den Mittelstand zu teuer und komplex","Einfacheres Management (eine Plattform), schnellere Bereitstellung, weniger Vendor-Komplexität, gut skalierbar, oft günstiger als 3-tier im TCO-Vergleich","HCI bietet keine Vorteile gegenüber klassischen Servern","HCI ist ausschließlich für Großunternehmen geeignet"], correct:1, explanation:"Mittelstand profitiert von HCI durch: reduzierter Management-Aufwand (ein Team für alles statt Server/Storage/Netzwerk-Silos), schnellere Reaktion auf Geschäftsanforderungen, planbarere Kosten, einfacheres DR. Typischer Einstieg: 3-Knoten-Cluster für Primär-Virtualisierung, skalierbar nach Bedarf." },
  { id:"h22", question:"Was ist VMware vSAN Max (früher HCI Mesh)?", options:["Eine neue VMware HCI-Lösung für kleine Unternehmen","Disaggregated HCI: trennt Compute-Nodes und Storage-Nodes – Storage-Knoten können von mehreren Compute-Clustern genutzt werden","Ein Cloud-Dienst von VMware","Ein Monitoring-System für vSAN"], correct:1, explanation:"vSAN Max entkoppelt Storage von Compute: dedizierte Storage-Nodes bilden einen Pool der von mehreren Compute-ESXi-Clustern genutzt werden kann. Löst das Problem dass bei HCI Compute und Storage immer zusammen skalieren. Ideal wenn man viel Storage aber nicht mehr Compute braucht." },
  { id:"h23", question:"Was ist Nutanix Mine with HYCU?", options:["Ein Backup-System","Integrierte Backup-Lösung: HYCU-Backup-Software läuft auf dediziertem Nutanix-Storage-Cluster. Backup-Target und -Software in einem – kein separates Backup-System nötig","Ein Monitoring-System","Ein DR-System"], correct:1, explanation:"Nutanix Mine: dedizierter Nutanix-Cluster als Backup-Target. In Kombination mit HYCU, Veeam oder Commvault. Vorteile: Deduplication/Kompression direkt auf dem Target, skalierbar, einheitlich mit Prism verwaltet. Für Kunden die Nutanix-Infrastruktur konsolidieren und auch Backup integrieren wollen." },
  { id:"h24", question:"Was ist der Unterschied zwischen Node-Failure-Tolerance und Block-Failure-Tolerance bei HCI?", options:["Identisch","Node-Failure-Tolerance: eine einzelne Node darf ausfallen. Block-Failure-Tolerance: ein komplettes Block-Chassis (mehrere Nodes) darf ausfallen – höhere Redundanz wenn Nodes in gemeinsamen Chassis sitzen","Block-Failure-Tolerance ist veraltet","Node-Failure-Tolerance ist höher als Block-Failure-Tolerance"], correct:1, explanation:"Nutanix Block Awareness: verhindert dass beide Kopien einer VM auf Nodes im selben physischen Chassis liegen (gemeinsame Stromversorgung/Kühlung). Mit Block Awareness: kann ein ganzes Chassis ausfallen ohne Datenverlust. Voraussetzung: genug Nodes in verschiedenen Chassis. Für Enterprise-Deployments wichtig." },
  { id:"h25", question:"Was ist Nutanix Objects?", options:["Ein Object Storage Service von Nutanix der S3-kompatiblen Speicher auf Nutanix-Infrastruktur bereitstellt","Ein Datei-Server-Dienst","Ein Backup-System","Ein Monitoring-System"], correct:0, explanation:"Nutanix Objects: S3-kompatibler Object Store auf Nutanix-Hardware. Anwendungen die AWS S3 ansprechen können können direkt Nutanix Objects nutzen. Einsatz: Backup-Target (Veeam, Commvault), Archiv, unstrukturierte Daten, DevOps-Artefakte. Skaliert auf Petabytes, integriert in Prism verwaltet." },
  { id:"h26", question:"Was ist Nutanix Files?", options:["Ein Datei-Manager für Nutanix-VMs","Software-defined NAS auf Nutanix: SMB- und NFS-Shares direkt aus dem Nutanix-Cluster – kein externes NAS-System nötig","Ein Backup-System für Dateien","Ein Archiv-System"], correct:1, explanation:"Nutanix Files läuft als Scale-Out File Server auf dem Nutanix-Cluster: Windows-SMB-Shares und Linux-NFS-Exports ohne externe NAS-Hardware. Vorteile: einheitlich in Prism verwaltet, automatische Skalierung, integriertes Daten-Tiering zu S3/Objects. Für Kunden die Dateiserver-Workloads in HCI konsolidieren wollen." },
  { id:"h27", question:"Was ist HCI-Sizing und welche Faktoren sind relevant?", options:["Nur die Anzahl der VMs ist relevant","Dimensionierung eines HCI-Clusters: Anzahl VMs, CPU-Anforderungen, RAM, Storage-Kapazität, IOPS-Bedarf, Wachstumsplanung, Replication Factor, N+1 Redundanz für Node-Ausfall","Nur der Speicherbedarf bestimmt die Knotenzahl","HCI kann nicht im Voraus dimensioniert werden"], correct:1, explanation:"HCI-Sizing-Faktoren: Workload-Profile (Anzahl VMs, CPU/RAM per VM), Storage-Kapazität (RF-Overhead, Wachstum 3 Jahre), IOPS-Bedarf (SSD vs. Hybrid), Replication Factor (RF2 vs. RF3), N+1 (bei 3 Knoten: 1 Ausfall tolerierbar, aber nächste 4. Knoten bald?). Tools: Nutanix Sizer, VMware Sizing Calculator." },
  { id:"h28", question:"Was ist vSAN File Services?", options:["Ein Backup-System für vSAN","NFS/SMB-File-Services direkt aus vSAN ohne externes NAS – ähnlich wie Nutanix Files, integriert in vSphere","Ein Monitoring-System für vSAN","Ein Storage-Protokoll für vSAN"], correct:1, explanation:"vSAN File Services (ab vSAN 7): SMB und NFS direkt aus dem vSAN-Datastore ohne externes NAS. Scale-Out File Server als VMs auf dem Cluster. Vorteil: weniger externe Systeme, einheitliche vCenter-Verwaltung. Weniger ausgereift als dedizierte NAS-Systeme oder Nutanix Files, aber für einfache Anwendungsfälle ausreichend." },
  { id:"h29", question:"Was ist Azure Stack HCI?", options:["Ein Cloud-Dienst von Microsoft","Microsoft HCI-Lösung: Windows Server S2D auf zertifizierter Hardware mit Azure-Management-Anbindung – Hybrid-Cloud-HCI, verwaltet über Azure Portal und Arc","Ein virtueller Server von Microsoft","Ein Backup-System von Microsoft"], correct:1, explanation:"Azure Stack HCI: HCI-OS (Windows Server Core + S2D) auf zertifizierter Hardware. Besonderheit: Cluster wird in Azure registriert, Monitoring und Management über Azure Arc, Zugriff auf Azure-Dienste. Subscription-Modell ($/Core/Monat). Für Unternehmen die Azure-Strategie haben und on-premise HCI wollen." },
  { id:"h30", question:"Was ist der TCO-Vorteil von HCI gegenüber klassischer 3-tier Infrastruktur?", options:["HCI ist immer teurer – dafür einfacher","HCI: geringerer CapEx durch Standard-Hardware, reduzierter OpEx durch weniger Verwaltungsaufwand, weniger Rack Space, weniger Energie – typisch 30-50% TCO-Einsparung über 5 Jahre","HCI hat keinen TCO-Vorteil","TCO-Vergleiche sind immer gleich"], correct:1, explanation:"TCO-Analyse HCI vs. 3-tier: CapEx – HCI-Nodes günstiger als Server + SAN + Netzwerk separat. OpEx – ein Admin statt 3 Spezialisten, weniger Rack/Strom/Kühlung, automatisierte Prozesse. Risiko: HCI-Node-Ausfall trifft Compute + Storage gleichzeitig. Bei 5-Jahres-Betrachtung: HCI meist günstiger, besonders im Mittelstand." },
],

backup: [
  { id:"b1", question:"Was ist die 3-2-1-Backup-Regel?", options:["3 Server, 2 Standorte, 1 tägliches Backup","3 Kopien der Daten, auf 2 verschiedenen Medientypen, davon 1 Kopie an einem externen Standort","3 Backups pro Tag, 2 Wochen aufbewahren, 1 Offsite-Kopie","3 volle, 2 differentielle, 1 inkrementelles Backup"], correct:1, explanation:"3-2-1 ist der Goldstandard: 3 Datenkopien (Original + 2 Backups), 2 verschiedene Medien (z.B. NAS + Tape oder NAS + Cloud), 1 Offsite-Kopie (anderer Standort oder Cloud). Schützt vor: Hardware-Ausfall, Feuer/Überschwemmung, Ransomware (wenn Offsite air-gapped)." },
  { id:"b2", question:"Was ist der Unterschied zwischen RPO und RTO?", options:["Identische Begriffe","RPO (Recovery Point Objective): maximaler Datenverlust in Zeit. RTO (Recovery Time Objective): maximal akzeptable Ausfallzeit bis zur Wiederherstellung","RPO ist für Daten, RTO für Systeme","RTO ist wichtiger als RPO"], correct:1, explanation:"RPO: Wie alt dürfen wiederhergestellte Daten sein? RPO=1h bedeutet: stündliche Backups nötig. RTO: Wie lange darf das System nach Ausfall nicht verfügbar sein? RTO=4h bedeutet: Wiederherstellung muss in 4h abgeschlossen sein. Beide Werte bestimmen Backup-Strategie und -Kosten." },
  { id:"b3", question:"Was ist der Unterschied zwischen vollem, differentiellem und inkrementellen Backup?", options:["Alle drei sichern dieselben Daten, nur in unterschiedlicher Reihenfolge","Voll: alle Daten. Differentiell: alle Änderungen seit letztem Voll-Backup. Inkrementell: nur Änderungen seit letztem Backup (voll oder inkrementell)","Differentiell und inkrementell sind identisch","Volles Backup ist veraltet"], correct:1, explanation:"Voll: langsam, viel Speicher, schnellste Wiederherstellung. Differentiell: wächst täglich, Restore braucht 2 Backups (voll + letztes diff). Inkrementell: kleinste Backups, längste Restore-Kette (voll + alle inkrementellen). Strategien: voll wöchentlich + täglich inkrementell ist Standardansatz." },
  { id:"b4", question:"Was ist Veeam Backup & Replication und warum ist es im Mittelstand dominant?", options:["Ein Cloud-Backup-Service","Backup-Software für VMware und Hyper-V Umgebungen – sichert VMs, physische Server und Cloud-Workloads. Führend im Mittelstand durch einfache Bedienung, starke Features und breites Ecosystem","Ausschließlich für Großunternehmen geeignet","Ein Open-Source-Backup-Tool"], correct:1, explanation:"Veeam: image-basierte VM-Backups, Application-aware (VSS für Exchange, SQL), Instant VM Recovery (VM läuft direkt vom Backup), Veeam Agent für physische Server, Replication, Cloud-Integration. Lizenzmodell per Socket oder Workload. Starkes Partner-Ecosystem. Marktführer im SMB/Mittelstand." },
  { id:"b5", question:"Was ist Instant VM Recovery (Veeam) und wann wird es eingesetzt?", options:["Eine Methode zur schnellen VM-Erstellung","VM startet direkt vom Backup-Storage ohne vollständige Wiederherstellung – System läuft in Minuten wieder, Migration auf Produktionsstorage im Hintergrund","Eine Art von Snapshot-Backup","Eine Cloud-Migration-Funktion"], correct:1, explanation:"Veeam Instant Recovery: VM wird direkt vom Backup-Repository gestartet (vPower Technology). In Minuten ist die VM wieder online, auch wenn Wiederherstellung Stunden dauern würde. Im Hintergrund werden Daten auf regulären Storage migriert. Entscheidend für kurze RTO-Anforderungen." },
  { id:"b6", question:"Was ist eine Backup-Immutability und warum ist sie wichtig?", options:["Eine Methode zur Backup-Beschleunigung","Backups die nach dem Schreiben nicht mehr verändert oder gelöscht werden können – schützt vor Ransomware-Verschlüsselung der Backups","Eine Art von Backup-Verschlüsselung","Eine Compliance-Anforderung für Archivdaten"], correct:1, explanation:"Ransomware verschlüsselt nicht nur Primärdaten – sie greift auch angebundene Backup-Systeme an. Immutable Backups (Object Lock auf S3, Hardened Repository auf Linux) können nach dem Schreiben nicht verändert werden – auch nicht durch kompromittierte Admin-Credentials. Standard in modernen Backup-Architekturen." },
  { id:"b7", question:"Was ist ein Backup-Repository und welche Typen gibt es?", options:["Ein Ort wo Backup-Software gespeichert wird","Speicherziel für Backups. Typen: lokales NAS, Tape, Object Storage (S3), Cloud (Azure Blob, AWS S3), Hardened Linux Repository (immutable)","Ein Backup-Server","Ein Archiv-System"], correct:1, explanation:"Repository-Typen nach Verwendungszweck: lokales NAS für schnellen Restore (SOBR Tier 1), Object Storage für Langzeit und Immutability (SOBR Tier 2), Tape für Archiv und Air-Gap, Cloud als Offsite-Tier. Scale-Out Backup Repository (SOBR) in Veeam kombiniert mehrere Repositories zu einer logischen Einheit." },
  { id:"b8", question:"Was ist Application-Aware Backup und warum ist es wichtig?", options:["Backups die nur bestimmte Anwendungen sichern","Backup koordiniert sich mit laufenden Anwendungen (VSS bei Windows) um konsistente, transaktionskonsistente Sicherungen zu erstellen – wichtig für Exchange, SQL Server, Active Directory","Eine Art von inkrementellen Backups","Backups die Anwendungskonfigurationen speichern"], correct:1, explanation:"Ein einfacher VM-Snapshot sichert Daten auf Disk – laufende Transaktionen in RAM/Transaktionslog können inkonsistent sein. Application-Aware (VSS): Anwendung wird kurz in konsistenten Zustand gebracht (Transaktionslogs geleert), dann Snapshot. Exchange/SQL ohne Application-Aware: Restore funktioniert, Datenbank kann corrupt sein." },
  { id:"b9", question:"Was ist das Grandfather-Father-Son (GFS) Backup-Schema?", options:["Ein veraltetes Backup-System","Aufbewahrungsschema: tägliche (Son), wöchentliche (Father) und monatliche (Grandfather) Backups mit unterschiedlichen Aufbewahrungszeiten – Pflicht für Compliance","Ein RAID-ähnliches Backup-Schema","Ein Cloud-Backup-Schema"], correct:1, explanation:"GFS: täglich 7 Tage aufbewahren (Son), wöchentlich 4 Wochen (Father), monatlich 12 Monate (Grandfather), jährlich dauerhaft (optional). Ermöglicht Wiederherstellung von gestern bis vor Monaten. Kombination mit Offsite-Replikation für alle Ebenen gibt vollständige Backup-Strategie." },
  { id:"b10", question:"Was ist der Unterschied zwischen Backup und Replikation?", options:["Identisch","Backup: Sicherungskopien zu Zeitpunkten, für Restore. Replikation: kontinuierliche/regelmäßige Kopie am Zielstandort, für schnelles Failover – VM läuft sofort am Zielstandort","Replikation ist schneller als Backup","Backup ist sicherer als Replikation"], correct:1, explanation:"Backup: mehrere Versionen, lange Aufbewahrung, für Recovery nach Datenverlust oder Fehler. Replikation (Veeam Replication, Storage Replication): aktuelle Kopie am DR-Standort, kein langer Restore – VM startet sofort. Aber: Ransomware/Datenfehler replizieren sich sofort mit. Beide Strategien ergänzen sich." },
  { id:"b11", question:"Was ist ein Backup-Test und warum ist er wichtiger als das Backup selbst?", options:["Tests sind unnötig wenn das Backup erstellt wird","Regelmäßige Überprüfung ob Backups tatsächlich wiederherstellbar sind – ohne Test: keine Garantie. Oft vernachlässigt bis es zu spät ist","Tests sollten nur nach Systemänderungen durchgeführt werden","Automatische Backup-Jobs brauchen keine Tests"], correct:1, explanation:"Ein Backup das nie getestet wurde ist kein Backup – es ist ein Hoffnung. Veeam SureBackup: automatisierte Backup-Tests (VM startet aus Backup, Heartbeat und Applikationstest). Mindestens quartalsweise manuelle Restore-Tests. Häufige Backup-Fehler werden sonst erst beim echten Notfall entdeckt." },
  { id:"b12", question:"Was ist ein Hardened Linux Repository (Veeam)?", options:["Ein Linux-Server mit besonders starker Hardware","Linux-Server der als immutables Backup-Repository konfiguriert ist – Backups können nach dem Schreiben X Tage nicht gelöscht werden, auch nicht bei kompromittierten Admin-Credentials","Ein verschlüsselter Backup-Server","Ein Cloud-Backup-Ziel"], correct:1, explanation:"Veeam Hardened Repository: Ubuntu/RHEL-Server mit immutable Flag auf Backups (Linux chattr +i). Wichtig: kein Windows (AD-Angriffsfläche), dedizierter Nutzer nur für Veeam, kein direkter Admin-Zugriff. Ransomware kann Backups nicht verschlüsseln da sie auf OS-Ebene schreibgeschützt sind." },
  { id:"b13", question:"Was ist Cloud-Backup als offsite Backup-Tier?", options:["Backup ausschließlich in der Cloud ohne lokales Backup","Primäres Backup lokal für schnellen Restore, Kopie in Cloud (Azure Blob Cold, AWS S3 Glacier) für Offsite-Schutz und Langzeit-Aufbewahrung zu niedrigen Kosten","Backup das automatisch in die Cloud migriert","Eine Art von Cloud-DR"], correct:1, explanation:"Cloud als Offsite-Tier: Veeam SOBR Capacity Tier oder Backup Copy Job zu Cloud-Ziel. Azure Blob Cool/Cold: sehr günstiger Speicher. AWS S3 Glacier: Langzeitarchiv. Vorteil: kein zweiter Standort nötig für Offsite-Schutz. Nachteil: Restore-Geschwindigkeit aus Cloud abhängig von Internetanbindung." },
  { id:"b14", question:"Was ist ein Backup-Fenster und welche Probleme entstehen wenn er zu klein ist?", options:["Der Zeitraum für IT-Wartungsarbeiten","Zeitraum in dem Backups abgeschlossen sein müssen (oft nachts). Zu kleines Fenster: Backups überlappen, Performance-Probleme, Backups nicht abgeschlossen vor Arbeitsbeginn","Ein technisches Problem beim Backup-System","Die maximale Datenmenge pro Backup-Job"], correct:1, explanation:"Backup-Fenster: z.B. 22:00 bis 6:00. Wenn Vollbackup 10h dauert aber Fenster nur 8h: Backup unvollständig. Lösungen: inkrementelle Backups statt täglich voll, mehr Parallelität, schnelleres Repository, Kompression/Deduplication. Wachsende Datenmengen erfordern regelmäßige Backup-Infrastruktur-Anpassung." },
  { id:"b15", question:"Was ist VSS (Volume Shadow Copy Service) und welche Rolle spielt es beim Backup?", options:["Ein Backup-Software-Produkt von Microsoft","Windows-Dienst der konsistente Snapshots von Volumes erstellt während Anwendungen laufen – Grundlage für Application-Aware Backups von Exchange, SQL, AD","Ein Filesystem-Format für Backups","Ein RAID-System für Windows Server"], correct:1, explanation:"VSS koordiniert zwischen Backup-Software (Requestor), Anwendungen (Writer) und Storage (Provider). Jede Windows-Anwendung hat VSS-Writer der Anwendung kurz in konsistenten Zustand bringt. Backup-Software triggert VSS, erstellt Snapshot, Backup läuft, VSS-Snapshot wird verworfen. Transparenter Prozess für den Nutzer." },
  { id:"b16", question:"Was ist WORM-Speicher im Backup-Kontext?", options:["Eine schnelle SSD-Technologie","Write Once Read Many: Daten können nach dem Schreiben nicht verändert werden – für Compliance-Archivierung und Ransomware-Schutz","Eine Art von Object Storage","Eine Backup-Verschlüsselungsmethode"], correct:1, explanation:"WORM (Write Once Read Many): physisch (Tape, optische Medien) oder logisch (Object Lock in S3, NetApp SnapLock). Compliance: GoBD, DSGVO verlangen unveränderliche Archivierung. Security: Ransomware kann WORM-Daten nicht verschlüsseln. Veeam Object Lock + S3-kompatibles Storage = günstige WORM-Lösung." },
  { id:"b17", question:"Was ist Backup Deduplication und welche Einsparungen sind realistisch?", options:["Eine Komprimierungsmethode für Backup-Dateien","Identische Datenblöcke werden nur einmal gespeichert – bei ähnlichen VMs (gleiche OS-Basis) typisch 3:1 bis 10:1 Einsparungen","Löschen alter Backup-Versionen","Eine Methode zur Backup-Beschleunigung"], correct:1, explanation:"Dedup im Backup-Kontext: 10 VMs mit Windows Server 2022 als Basis haben Tausende identischer OS-Blöcke. Nach Dedup: OS-Blöcke einmal gespeichert, nur unique Applikationsdaten mehrfach. Einsparungen: 5-30 VMs mit ähnlichem OS: 5:1 bis 20:1 realistisch. Deduplizierungs-Appliances (Quantum DXi, ExaGrid) spezialisiert darauf." },
  { id:"b18", question:"Was ist das 3-2-1-1-0 Backup-Schema (Veeam Empfehlung)?", options:["Veraltet – heute wird nur noch 3-2-1 verwendet","Erweiterung von 3-2-1: +1 Kopie air-gapped/offline/immutable (Ransomware-Schutz), +0 Fehler im Backup (regelmäßige Tests mit SureBackup)","Eine neue Backup-Strategie ohne Offsite-Kopie","Nur relevant für Großunternehmen"], correct:1, explanation:"3-2-1-1-0: 3 Kopien, 2 Medientypen, 1 Offsite, 1 Kopie air-gapped oder immutable (Tape, Hardened Repo, Object Lock), 0 Fehler (regelmäßige Backup-Tests). Veeam hat das als Best-Practice gegen Ransomware etabliert. Zeigt dass 3-2-1 alleine nicht ausreicht wenn alle Kopien online und veränderbar sind." },
  { id:"b19", question:"Was ist ein Backup-Proxy und welche Funktion hat er?", options:["Ein Server der Backups verschlüsselt","Intermediäre Komponente im Backup-Prozess: liest VM-Daten vom Storage, prozessiert (Kompression, Dedup) und schreibt ins Repository. Entlastet Backup-Server und ermöglicht parallele Jobs","Eine Art Backup-Cache","Ein Monitoring-Agent für Backups"], correct:1, explanation:"Veeam Backup Proxy: übernimmt rechenintensive Aufgaben (Datenprozessing). Backup-Server: koordiniert, Proxy: arbeitet. Mehrere Proxies: mehr parallele Backup-Jobs möglich. Proxy platziert nah am Quell-Storage oder am Repository (je nach Transport-Mode: Direct Storage, Virtual Appliance, Network)." },
  { id:"b20", question:"Was ist ein Scale-Out Backup Repository (SOBR)?", options:["Ein besonders großes einzelnes Backup-Repository","Fasst mehrere Backup-Repositories zu einer logischen Einheit zusammen – automatische Datenverteilung, einfache Kapazitätserweiterung, automatisches Tiering zu Cloud oder Tape","Ein Backup-System für Scale-Out Storage","Eine Art von verteiltem Backup-System"], correct:1, explanation:"Veeam SOBR: mehrere physische Repositories (Performance Tier: schneller lokaler NAS, Capacity Tier: Object Storage/Cloud, Archive Tier: Azure Archive/Tape) werden zu einer Einheit. Neue Backups kommen ins Performance Tier, ältere wandern automatisch ins Capacity Tier. Einfach erweiterbar ohne Job-Anpassung." },
  { id:"b21", question:"Was ist CDP (Continuous Data Protection)?", options:["Ein konventionelles Backup-Verfahren","Kontinuierliche Replikation jeder Schreiboperation – RPO in Sekunden statt Stunden, da nicht auf nächstes Backup-Fenster gewartet wird","Eine Art von synchroner Replikation","Ein Snapshot-basiertes Backup"], correct:1, explanation:"CDP erfasst jeden IO in Echtzeit. Veeam CDP nutzt VMware APIs um jeden VM-Schreibvorgang sofort zu replizieren. RPO von Sekunden bis Minuten. Vorteil gegenüber Replikation: Journal-Funktion erlaubt Recovery zu beliebigem Zeitpunkt (auch vor Ransomware-Infektion). Ressourcenintensiv – nur für kritischste VMs." },
  { id:"b22", question:"Was ist ein Air-Gap und warum ist er wichtig für Backup-Sicherheit?", options:["Eine Lücke im Backup-Zeitplan","Physische oder logische Trennung der Backup-Kopie vom Produktionsnetzwerk – Ransomware kann air-gapped Medien nicht erreichen und verschlüsseln","Eine Art von Backup-Verschlüsselung","Eine Netzwerktrennung für Backup-Traffic"], correct:1, explanation:"Air-Gap: Backup-Medium das nicht permanent mit dem Netzwerk verbunden ist. Echtes Air-Gap: Tape das offline gelagert wird. Logisches Air-Gap: Object Lock (Immutability), Hardened Repository mit eingeschränktem Zugriff. Ransomware hat bei Air-Gapped Backups keine Möglichkeit die Daten zu verschlüsseln." },
  { id:"b23", question:"Was ist Backup-Verschlüsselung und welche Ebenen gibt es?", options:["Verschlüsselung ist nur bei Cloud-Backups nötig","Verschlüsselung der Backup-Daten. Ebenen: In-flight (während Übertragung), at-rest (auf Repository). Wichtig: Schlüsselverwaltung – verlorener Schlüssel = verlorene Backups","Backup-Verschlüsselung verlangsamt immer erheblich","Nur Backup-Software-Produkte verschlüsseln"], correct:1, explanation:"Backup-Verschlüsselung: Veeam AES-256 In-flight und at-rest. Wichtig: Passwort/Schlüssel sicher verwahren (Password Manager, physischer Safe) – vergessenes Backup-Passwort macht alle Backups unbrauchbar. Compliance: verschlüsselte Backup-Tapes müssen bei Verlust nicht als Datenpanne gemeldet werden (DSGVO)." },
  { id:"b24", question:"Was ist Backup-Monitoring und welche Metriken sind wichtig?", options:["Nur ob Backup-Jobs laufen oder nicht","Proaktive Überwachung: Job-Status (Erfolg/Warnung/Fehler), Backup-Dauer, Repository-Kapazität, RPO-Compliance, Restore-Tests – Alarme bei Problemen vor dem nächsten Notfall","Monitoring ist nur für große Backup-Umgebungen nötig","Automatische Backup-Jobs brauchen kein Monitoring"], correct:1, explanation:"Backup ohne Monitoring ist wie Brandschutz ohne Feuermelder. Wichtige Metriken: Job-Erfolgsrate (100% anstreben), Job-Dauer (plötzliche Verlängerung = Problem), Repository-Füllstand (Alarm bei >80%), letzte erfolgreiche Sicherung jedes Systems. Veeam ONE, Veeam Backup Enterprise Manager oder PRTG für Backup-Monitoring." },
  { id:"b25", question:"Was ist ein Disaster Recovery Plan (DRP) und was unterscheidet ihn vom Backup?", options:["Identisch mit Backup-Konzept","DRP ist der dokumentierte Prozess zur vollständigen Wiederherstellung des IT-Betriebs nach Katastrophe: Prioritäten, Zuständigkeiten, Schritt-für-Schritt-Anleitung, Kommunikationsplan – Backup ist nur ein Werkzeug darin","DRP ist nur für Großunternehmen relevant","Backup reicht für Disaster Recovery aus"], correct:1, explanation:"DRP geht über Backup hinaus: Welche Systeme zuerst wiederherstellen? Wer macht was? Wie kommunizieren wir während des Ausfalls? Wo ist die Recovery-Hardware? Wie konfigurieren wir Netzwerk am DR-Standort? Backup liefert die Daten, DRP beschreibt den Prozess. Ohne DRP: Backup vorhanden aber Recovery dauert Tage statt Stunden." },
  { id:"b26", question:"Was ist Backup-as-a-Service (BaaS)?", options:["Cloud-Backup ohne on-premise Komponente","Backup-Dienst von einem Managed Service Provider oder Cloud-Anbieter: Software, Infrastruktur und Verwaltung als Dienstleistung – kein eigenes Backup-System aufbauen","Ein automatisches Backup-System","Ein kostenloses Backup-Angebot"], correct:1, explanation:"BaaS: MSP oder Cloud-Anbieter (Veeam Cloud Connect, Azure Backup, Commvault Metallic) übernimmt Backup-Infrastruktur. Vorteile: kein eigenes Repository aufbauen, managed Service, Offsite by default. Kosten: pro GB pro Monat. Für Mittelstand attraktiv wenn kein eigenes IT-Personal für Backup-Management vorhanden." },
  { id:"b27", question:"Was ist der Unterschied zwischen Backup und Archivierung im Kontext der GoBD?", options:["GoBD verlangt nur Backup","GoBD (Grundsätze zur ordnungsmäßigen Buchführung) verlangt revisionssichere Archivierung von Geschäftsdokumenten 10 Jahre. Backup: für Recovery konzipiert, veränderlich. Archiv: unveränderlich, gerichtsfest, mit Zugriffsprotokoll","GoBD ist für IT-Systeme nicht relevant","Backup und Archivierung sind unter GoBD identisch"], correct:1, explanation:"GoBD: E-Mails, Rechnungen, Buchungsbelege müssen 10 Jahre unveränderlich aufbewahrt werden. Ein normales Backup erfüllt das NICHT (überschreibbar, nicht revisionssicher). Lösung: Archivsystem (ELO, d.velop, M-Files) oder WORM-Storage. Wichtig im Kundengespräch: oft verwechseln Kunden Backup mit Archivierung." },
  { id:"b28", question:"Was ist Veeam ONE und welchen Nutzen hat es?", options:["Eine neue Version von Veeam Backup","Monitoring und Analytics-Lösung für Veeam-Umgebungen: überwacht Backup-Jobs, Infrastruktur-Performance, erstellt Reports, alarmiert proaktiv bei Problemen","Ein Backup-Tool für einzelne Workstations","Ein Cloud-Monitoring-Dienst"], correct:1, explanation:"Veeam ONE überwacht die Veeam-Umgebung: Backup-Job-Status, Repository-Kapazität, VM-Performance, Alarmierung. Business View: Kategorisierung von VMs nach Geschäftsbereichen. Reports für Management und Compliance. Kostenpflichtig aber Pflicht für professionelle Veeam-Umgebungen mit vielen Jobs und Standorten." },
  { id:"b29", question:"Was ist eine Recovery-Übung (Restore-Test) und wie oft sollte sie durchgeführt werden?", options:["Nur nötig nach System-Änderungen","Regelmäßige echte Wiederherstellung aus Backup um Integrität und Prozess zu testen. Empfehlung: kritische Systeme monatlich, alle Systeme quartalsweise – dokumentiert und mit gemessener RTO","Restore-Tests sind zu aufwendig und unnötig","Nur notwendig wenn ein Ausfall stattgefunden hat"], correct:1, explanation:"Ohne Test ist ein Backup wertlos. Häufige Probleme bei echten Tests: Backup schlägt fehl wegen Konfigurationsfehler, Restore dauert 10x länger als geplant (RTO verletzt), Anwendungen starten nicht korrekt aus Backup. Automatisierte Tests (Veeam SureBackup) sind Minimum – echte manuelle Restore-Tests zusätzlich nötig." },
  { id:"b30", question:"Was ist Cross-Platform Restore und wann ist es notwendig?", options:["Backup von mehreren Systemen gleichzeitig","Wiederherstellung auf anderer Hardware oder anderem Hypervisor als Quellsystem – z.B. physischer Server zu VMware VM, Hyper-V zu ESXi – nötig bei Hardware-Tausch oder Plattformwechsel","Eine Art von Cloud-Restore","Backup-Wiederherstellung über Netzwerk"], correct:1, explanation:"Cross-Platform Restore: VMware VM zu Hyper-V (oder umgekehrt), physischer Server zu VM (P2V), VM zu anderem Cloud-Anbieter. Veeam unterstützt viele Cross-Platform-Szenarien. Wichtig bei: Hardware-Ausfall wenn gleiche Hardware nicht verfügbar, Cloud-Migration, DR auf anderem Hypervisor. Treiber-Kompatibilität beachten." },
],

security: [
  { id:"sec1", question:"Was ist der Unterschied zwischen Authentifizierung und Autorisierung?", options:["Identische Begriffe","Authentifizierung: Wer bist du? (Identity beweisen). Autorisierung: Was darfst du? (Zugriffsrechte prüfen)","Autorisierung ist der erste Schritt","Authentifizierung ist nur für Passwörter"], correct:1, explanation:"Authentifizierung (AuthN): Identität nachweisen – Benutzername/Passwort, Zertifikat, Biometrie, Token. Autorisierung (AuthZ): nach erfolgreicher Authentifizierung prüfen welche Ressourcen zugänglich sind – RBAC, ACLs. Reihenfolge: erst authentifizieren, dann autorisieren." },
  { id:"sec2", question:"Was ist Multi-Faktor-Authentifizierung (MFA) und warum ist sie unverzichtbar?", options:["Eine Sicherheitsschicht die ausschließlich Passwörter betrifft","Kombination mehrerer unabhängiger Faktoren: Wissen (Passwort), Besitz (Smartphone/Token), Inhärenz (Biometrie). Kompromittiertes Passwort alleine reicht nicht mehr","MFA ist zu komplex für den Unternehmenseinsatz","MFA ist nur für Cloud-Dienste relevant"], correct:1, explanation:"80-90% der Account-Kompromittierungen scheitern an MFA. Angreifer haben das Passwort (Data Breach, Phishing) aber nicht das Telefon. Implementierung: Microsoft Authenticator, Google Authenticator, Hardware-Token (YubiKey). Mindestanforderung: MFA für alle Admin-Accounts und Remote-Zugriff." },
  { id:"sec3", question:"Was ist Ransomware und welche Schutzmechanismen sind entscheidend?", options:["Ein Virus der Daten löscht","Schadsoftware die Daten verschlüsselt und Lösegeld verlangt. Schutz: immutable Backups, MFA, Endpoint Detection & Response, Netzwerksegmentierung, Patch Management, Benutzerschulungen","Ransomware kann nur über E-Mail verbreitet werden","Antivirensoftware schützt vollständig vor Ransomware"], correct:1, explanation:"Ransomware-Angriff typischer Ablauf: Phishing E-Mail → Credential-Diebstahl → Ausbreitung im Netz → Backups verschlüsseln → Produktionsdaten verschlüsseln. Schutz-Ebenen: E-Mail-Filterung, EDR, MFA (verhindert laterale Bewegung), Netzwerksegmentierung (begrenzt Ausbreitung), immutable Backups (Recovery ohne Lösegeld)." },
  { id:"sec4", question:"Was ist Least Privilege Principle (Prinzip der minimalen Rechte)?", options:["Alle Benutzer haben Administratorrechte","Jeder Benutzer und Prozess erhält nur die minimal notwendigen Rechte für seine Aufgaben – reduziert Angriffsfläche dramatisch","Administratoren haben keine Einschränkungen","Least Privilege betrifft nur externe Benutzer"], correct:1, explanation:"Least Privilege: normaler Mitarbeiter braucht keine Admin-Rechte auf dem PC. Admin braucht kein Domain Admin für tägliche Arbeit. Dienst-Accounts nur Rechte für spezifische Aufgabe. Kompromittiertes Low-Privilege-Konto: begrenzter Schaden. Admin-Konto: potenziell komplettes AD kompromittiert." },
  { id:"sec5", question:"Was ist ein SOC (Security Operations Center) und welche Aufgaben hat es?", options:["Ein speziell gesicherter Serverraum","Dediziertes Team das kontinuierlich Sicherheitsvorfälle überwacht, erkennt und darauf reagiert – 24/7 Monitoring, Incident Response, Threat Hunting","Ein Zertifizierungsstandard für IT-Security","Eine Art Firewall-System"], correct:1, explanation:"SOC: zentrales Sicherheitsteam mit SIEM-Tool (Security Information and Event Management). Sammelt Log-Daten aller Systeme, korreliert Events, erkennt Anomalien. Tier 1: Alert-Triage, Tier 2: Incident Analysis, Tier 3: Forensik/Threat Hunting. Im Mittelstand oft als SOC-as-a-Service (MSSP) ausgelagert." },
  { id:"sec6", question:"Was ist Patch Management und warum ist es unternehmenskritisch?", options:["Nur für Betriebssystem-Updates relevant","Strukturierter Prozess für zeitnahes Einspielen von Sicherheitsupdates auf alle Systeme (OS, Anwendungen, Firmware) – vernachlässigtes Patch Management ist häufigste Einfallstür","Patches können Systeme destabilisieren und sollten vermieden werden","Monatliche Patches reichen vollständig aus"], correct:1, explanation:"80%+ der erfolgreichen Angriffe nutzen bekannte Schwachstellen mit verfügbarem Patch. WannaCry 2017: Microsoft-Patch existierte 2 Monate bevor Angriff begann. Unternehmen die nicht gepatcht hatten: kompromittiert. Prozess: Patches testen → zeitnah deployen → kritische Security-Patches priorisiert < 48h." },
  { id:"sec7", question:"Was ist ein Penetration Test (Pentest)?", options:["Ein Stresstest für Netzwerkgeräte","Autorisierter simulierter Angriff auf IT-Systeme durch Sicherheitsexperten – findet ausnutzbare Schwachstellen bevor echte Angreifer sie finden","Ein automatischer Vulnerability-Scan","Ein Compliance-Audit"], correct:1, explanation:"Pentest: ethische Hacker versuchen mit echten Angriffstechniken in Systeme einzudringen. Ergebnis: Bericht mit gefundenen Schwachstellen, Risikobewertung und Maßnahmenempfehlungen. Unterschied zu Vulnerability-Scan: Pentest prüft tatsächliche Ausnutzbarkeit, nicht nur ob Schwachstelle existiert. Empfohlen: jährlich." },
  { id:"sec8", question:"Was ist Zero Trust Security und wie unterscheidet es sich vom klassischen Perimeter-Modell?", options:["Eine verstärkte Firewall-Architektur","Perimeter: alles im Netz ist vertrauenswürdig (castle-and-moat). Zero Trust: kein implizites Vertrauen, jede Anfrage wird unabhängig von Netzwerkstandort authentifiziert und autorisiert","Zero Trust ist nur für Cloud-Umgebungen relevant","Zero Trust ist ein Produkt, kein Konzept"], correct:1, explanation:"Klassisch: Firewall = Burggraben, innen alles vertrauenswürdig. Problem: einmal drin (Phishing, VPN) = freie Fahrt. Zero Trust: 'never trust, always verify' – jede Anfrage braucht Authentifizierung, Autorisierung, Kontext-Check (Gerätezustand, Standort, Zeit). Basis: Identity (MFA), Device Compliance, ZTNA." },
  { id:"sec9", question:"Was ist SIEM (Security Information and Event Management)?", options:["Ein Antiviren-System","Sammelt und korreliert Log-Daten aus allen IT-Systemen in Echtzeit – erkennt Angriffsmuster die einzelne Systeme nicht sehen würden, Basis für SOC und Incident Response","Ein Firewall-Management-System","Ein Backup-Monitoring-Tool"], correct:1, explanation:"SIEM (z.B. Splunk, Microsoft Sentinel, QRadar): aggregiert Logs von Firewalls, Server, AD, Endpoints. Korrelationsregeln erkennen Angriffsmuster: z.B. 100 fehlgeschlagene Logins + erfolgreicher Login + RDP-Verbindung zu Server = verdächtig. Im Mittelstand: Microsoft Sentinel (Azure) kosteneffektiv mit vorhandenen M365-Lizenzen." },
  { id:"sec10", question:"Was ist EDR (Endpoint Detection and Response) und warum ersetzt es klassisches Antivirus?", options:["Eine neue Generation von Antiviren-Software ohne wesentliche Unterschiede","Überwacht Endpoint-Verhalten in Echtzeit: erkennt verdächtige Prozesse, Datei-Verschlüsselung (Ransomware), ungewöhnliche Netzwerkverbindungen – kann automatisch isolieren und Angriffskette rekonstruieren","Ein Netzwerk-Security-System","Ein System zur Verwaltung von Endpoint-Updates"], correct:1, explanation:"Klassisches AV: signaturbasiert – kennt nur bekannte Malware. EDR (CrowdStrike, SentinelOne, Microsoft Defender for Endpoint): analysiert Verhalten. Unbekannte Malware die sich wie Ransomware verhält (viele Dateien in kurzer Zeit verschlüsseln) wird erkannt und gestoppt. EDR kann Angriffskette (Attack Chain) rekonstruieren für Forensik." },
  { id:"sec11", question:"Was ist ein Vulnerability Scan und welche Tools werden eingesetzt?", options:["Ein manueller Sicherheitscheck","Automatisiertes Scanning aller Systeme auf bekannte Sicherheitslücken (CVEs) – Tools: Nessus, Qualys, Microsoft Defender Vulnerability Management, OpenVAS","Ein Penetrationstest","Ein Patch-Management-System"], correct:1, explanation:"Vulnerability Scanner vergleicht System-Konfigurationen mit bekannten CVE-Datenbanken. Ergebnis: Schwachstellen mit CVSS-Score (Critical/High/Medium/Low). Basis für Patch-Priorisierung. Regelmäßig (wöchentlich/monatlich) durchführen. Unterschied zu Pentest: Scanner findet Schwachstellen, Pentest prüft Ausnutzbarkeit." },
  { id:"sec12", question:"Was ist Active Directory Security und welche typischen Angriffspunkte gibt es?", options:["AD-Sicherheit betrifft nur Passwortrichtlinien","AD ist häufigstes Angriffsziel: Kerberoasting (Service-Account-Hashes), Pass-the-Hash, DCSync, Golden/Silver Tickets, NTLM-Relay. Schutz: tiered Admin-Modell, Protected Users, Privileged Identity Management","AD-Sicherheit ist nur für Großunternehmen relevant","Starke Passwörter reichen für AD-Sicherheit aus"], correct:1, explanation:"Angreifer die im Netz sind zielen auf AD: Domain Admin = Game Over. Wichtige Maßnahmen: Tiered Admin Model (Admin-Accounts nur für ihre Tier verwenden), Credential Guard, Protected Users Group, regelmäßige AD-Security-Assessments (BloodHound zeigt Angriffspfade), Monitoring auf DC-Zugriffe." },
  { id:"sec13", question:"Was ist E-Mail-Security und welche Layer sind wichtig?", options:["E-Mail-Sicherheit betrifft nur Spam-Filter","Mehrschichtige E-Mail-Sicherheit: Spam/Malware-Filter (Gateway), Anti-Phishing (Impersonation-Schutz), URL-Rewriting (sichere Links), Attachment-Sandboxing, DKIM/SPF/DMARC (gegen Spoofing)","E-Mail-Verschlüsselung ist der einzige wichtige Faktor","Modernere E-Mail-Systeme sind automatisch sicher"], correct:1, explanation:"E-Mail ist Haupteinfallstor für Angriffe. Layers: Gateway-Filter (Proofpoint, Mimecast, Exchange Online Protection), Advanced Threat Protection (ATP für Sandboxing von Anhängen und Links), Anti-Spoofing (SPF: welche Server dürfen senden, DKIM: kryptografische Signatur, DMARC: Policy bei Verstoß). Auch: Benutzer-Training gegen Phishing." },
  { id:"sec14", question:"Was ist Datenverschlüsselung at-rest vs. in-transit?", options:["Identische Konzepte","At-rest: Daten auf Disk verschlüsselt (BitLocker, FileVault, TDE für Datenbanken). In-transit: Daten während Übertragung verschlüsselt (TLS, IPSec, SSH) – beide Ebenen nötig für vollständigen Schutz","Verschlüsselung ist nur für Cloud-Daten nötig","TLS alleine reicht für vollständigen Datenschutz aus"], correct:1, explanation:"At-rest: gestohlene Festplatte oder Server wertlos ohne Entschlüsselungsschlüssel. In-transit: abgehörte Netzwerkverbindung ist nur verschlüsselter Datenstrom. Beide Ebenen zusammen: umfassender Schutz. Compliance (DSGVO, ISO 27001) verlangt oft beide. Datenbank-Verschlüsselung (TDE): schützt vor DBA-Missbrauch oder direktem Disk-Zugriff." },
  { id:"sec15", question:"Was ist Identity und Access Management (IAM)?", options:["Ein Synonym für Active Directory","Framework zur Verwaltung digitaler Identitäten und Zugriffsrechte: Authentifizierung, Autorisierung, SSO, Lifecycle-Management (Onboarding/Offboarding), Auditierung","Ein Produkt von Microsoft","Nur für Cloud-Umgebungen relevant"], correct:1, explanation:"IAM umfasst: Identity Provider (AD, Azure AD), SSO (Nutzer einmal anmelden, auf alle Apps zugreifen), Berechtigungs-Lifecycle (Neue Mitarbeiter: Accounts erstellen, Abteilungswechsel: Rechte anpassen, Ausscheiden: Accounts sofort deaktivieren), Access Reviews (regelmäßig prüfen wer was darf), Audit-Logs (wer hat wann worauf zugegriffen)." },
  { id:"sec16", question:"Was ist Network Segmentierung als Security-Maßnahme?", options:["Ein Netzwerk in viele kleine Teile aufteilen für bessere Performance","Trennung des Netzwerks in Zonen mit kontrolliertem Zugriff – schränkt laterale Bewegung nach Kompromittierung ein: ein infiziertes Gerät kommt nicht ans gesamte Netz","Nur relevant für sehr große Unternehmen","Identisch mit VLAN-Konfiguration"], correct:1, explanation:"Netzwerksegmentierung: Büro-VLAN, Server-VLAN, Produktions-VLAN, Gast-VLAN – Firewallregeln zwischen Segmenten. Angreifer kompromittiert einen Büro-PC: kann nicht direkt auf Produktionsserver zugreifen. Mikrosegmentierung (VMware NSX, Nutanix Flow): Regeln auf VM-Ebene, noch granularer. Defense in Depth." },
  { id:"sec17", question:"Was ist ein Security Audit und welche Typen gibt es?", options:["Ein automatischer Sicherheitscheck","Systematische Überprüfung der IT-Sicherheitsmaßnahmen. Typen: internes Audit (eigenes Team), externes Audit (unabhängige Firma), Compliance-Audit (ISO 27001, SOC2), technisches Audit (Vulnerability Scan + Pentest)","Nur für regulierte Branchen relevant","Identisch mit Penetrationstest"], correct:1, explanation:"Security Audit prüft: Sind Policies vorhanden und werden sie eingehalten? Sind technische Maßnahmen korrekt konfiguriert? Entspricht die Implementierung Best Practices? Ergebnis: Lücken und Empfehlungen. ISO 27001-Zertifizierung: regelmäßige externe Audits Pflicht. Für Mittelstand: jährliches externes Audit empfohlen." },
  { id:"sec18", question:"Was ist Privileged Access Management (PAM)?", options:["Ein Berechtigungssystem für normale Benutzer","Lösung zur Kontrolle und Überwachung privilegierter Accounts (Admins, Service-Accounts): sichere Passwort-Tresor, Session-Recording, Just-in-Time-Zugriff, Approval-Workflows","Ein System für Passwort-Management aller Nutzer","Nur für externe Admin-Zugänge relevant"], correct:1, explanation:"PAM (CyberArk, BeyondTrust, Delinea): Admin-Passwörter im verschlüsselten Tresor, automatisch rotiert. Admins checken Passwort aus und es wird nach Session gesperrt. Session-Recording: was hat der Admin gemacht? Just-in-Time: Admin-Rechte nur für Dauer der Aufgabe. Schützt vor kompromittierten Admin-Credentials." },
  { id:"sec19", question:"Was ist Social Engineering und wie schützt man sich davor?", options:["Ein Marketing-Begriff ohne Security-Relevanz","Manipulation von Menschen statt Systemen: Phishing (E-Mail), Vishing (Telefon), Pretexting (falsche Identität) – Schutz: Benutzerschulung, Security Awareness Training, klare Prozesse für sensitive Aktionen","Ausschließlich über das Internet durchführbar","Technische Schutzmaßnahmen sind ausreichend"], correct:1, explanation:"Technische Sicherheit ist oft stärker als der Mensch. Social Engineering umgeht Technik: 'Ich bin von der IT, geben Sie mir Ihr Passwort'. Schutz: regelmäßiges Security Awareness Training, simulierte Phishing-Kampagnen, klare Prozesse ('IT fragt niemals nach Passwort'), Meldepflicht für verdächtige Kontakte." },
  { id:"sec20", question:"Was ist DSGVO-Compliance für IT-Systeme und was sind typische technische Maßnahmen?", options:["DSGVO betrifft nur Datenschutzbeauftragte, nicht die IT","DSGVO verlangt technische und organisatorische Maßnahmen (TOMs): Verschlüsselung, Pseudonymisierung, Zugriffskontrollen, Löschkonzepte, Backup, Audit-Logs, Datenpannen-Meldeprozess","DSGVO ist nur für E-Commerce relevant","Technische Maßnahmen sind für DSGVO nicht erforderlich"], correct:1, explanation:"DSGVO Art. 32 verlangt 'angemessene TOMs': Verschlüsselung (at-rest + in-transit), Zugriffskontrolle (nur berechtigte Personen), Pseudonymisierung wo möglich, Datensparsamkeit (nur nötige Daten), Löschkonzept (nach Aufbewahrungspflicht), Backup, Notfallplan. Datenpanne (z.B. Ransomware): 72h Meldepflicht an Behörde." },
  { id:"sec21", question:"Was ist eine Firewall-Policy und welche Best Practices gelten?", options:["Eine Liste aller erlaubten Netzwerkverbindungen","Regelwerk das eingehenden und ausgehenden Netzwerkverkehr kontrolliert. Best Practice: Default-Deny (alles blockiert was nicht explizit erlaubt), Least Privilege (nur nötige Ports/Protokolle), Dokumentation, regelmäßige Review","Default-Allow ist sicherer als Default-Deny","Firewall-Regeln müssen nie überprüft werden"], correct:1, explanation:"Default-Deny: alles was nicht explizit erlaubt ist, wird blockiert. Viele Firewalls starten mit 'allow any any' – fatal. Best Practice: nur dokumentierte Geschäftsanforderungen erlauben, Regelwerk regelmäßig bereinigen (tote Regeln entfernen), Rule-Review jährlich. Ungepflegte Firewall-Regeln akkumulieren über Jahre Sicherheitslücken." },
  { id:"sec22", question:"Was ist Threat Intelligence und wie wird sie eingesetzt?", options:["Geheimdienstliche Informationen über Cyberkriminelle","Informationen über aktuelle Angriffstechniken, Angreifer-Gruppen, kompromittierte Indikatoren (IOCs) – wird in Security-Tools eingespeist um bekannte Angriffsmuster proaktiv zu erkennen","Ein Monitoring-System","Ein Antiviren-Update-Mechanismus"], correct:1, explanation:"Threat Intelligence: IP-Adressen bekannter C2-Server, Malware-Hashes, Phishing-Domains. SIEM und Firewall prüfen gegen Threat Intel Feeds (kommerziell oder kostenlos: MISP, AlienVault OTX). Wenn Gerät versucht C2-Server zu kontaktieren: sofort Alarm. Proaktiver Schutz statt reaktive Reaktion." },
  { id:"sec23", question:"Was ist ein Incident Response Plan?", options:["Ein Plan für geplante IT-Wartungen","Dokumentierter Prozess für den Fall eines Sicherheitsvorfalls: Erkennung, Eindämmung, Untersuchung, Beseitigung, Recovery, Post-Incident-Review – ohne Plan: chaotische und teure Reaktion","Ein Backup-Wiederherstellungsplan","Ein Business Continuity Plan"], correct:1, explanation:"IR-Plan definiert: Wer wird wann informiert (Eskalationskette)? Wer ist Incident Commander? Wie isolieren wir betroffene Systeme? Welche forensischen Daten sichern wir? Wann schalten wir Behörden/Versicherung ein? Ohne Plan: falsche Entscheidungen unter Druck, Beweise zerstört, unnötige Ausweitung des Schadens." },
  { id:"sec24", question:"Was ist Cyber-Versicherung und was deckt sie typischerweise ab?", options:["Eine Versicherung ausschließlich für physische IT-Schäden","Absicherung gegen finanzielle Folgen von Cyberangriffen: Ransomware-Lösegeldzahlungen, Betriebsunterbrechung, Forensik-Kosten, Wiederherstellungskosten, Drittpartei-Schäden – aber nur bei nachgewiesenen Sicherheitsmaßnahmen","Eine Pflichtversicherung für alle Unternehmen","Deckt ausschließlich Ransomware-Angriffe ab"], correct:1, explanation:"Cyber-Versicherung wird wichtiger – Ransomware-Schäden in Millionenhöhe. Wichtig: Versicherer prüfen vor Abschluss und bei Schaden ob Mindest-Sicherheitsmaßnahmen vorhanden waren (MFA, Backups, Patch Management). Keine MFA = Versicherung zahlt nicht oder teurer. Versicherung ersetzt keine Sicherheitsmaßnahmen – ergänzt sie." },
  { id:"sec25", question:"Was ist Secure Email Gateway (SEG)?", options:["Ein E-Mail-Server mit Sicherheitsfunktionen","Dedizierte Lösung die eingehende und ausgehende E-Mails filtert: Spam, Malware, Phishing-URLs, Attachment-Sandboxing, DLP (keine sensiblen Daten nach außen) – vor dem E-Mail-Server","Ein E-Mail-Verschlüsselungsdienst","Ein Spam-Filter-Plugin"], correct:1, explanation:"SEG (Proofpoint, Mimecast, Barracuda) sitzt als MX-Record vor dem Mail-Server. Filtert Spam, scannt Anhänge in Sandbox (unbekannte Datei wird in isolierter Umgebung ausgeführt), prüft URLs (wird bei Klick auf aktuellen Zustand geprüft). Auch ausgehend: verhindert Datenleck und schützt Sender-Reputation." },
  { id:"sec26", question:"Was ist ISO 27001 und welche Bedeutung hat die Zertifizierung?", options:["Ein technischer Standard für Firewalls","Internationaler Standard für Informationssicherheits-Managementsysteme (ISMS): definiert Anforderungen an Sicherheitsprozesse und -kontrollen. Zertifizierung: unabhängige Prüfung das Unternehmen strukturiert mit Informationssicherheit umgeht","Ein Produkt-Sicherheitszertifikat","Nur für IT-Dienstleister relevant"], correct:1, explanation:"ISO 27001 definiert ISMS-Anforderungen: Risikoanalyse, Sicherheitsrichtlinien, Zugriffskontrolle, Kryptographie, Lieferanten-Sicherheit, Incident Management, Business Continuity. Zertifizierung durch akkreditierten Auditor. Markt-Relevanz: viele Ausschreibungen und Enterprise-Kunden verlangen ISO 27001 vom IT-Dienstleister." },
  { id:"sec27", question:"Was ist ein DDoS-Angriff und wie schützt man sich?", options:["Ein Angriff durch schädliche Software auf einem Computer","Distributed Denial of Service: massives Fluten mit Anfragen durch viele kompromittierte Systeme (Botnet) – überlastet Server oder Leitung, legitime Nutzer kommen nicht mehr rein","Ein Angriff ausschließlich auf Web-Server","Schutz durch starke Passwörter ausreichend"], correct:1, explanation:"DDoS: 100.000 kompromittierte Geräte senden gleichzeitig Anfragen – Server bricht unter Last zusammen. Schutz: DDoS-Mitigation-Dienste (Cloudflare, Akamai, AWS Shield) – filtern schädlichen Traffic bevor er das Rechenzentrum erreicht. Für kritische Systeme: CDN und verteilte Infrastruktur als Schutz. On-premise-Schutz alleine nicht ausreichend." },
  { id:"sec28", question:"Was ist ein Security Baseline und warum ist sie wichtig?", options:["Eine Sicherheitsrichtlinie für normale Benutzer","Definierter Mindest-Sicherheitszustand für alle Systeme: Passwortrichtlinien, Deaktivierung unnötiger Dienste, Patch-Level, Firewall-Einstellungen – Abweichungen werden erkannt und korrigiert","Eine einmalige Sicherheitsüberprüfung","Ein technischer Standard für neue Geräte"], correct:1, explanation:"Security Baseline (CIS Benchmarks, Microsoft Security Baselines): definiert für jeden System-Typ (Windows Server, Linux, Cisco Switch) was wie konfiguriert sein muss. GPO in Windows: Baseline automatisch auf alle Systeme anwenden. Continuous Compliance Monitoring: prüft laufend ob Systeme der Baseline entsprechen." },
  { id:"sec29", question:"Was ist Datenleck-Prävention (DLP) und welche Kanäle werden abgedeckt?", options:["Ein System gegen externe Angriffe","Erkennt und verhindert unerlaubten Abfluss sensibler Daten. Kanäle: E-Mail (kein Versand von Kreditkartennummern), Web-Upload (kein Upload auf persönliche Cloud), USB (nur erlaubte Geräte), Drucker","DLP ist ausschließlich für Finanzunternehmen relevant","DLP schützt nur gespeicherte Daten"], correct:1, explanation:"DLP (Microsoft Purview, Symantec DLP): klassifiziert sensible Daten (PII, Geschäftsgeheimnisse, Kreditkartennummern) und überwacht alle Abflusspfade. Automatische Aktionen: blockieren, verschlüsseln, Alarm. Herausforderung: Balance zwischen Sicherheit und Produktivität. Wichtig für DSGVO-Compliance und Schutz vor internem Datenmissbrauch." },
  { id:"sec30", question:"Was ist ein Bug Bounty Programm?", options:["Ein internes Sicherheits-Anreizprogramm","Öffentliche Einladung an Sicherheitsforscher Schwachstellen zu melden gegen Belohnung – nutzt externe Expertise um Sicherheitslücken proaktiv zu finden bevor Angreifer sie ausnutzen","Ein automatisches Vulnerability-Scanner-Programm","Ein Zertifizierungsprogramm für Sicherheitssoftware"], correct:1, explanation:"Bug Bounty: Unternehmen definieren Umfang (welche Systeme, welche Angriffsmethoden erlaubt) und Prämien. Sicherheitsforscher suchen Schwachstellen und melden sie verantwortungsbewusst (Responsible Disclosure). Unternehmen schließen Lücke, zahlen Prämie. Plattformen: HackerOne, Bugcrowd. Ergänzt reguläre Pentests durch kontinuierliche externe Prüfung." },
],

os: [
  { id:"os1", question:"Was ist der Unterschied zwischen Windows Server und Windows Desktop?", options:["Identisch – nur die Lizenz unterscheidet sich","Windows Server: für Serveraufgaben optimiert (AD, DNS, DHCP, IIS, Hyper-V Rollen), keine GUI-Einschränkungen, mehrere simultane RDP-Sessions, CAL-Lizenzmodell. Desktop: GUI-Fokus, weniger Serverrollen, 2 RDP-Sessions max","Windows Server kann keine Desktop-Anwendungen ausführen","Windows Desktop ist leistungsfähiger als Server"], correct:1, explanation:"Windows Server hat Server-Rollen (Active Directory, DNS, DHCP, IIS, Hyper-V, File Services) die auf Desktop-Windows nicht verfügbar sind. Lizenzierung: Server-Lizenz + Client Access Licenses (CALs) pro Nutzer oder Gerät. Aktuelle Version: Windows Server 2022, 2025 in Einführung." },
  { id:"os2", question:"Was ist Active Directory Domain Services (AD DS)?", options:["Ein Dateiserver-Dienst von Microsoft","Verzeichnisdienst der Benutzer, Computer, Gruppen und Richtlinien zentral verwaltet. Ermöglicht Single Sign-On, Gruppenrichtlinien, zentrales Identitäts-Management in Windows-Umgebungen","Ein Netzwerk-Protokoll","Ein Cloud-Dienst von Microsoft"], correct:1, explanation:"AD DS ist das Fundament jeder Windows-Unternehmensumgebung: Benutzer und Computer melden sich am Domain an (Kerberos-Authentifizierung), Gruppenrichtlinien (GPOs) konfigurieren alle Systeme zentral, Berechtigungen auf Ressourcen (Dateiserver, Drucker) werden über AD-Gruppen verwaltet. Domain Controller: Server der AD hostet." },
  { id:"os3", question:"Was ist ein Domain Controller (DC) und warum sind mindestens zwei nötig?", options:["Ein Server für Web-Hosting","Server der Active Directory hostet und Authentifizierungsanfragen beantwortet. Mindestens 2 DCs: bei Ausfall eines DC müssen Anmeldungen weiter möglich sein – Single Point of Failure vermeiden","Ein Server ist ausreichend für kleine Unternehmen","Domain Controller können nicht virtualisiert werden"], correct:1, explanation:"Einzelner DC: fällt er aus, können sich keine Benutzer mehr anmelden, GPOs werden nicht mehr angewendet, DNS (oft auf DC) fällt aus. Mit 2 DCs: AD wird repliziert, Ausfall eines DC: zweiter übernimmt. Best Practice: 2 DCs in VMs, möglichst auf verschiedenen physischen Hosts, Windows Server Core für reduzierten Angriffsfläche." },
  { id:"os4", question:"Was sind Gruppenrichtlinien (GPOs) und welche typischen Anwendungsfälle gibt es?", options:["Einstellungen die nur für Admin-Benutzer gelten","Zentrale Konfigurationsrichtlinien die auf Benutzer und Computer in AD angewendet werden: Passwortrichtlinien, Softwareinstallation, Desktop-Konfiguration, Sicherheitseinstellungen","Gruppenrichtlinien betreffen nur Netzwerkkonfigurationen","GPOs können nur auf einzelne Computer angewendet werden"], correct:1, explanation:"GPOs: zentrale Konfiguration ohne manuellen Eingriff pro PC. Anwendungsfälle: Passwort-Komplexität und -Länge (erzwingen), USB-Ports sperren, Screensaver-Timeout, Software deployen, Startseite im Browser setzen, Sicherheits-Baseline durchsetzen. Verknüpft mit OUs (Organisationseinheiten) im AD." },
  { id:"os5", question:"Was ist der Unterschied zwischen einem Workgroup-Netzwerk und einer Domain?", options:["Nur größere Unternehmen verwenden Domains","Workgroup: jeder PC verwaltet eigene Benutzer, kein zentrales Management, max. 10-20 PCs sinnvoll. Domain: zentrales AD verwaltet alle Benutzer und PCs, einheitliche Richtlinien, skalierbar auf tausende Geräte","Workgroup-Netzwerke sind sicherer","Domains sind nur für Windows-Umgebungen"], correct:1, explanation:"Workgroup: peer-to-peer, Benutzer auf jedem PC einzeln anlegen, keine zentralen Richtlinien, schwer verwaltbar ab 5+ PCs. Domain: AD-Controller, einmalige Anmeldung für alle Ressourcen, zentrale Benutzerverwaltung, GPOs. Ab 10 Clients: Domain ist Pflicht für professionellen Betrieb." },
  { id:"os6", question:"Was ist der Unterschied zwischen Linux-Distributionen in Server-Umgebungen?", options:["Alle Linux-Distributionen sind identisch","RHEL/CentOS: Enterprise-fokus, stabil, langer Support. Ubuntu Server: breite Community, gute Cloud-Integration. Debian: sehr stabil, konservativ. SUSE: Enterprise, gut für SAP. Wahl abhängig von Anwendungsfall und Support-Anforderung","Linux ist für Server nicht geeignet","Nur Ubuntu ist für Serverumgebungen geeignet"], correct:1, explanation:"RHEL (Red Hat Enterprise Linux): kommerzieller Enterprise-Support, zertifiziert für SAP, Oracle – teuer. CentOS Stream: kostenlose RHEL-Variante (nach CentOS 8 End of Life). Ubuntu Server: beliebt für Cloud und Web, LTS-Versionen 5 Jahre Support. Debian: sehr stabil, in vielen Produktionsumgebungen. Rocky Linux/AlmaLinux: RHEL-Klone als CentOS-Nachfolger." },
  { id:"os7", question:"Was ist ein Linux-Paketmanager und welche Typen gibt es?", options:["Ein Tool zur Verwaltung von Hardware-Treibern","Software-Verwaltung auf Linux: apt (Debian/Ubuntu), yum/dnf (RHEL/CentOS), zypper (SUSE). Installiert, aktualisiert und entfernt Software aus Online-Repositories mit Abhängigkeitsverwaltung","Eine grafische Benutzeroberfläche","Ein Backup-Tool für Linux"], correct:1, explanation:"Paketmanager löst Abhängigkeiten automatisch: `apt install nginx` lädt nginx + alle benötigten Bibliotheken. Updates: `apt upgrade` aktualisiert alle installierten Pakete. Sicherheits-Patches: auf RHEL/Ubuntu regelmäßig mit `yum update` oder `apt upgrade` einspielen. In Unternehmen: Patch-Management-Tools (Ansible, Satellite)." },
