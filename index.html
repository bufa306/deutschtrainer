const VT_QUESTIONS = {

einwand: [
  { id:"e1", question:"Ein IT-Leiter sagt: 'Wir haben gerade kein Budget dafür.' Was ist die beste Reaktion?", options:["Sofort einen Rabatt anbieten","Nachfragen ob kein Budget bedeutet kein Budget jetzt oder kein Interesse – dann Zeitperspektive und Priorität klären","Das Gespräch beenden","Darauf hinweisen dass der Mitbewerber auch teuer ist"], correct:1, explanation:"'Kein Budget' ist oft kein endgültiges Nein – es ist eine Aussage über Priorität. Erst verstehen was dahintersteckt: Ist es eine Budgetfrage (Wann wäre Budget vorhanden?) oder ein Interessenproblem (Was würde das Thema priorisieren)?", prinzip:"Einwand ≠ Ablehnung. Erst verstehen, dann reagieren." },
  { id:"e2", question:"Ein Geschäftsführer sagt: 'Das machen wir alles intern.' Was antwortest du?", options:["Sofort konkurrieren und günstiger sein","Interesse zeigen und verstehen was 'intern' bedeutet – herausfinden wo die internen Kapazitäten an Grenzen stoßen","Akzeptieren und das Gespräch beenden","Argumentieren dass interne IT immer schlechter ist"], correct:1, explanation:"'Wir machen das intern' ist eine Aussage über den Status quo, kein Ablehnung. Frage: 'Was genau macht euer Team?' und 'Wo stoßt ihr an Grenzen?' Ziel: herausfinden wo externe Expertise echten Mehrwert schafft.", prinzip:"Status quo verstehen vor Alternativen anbieten." },
  { id:"e3", question:"Ein Einkäufer sagt: 'Euer Mitbewerber ist 20% günstiger.' Wie reagierst du?", options:["Sofort den Preis reduzieren","Fragen was im Mitbewerber-Angebot enthalten ist und den Wertunterschied herausarbeiten – nicht mit Preis kämpfen","Behaupten der Mitbewerber sei schlechter","Das Gespräch als verloren betrachten"], correct:1, explanation:"Preisgespräch nicht mit Preis-Gegenargument führen. Stattdessen: 'Was ist im Angebot enthalten?' und dann aufzeigen was der Unterschied in der Lösung bedeutet – Qualität, Support, TCO über 5 Jahre. Wer nur über Preis spricht, hat keinen Mehrwert kommuniziert.", prinzip:"Nie auf Preis-Ebene kämpfen – immer auf Wert-Ebene antworten." },
  { id:"e4", question:"Ein IT-Leiter sagt: 'Das ist uns zu riskant – lieber beim Bekannten bleiben.' Was machst du?", options:["Das Risiko kleinreden","Das Risiko ernst nehmen und konkret fragen was als riskant empfunden wird – dann gezielt adressieren mit Referenzen und Pilotprojekt-Angebot","Den bekannten Anbieter schlecht machen","Aufgeben"], correct:1, explanation:"Risikoeinwand ist legitim. Nicht dagegen argumentieren sondern verstehen. 'Was genau ist das Risiko aus eurer Sicht?' Dann: konkrete Referenzen ähnlicher Unternehmen, Pilotprojekt als risikoarmen Einstieg.", prinzip:"Risiko nicht kleinreden – konkret machen und adressieren." },
  { id:"e5", question:"Wie unterscheidet man einen Vorwand von einem echten Einwand?", options:["Es gibt keinen Unterschied","Echter Einwand: konkrete Begründung, spezifisch, Kunde ist engagiert. Vorwand: vage, kommt früh ohne echtes Engagement","Vorwände sind immer Preisthemen","Echte Einwände kommen immer am Ende"], correct:1, explanation:"Heinrich-Test: echter Einwand ist konkret ('Budget für Q3 bereits verplant') und der Kunde ist engagiert. Vorwand: vage ('das passt gerade nicht'), kommt zu früh, Kunde wirkt desinteressiert. Bei Vorwand: erst Interesse und Relevanz herstellen.", prinzip:"Vorwand = kein Interesse. Echter Einwand = Interesse + Hindernis." },
  { id:"e6", question:"Was ist die 'Bumerang-Methode' bei der Einwandbehandlung?", options:["Den Einwand ignorieren","Den Einwand in einen Vorteil umformulieren: 'Gerade weil Sie sagen X, ist das ein Grund warum unsere Lösung passt'","Den Kunden mit demselben Einwand konfrontieren","Eine aggressive Verkaufstechnik"], correct:1, explanation:"Bumerang: der Einwand wird als Bestätigung für die Lösung genutzt. Beispiel: 'Gerade weil Ihre IT-Mannschaft klein ist, macht unsere Lösung das Management einfacher – weniger selbst verwalten.' Voraussetzung: Einwand ist tatsächlich addressierbar.", prinzip:"Den Einwand als Brücke zur Lösung nutzen." },
  { id:"e7", question:"Ein Kunde sagt: 'Ich muss erst meinen Chef fragen.' Wie gehst du damit um?", options:["Sofort Material für den Chef schicken","Verstehen wer der Entscheidungsträger ist und ob du helfen kannst den internen Prozess zu unterstützen – Nächsten Schritt vereinbaren","Warten bis der Chef antwortet","Den Kontakt als nicht entscheidungsfähig abhaken"], correct:1, explanation:"'Ich muss fragen' zeigt: du redest nicht mit dem Entscheider. Frage: 'Wie sieht der Entscheidungsprozess bei euch aus?' und 'Würde es helfen wenn ich direkt mit Ihrem Chef spreche?' Ziel: Multi-Level-Selling.", prinzip:"Entscheidungsprozess verstehen, nicht annehmen." },
  { id:"e8", question:"Was bedeutet 'Einwand puffern'?", options:["Den Einwand ignorieren","Den Einwand zunächst validieren bevor man ihn adressiert – 'Das ist ein verständlicher Punkt...' – vermeidet Defensivreaktion","Den Einwand direkt widerlegen","Den Kunden unterbrechen um sofort die Antwort zu geben"], correct:1, explanation:"Puffern: erst Verständnis zeigen bevor du antwortest. 'Das ist eine berechtigte Frage / Das höre ich öfter...' – Kunde fühlt sich nicht angegriffen. Danach sachliche Antwort ohne Rechtfertigung. Verhindert dass Einwandbehandlung als Debatte wirkt.", prinzip:"Erst verstehen zeigen, dann antworten." },
  { id:"e9", question:"Ein IT-Leiter sagt: 'Das haben wir schon mal versucht und es hat nicht funktioniert.' Wie reagierst du?", options:["Sofort behaupten dass es diesmal anders wäre","Interesse zeigen: Was genau hat nicht funktioniert? Was war der Hintergrund? – dann Abgrenzung zur aktuellen Situation aufzeigen","Die vergangene Erfahrung ignorieren","Argumentieren dass der Mitbewerber schuld war"], correct:1, explanation:"Schlechte Erfahrung = hoher Widerstand. Erst vollständig verstehen was damals passiert ist. Dann: zeige konkret warum die aktuelle Situation anders ist. Ohne Verständnis: jedes Argument wirkt wie Verkaufsdruck.", prinzip:"Vergangene Erfahrung ernst nehmen, nicht überschreiben." },
  { id:"e10", question:"Was ist der Unterschied zwischen Einwandbehandlung und Einwandvermeidung?", options:["Identische Konzepte","Einwandvermeidung: häufige Einwände proaktiv im Pitch adressieren bevor der Kunde sie formuliert. Einwandbehandlung: auf formulierten Einwand reagieren","Einwandvermeidung ist manipulativ","Einwandbehandlung kommt immer zu spät"], correct:1, explanation:"Proaktive Vermeidung ('Ich höre oft von IT-Leitern dass...') zeigt Erfahrung und nimmt dem Kunden den Einwand aus der Hand bevor er ihn formuliert. Reaktive Behandlung kommt später und wirkt manchmal wie Gegenargument.", prinzip:"Proaktiv > reaktiv bei bekannten Einwänden." },
  { id:"e11", question:"Wie behandelst du den Einwand 'Kein Interesse' am Anfang eines Kaltgesprächs?", options:["Das Gespräch sofort beenden","Kurz nachfragen ob 'kein Interesse' an diesem Zeitpunkt oder grundsätzlich gilt – dann einen konkreten Nutzen in einem Satz benennen und um 2 Minuten bitten","Rabatt anbieten","Hartnäckig insistieren"], correct:1, explanation:"'Kein Interesse' früh im Gespräch ist fast immer ein Reflex-Einwand. Antwort: 'Das verstehe ich – darf ich kurz sagen worum es geht?' Dann: ein konkreter Nutzen in einem Satz. Ziel: 2 Minuten Zeit gewinnen.", prinzip:"Reflex-Einwand ≠ echter Einwand. 2 Minuten gewinnen." },
  { id:"e12", question:"Ein Kunde sagt: 'Schicken Sie mir erstmal Unterlagen.' Was bedeutet das?", options:["Der Kunde ist sehr interessiert","Oft ein höflicher Rauswurf – Reaktion: 'Was genau interessiert Sie?' und Nächsten Schritt vereinbaren bevor Material verschickt wird","Sofort alle Materialien schicken","Als Erfolg werten und warten"], correct:1, explanation:"'Unterlagen schicken' ist oft Höflichkeits-Ablehnung. Kein Material ohne klaren Nächsten Schritt. 'Gerne – was ist das wichtigste Thema für Sie aktuell?' und dann 'Kann ich Sie nächste Woche kurz anrufen wenn Sie es gelesen haben?'", prinzip:"Kein Material ohne Nächsten Schritt." },
  { id:"e13", question:"Was ist der Unterschied zwischen einem Preis-Einwand und einem Wert-Problem?", options:["Identisch","Preis-Einwand: Kunde versteht den Wert, hält ihn für zu teuer relativ zum Budget. Wert-Problem: Kunde hat den Nutzen noch nicht verstanden – Rabatt hilft hier nicht","Wert-Probleme lösen sich durch Rabatt","Preis-Einwände kommen immer zuerst"], correct:1, explanation:"Wenn Kunde den Wert nicht sieht: Rabatt hilft nicht, weil er immer noch nicht weiß warum er zahlen soll. Erst Wert klar machen, dann über Preis reden. Preis ist nur ein Problem wenn Wert unklar ist.", prinzip:"Wert vor Preis – immer." },
  { id:"e14", question:"Wie verwendest du Referenzen bei der Einwandbehandlung?", options:["Immer zu Beginn des Gesprächs","Gezielt bei spezifischen Einwänden: 'Ein Unternehmen ähnlicher Größe in eurer Branche hatte denselben Bedenken...' – macht Lösung konkret und reduziert wahrgenommenes Risiko","Nur wenn der Kunde fragt","Referenzen sind manipulativ"], correct:1, explanation:"Referenzen bei Einwänden: Soziale Bewährtheit. 'Bei einem Metallbau-Unternehmen in Württemberg mit 200 MA hat genau diese Konstellation zu X geführt.' Macht abstrakte Lösung greifbar. Referenz muss wirklich ähnlich sein.", prinzip:"Spezifische Referenz schlägt jedes Argument." },
  { id:"e15", question:"Was machst du wenn ein Kunde sagt: 'Wir entscheiden das intern – melden Sie sich in 6 Monaten wieder'?", options:["6 Monate warten und dann anrufen","Verstehen was intern entschieden wird, klären ob du den Prozess unterstützen kannst, und einen konkreten Touchpoint vor den 6 Monaten vereinbaren","Akzeptieren und in 6 Monaten melden","Den Kunden als verloren abhaken"], correct:1, explanation:"6 Monate Pause = Kontakt geht kalt. Besser: 'Was genau wird intern entschieden?' und 'Würde es helfen wenn ich in 6 Wochen kurz nachfasse ob sich etwas geändert hat?' Ziel: im Gespräch bleiben ohne zu drängen.", prinzip:"Kontakt nicht einschlafen lassen – Touchpoints pflegen." },
],

bedarfsanalyse: [
  { id:"ba1", question:"Was ist der Unterschied zwischen offenen und geschlossenen Fragen?", options:["Identisch in der Wirkung","Offene Fragen: W-Wörter, fördern ausführliche Antworten, zeigen Interesse. Geschlossene: Ja/Nein, gut zur Bestätigung","Geschlossene Fragen sind professioneller","Offene Fragen sind für den Kunden unangenehm"], correct:1, explanation:"Offene Fragen ('Was ist Ihre größte IT-Herausforderung?') ermöglichen dem Kunden frei zu erzählen. Geschlossene ('Haben Sie eine Backup-Lösung?') gut zur Verifikation. Regel: erst offen explorieren, dann gezielt vertiefen.", prinzip:"Erst öffnen, dann vertiefen." },
  { id:"ba2", question:"Was sind die vier Fragen-Typen der SPIN-Selling Methode?", options:["Situation, Produkt, Investition, Nächstes","Situation (IST-Zustand), Problem (Schwachstellen), Implication (Konsequenzen), Need-Payoff (Nutzen der Lösung)","Start, Preis, Implementierung, Nächstes","System, Prozess, Interesse, Nächstes"], correct:1, explanation:"SPIN: S-Fragen (Wie ist eure aktuelle IT?) → P-Fragen (Was funktioniert nicht optimal?) → I-Fragen (Was passiert wenn das Problem bleibt?) → N-Fragen (Wie wichtig wäre eine Lösung?). Entwickelt Bewusstsein für Bedarf bevor du präsentierst.", prinzip:"Bedarf entwickeln, nicht annehmen." },
  { id:"ba3", question:"Was ist der Unterschied zwischen einem latenten und einem expliziten Bedarf?", options:["Identisch","Latenter Bedarf: Kunde hat Problem aber sieht es nicht als lösbar. Expliziter Bedarf: Kunde spricht aktiv über Wunsch nach Lösung","Latenter Bedarf ist unwichtig","Expliziter Bedarf kommt immer von selbst"], correct:1, explanation:"Latenter Bedarf: 'Unsere Backups laufen nicht immer sauber' – Kunde weiß es, denkt aber nicht aktiv an Lösung. Durch Implication-Fragen (SPIN) wird latenter zu explizitem Bedarf. Erst dann ist der Boden für eine Lösung bereitet.", prinzip:"Latenten Bedarf durch Implication-Fragen aktivieren." },
  { id:"ba4", question:"Was ist die 80/20-Regel in der Bedarfsanalyse?", options:["80% präsentieren, 20% zuhören","Kunde sollte 80% der Zeit reden, Verkäufer 20% – du lernst mehr durch Zuhören als durch Reden","50/50 ist das Optimum","Nur in langen Gesprächen relevant"], correct:1, explanation:"Wenn du 80% der Zeit redest: du präsentierst Lösung ohne zu wissen ob sie passt. Wenn Kunde 80% redet: du verstehst seine Situation, Sprache, Prioritäten. Dann ist deine 20% Redezeit zielgerichtet und relevant.", prinzip:"Wer fragt, führt. Wer redet, verliert." },
  { id:"ba5", question:"Was ist der Unterschied zwischen Symptom und Ursache in der Bedarfsanalyse?", options:["Identisch im Vertriebskontext","Symptom: was der Kunde beschreibt ('Server oft langsam'). Ursache: das echte Problem dahinter (veraltete Hardware, falsches Sizing). Lösungen auf Symptome sind kurzfristig","Ursachen interessieren den Kunden nicht","Symptome sind wichtiger"], correct:1, explanation:"Kunde beschreibt oft Symptome, nicht Ursachen. Erst die echte Ursache verstehen bevor du eine Lösung vorschlägst. Ursache-Fragen: 'Seit wann passiert das?', 'Was haben Sie schon versucht?' Lösung auf falsche Ursache: schlechter Projektstart.", prinzip:"Symptom behandeln ≠ Problem lösen." },
  { id:"ba6", question:"Was ist eine Hypothesen-Frage und wann verwendest du sie?", options:["Eine Fangfrage","Beschreibt eine mögliche Problemsituation: 'Ich könnte mir vorstellen dass bei Unternehmen Ihrer Größe oft X ein Thema ist – ist das bei euch auch so?' – öffnet neue Themen","Eine Abschlussfrage","Eine Preisfrage"], correct:1, explanation:"Hypothesen-Fragen sind nützlich wenn der Kunde wenig erzählt oder wenn du ein Thema einführen willst das er noch nicht angesprochen hat. Zeigt Branchenwissen und ermöglicht dem Kunden zu bestätigen oder korrigieren.", prinzip:"Hypothese anbieten, Kunde bestätigt oder korrigiert." },
  { id:"ba7", question:"Was ist das 'Schmerzmodell' in der Bedarfsanalyse?", options:["Eine aggressive Verkaufstechnik","Menschen kaufen um Schmerz zu vermeiden oder Freude zu gewinnen – Bedarfsanalyse macht den aktuellen Schmerz und seine Größe sichtbar","Eine psychologische Manipulation","Nur für emotionale Kaufentscheidungen"], correct:1, explanation:"Schmerz-Fragen: 'Was kostet es Sie wenn das Problem bestehen bleibt?' Je konkreter und größer der Schmerz: desto höher die Kaufbereitschaft. Ziel: Schmerz sichtbar machen, nicht erfinden.", prinzip:"Schmerz sichtbar machen = Handlungsmotivation erzeugen." },
  { id:"ba8", question:"Wie priorisierst du mehrere genannte Probleme in der Bedarfsanalyse?", options:["Alle Probleme gleichwertig behandeln","Den Kunden selbst priorisieren lassen: 'Sie haben X, Y und Z genannt – was ist das dringlichste Thema?' – dann auf das Wichtigste fokussieren","Das größte technische Problem adressieren","Das Problem adressieren das du am besten lösen kannst"], correct:1, explanation:"Priorisierung durch den Kunden zeigt was wirklich brennt. Wenn du das wichtigste Problem löst: Gespräch hat Relevanz. Wenn du auf ein zweitrangiges Thema fokussierst: Kunde fühlt sich nicht verstanden.", prinzip:"Lass den Kunden die Agenda setzen." },
  { id:"ba9", question:"Was ist aktives Zuhören im Vertriebskontext?", options:["Den Kunden reden lassen ohne Reaktion","Vollständig zuhören, Schlüsselbegriffe aufgreifen, paraphrasieren, Nachfragen stellen – zeigt echtes Interesse und fördert tieferes Öffnen des Kunden","Notizen machen während der Kunde spricht","Dem Kunden zustimmen um das Gespräch voranzutreiben"], correct:1, explanation:"Aktives Zuhören: Paraphrase ('Verstehe ich richtig dass...'), Nachfrage auf Details ('Sie sagten X – was meinen Sie damit genau?'). Wer zuhört, verkauft mehr. Die meisten Verkäufer unterbrechen zu früh mit der Lösung.", prinzip:"Unterbreche nie mit der Lösung bevor der Schmerz klar ist." },
  { id:"ba10", question:"Was ist der 'Fragetrichter' in der Bedarfsanalyse?", options:["Viele Fragen auf einmal stellen","Von allgemeinen zu spezifischen Fragen: erst breite Situation erfassen, dann in relevante Bereiche vertiefen, dann konkrete Probleme und Konsequenzen herausarbeiten","Immer mit Preisfragen beginnen","Ein Fragenkatalog der abgearbeitet wird"], correct:1, explanation:"Trichter-Prinzip: Einstieg breit ('Wie ist eure IT aufgestellt?') → Mitte spezifisch ('Was sind die größten Engpässe?') → Ende konkret ('Was kostet euch das pro Monat?'). Verhindert zu frühe Engführung auf ein Thema.", prinzip:"Breit starten, gezielt vertiefen." },
  { id:"ba11", question:"Wie erkennst du ob ein Gespräch wirklich in der Bedarfsanalyse ist oder schon in der Präsentation?", options:["An der Gesprächsdauer","Bedarfsanalyse: du stellst mehr Fragen als Antworten gibst, Kunde redet mehr. Präsentation: du zeigst Lösungen. Problem: viele Verkäufer springen zu früh in die Präsentation","Es gibt keinen Unterschied","Wenn du über Produkte redest bist du in der Analyse"], correct:1, explanation:"Häufiger Fehler: nach 2-3 Fragen schon präsentieren. Erst wenn du die Situation vollständig verstehst, Prioritäten kennst und der Kunde selbst die Dringlichkeit ausgedrückt hat – dann erst Lösung zeigen.", prinzip:"Präsentiere erst wenn der Kunde selbst Dringlichkeit ausdrückt." },
  { id:"ba12", question:"Was ist die Gefahr von 'Ja-Fragen' in der Bedarfsanalyse?", options:["Es gibt keine Gefahr","Führen zu Antworten die du hören willst statt zur echten Situation: 'Wäre es nicht besser wenn Ihre Backups zuverlässiger wären?' – natürlich sagt der Kunde Ja, aber du hast nichts gelernt","Ja-Fragen fördern Vertrauen","Ja-Fragen sind immer besser als offene Fragen"], correct:1, explanation:"Ja-Fragen (suggestive Fragen) bestätigen deine Hypothesen ohne echtes Lernen. Kunde sagt Ja um höflich zu sein. Echte Bedarfsanalyse ist neugierig – du willst wirklich verstehen, nicht bestätigt werden.", prinzip:"Neugier statt Bestätigung suchen." },
  { id:"ba13", question:"Wann solltest du die Bedarfsanalyse abschließen?", options:["Nach genau 5 Fragen","Wenn du Situation, Hauptprobleme, Prioritäten, Konsequenzen des Nicht-Handelns und grundsätzliche Offenheit für eine Lösung verstehst","Nach 30 Minuten","Wenn der Kunde ungeduldig wird"], correct:1, explanation:"Vollständige Bedarfsanalyse: Situation verstanden? Echte Probleme bekannt? Prioritäten klar? Hat der Kunde selbst die Dringlichkeit ausgedrückt? Wenn ja: dann erst zur Lösung übergehen.", prinzip:"Analyse beenden wenn Dringlichkeit vom Kunden kommt." },
  { id:"ba14", question:"Was ist der Unterschied zwischen Bedarf und Budget?", options:["Identisch","Bedarf: hat der Kunde ein Problem das er lösen muss? Budget: hat er die Mittel? Bedarf ohne Budget: Timing-Problem. Budget ohne Bedarf: keine nachhaltige Transaktion","Budget ist wichtiger als Bedarf","Bedarf schafft immer automatisch Budget"], correct:1, explanation:"Bedarf und Budget separat qualifizieren. Bedarf vorhanden aber kein Budget: 'Wenn Budget vorhanden wäre, würde das Thema Priorität haben?' Wenn ja: Timing-Gespräch führen.", prinzip:"Bedarf + Budget + Timing = qualifizierter Lead." },
  { id:"ba15", question:"Wie gehst du mit einem Kunden um der sehr wenig erzählt?", options:["Sofort mit der Präsentation beginnen","Geschlossene Einstiegsfragen für Ankerpunkte, dann Hypothesen-Fragen öffnen, Schweigen aushalten und paraphrasieren was der Kunde sagt","Den Kunden drängen","Das Gespräch beenden"], correct:1, explanation:"Stiller Kunde: erst geschlossene Fragen um Fakten zu verankern, dann Hypothesen ('Ich vermute dass bei eurer Größe oft X ein Thema ist – stimmt das?'). Schweigen aushalten – wer zuerst spricht verliert.", prinzip:"Schweigen ist kein Problem – es ist Denkzeit des Kunden." },
],

psychologie: [
  { id:"p1", question:"Was ist der Unterschied zwischen System 1 und System 2 Denken (Kahneman) im Kaufkontext?", options:["Kein Unterschied für Kaufentscheidungen","System 1: schnell, intuitiv, emotional – Bauchgefühl. System 2: langsam, analytisch, rational – bewusste Überlegung. Kaufentscheidungen werden von System 1 getroffen, mit System 2 rationalisiert","System 2 entscheidet immer bei B2B","System 1 ist irrelevant in IT-Entscheidungen"], correct:1, explanation:"Entscheidungen werden zu 70-80% von System 1 getrieben – auch im B2B. Der IT-Leiter hat ein Bauchgefühl zum Anbieter bevor die Zahlen analysiert werden. Erst dann rationalisiert System 2. Vertrauen und Sympathie aufbauen ist der Entscheidungsmechanismus.", prinzip:"Emotionen entscheiden, Logik rechtfertigt." },
  { id:"p2", question:"Was ist der 'Reality Loop' nach Stephan Heinrich?", options:["Ein Verkaufsprozess mit mehreren Schleifen","Perception → Belief → Behavior → Result → Perception: unsere Wahrnehmung filtert Realität nach bestehenden Überzeugungen – wir sehen was wir erwarten zu sehen","Ein Feedback-Mechanismus","Eine Methode zur Einwandbehandlung"], correct:1, explanation:"Reality Loop: IT-Leiter der 'Externe IT-Berater sind zu teuer' glaubt, filtert alle Informationen durch diese Brille. Um jemanden zu überzeugen: erst verstehen welche Beliefs er hat und dort ansetzen.", prinzip:"Beliefs ändern sich nicht durch Fakten allein." },
  { id:"p3", question:"Was ist Anchoring (Verankern) als kognitive Verzerrung im Preiskontext?", options:["Eine Methode zur Preisverhandlung","Erste Zahl die genannt wird verankert die Wahrnehmung aller folgenden Zahlen – ein Preis nach einem hohen Ankerpreis wirkt günstiger","Nur relevant für Konsumgüter","Funktioniert nur bei unerfahrenen Käufern"], correct:1, explanation:"Anchoring: nenne zuerst den höheren Wert (Kosten des Problems) bevor du den Lösungspreis nennst. 'Wenn IT-Ausfälle Sie 10.000€ pro Stunde kosten und ein Ausfall pro Jahr wahrscheinlich ist – dann sind 8.000€ Jahresinvestition im Kontext zu sehen.'", prinzip:"Erst Kosten des Problems, dann Kosten der Lösung." },
  { id:"p4", question:"Was ist Loss Aversion (Verlustaversion) und wie wirkt sie in Kaufentscheidungen?", options:["Menschen streben immer nach Gewinn","Menschen empfinden Verluste 2x stärker als äquivalente Gewinne – Angst vor Verlust ist mächtiger als Aussicht auf Gewinn","Verlustaversion ist irrationaler Sonderfall","Nur relevant für private Entscheidungen"], correct:1, explanation:"'Sie riskieren 50.000€ Produktionsausfall' wirkt stärker als 'Sie können 50.000€ einsparen'. Beide sind identische Zahlen – aber Verlust-Framing aktiviert stärkeres Entscheidungsmotiv. Konsequenzen des Nicht-Handelns oft stärker betonen als Gewinne.", prinzip:"Verlust-Framing > Gewinn-Framing." },
  { id:"p5", question:"Was ist Reaktanz und wie vermeidest du sie im Vertrieb?", options:["Eine positive Reaktion auf Verkaufsdruck","Widerstand gegen Versuche die eigene Freiheit einzuschränken – je mehr Druck, desto mehr Widerstand. Vermeide: 'Sie müssen sich heute entscheiden', Zeitdruck, Drängen","Ein Motivationskonzept","Nur bei jungen Kunden relevant"], correct:1, explanation:"Reaktanz: je mehr du drängst, desto mehr weicht der Kunde zurück. Nie Druck erzeugen. Stattdessen: Optionen geben, Entscheidungsfreiheit betonen. Paradox: weniger Druck = mehr Bewegung beim Kunden.", prinzip:"Weniger Druck = mehr Bewegung." },
  { id:"p6", question:"Was ist der Confirmation Bias und wie beeinflusst er Kaufentscheidungen?", options:["Eine rationale Entscheidungsheuristik","Menschen suchen Informationen die ihre bestehende Meinung bestätigen – sobald ein Kunde positiv zu einem Anbieter eingestellt ist, übersieht er Schwächen","Nur bei privaten Entscheidungen","Kann durch gute Präsentation überwunden werden"], correct:1, explanation:"Ist der erste Eindruck positiv, interpretiert der Kunde alles weitere positiv. Umgekehrt: ist er negativ, hilft die beste Präsentation wenig. Ersten Eindruck aktiv gestalten ist entscheidend.", prinzip:"Erster Eindruck filtert alles was danach kommt." },
  { id:"p7", question:"Was ist das 'Vertrauen vor Verkaufen' Konzept nach Stephan Heinrich?", options:["Kaufabschluss vor Vertrauensaufbau","Ohne Vertrauen keine Kaufentscheidung – Vertrauen entsteht durch Expertise demonstrieren, Probleme verstehen, keine Agenda sichtbar machen, Konsistenz zwischen Worten und Verhalten","Vertrauen kommt durch gutes Produkt automatisch","Vertrauen ist in B2B weniger wichtig als im B2C"], correct:1, explanation:"Kunden kaufen von Menschen denen sie vertrauen und die sie mögen – Produkt kommt danach. Vertrauen aufbauen: echtes Interesse zeigen, Expertise ohne Aufdringlichkeit, Versprechen einhalten auch wenn es unbequem ist.", prinzip:"Beziehung vor Transaktion." },
  { id:"p8", question:"Was ist die 'Peak-End-Rule' und welche Implikation hat sie für Kundengespräche?", options:["Menschen erinnern sich an alles gleichwertig","Menschen erinnern sich an den emotionalen Höhepunkt und das Ende – alles in der Mitte verblasst","Nur relevant für Kundenzufriedenheits-Studien","Der Anfang ist am wichtigsten"], correct:1, explanation:"Peak-End-Rule (Kahneman): Kundengespräch soll einen klaren emotionalen Höhepunkt haben (echter Mehrwert) und stark enden (konkreter Nächster Schritt). Was in der Mitte passiert wird kaum erinnert.", prinzip:"Stark beginnen, stark enden – die Mitte trägt sich selbst." },
  { id:"p9", question:"Was ist das Paradox of Choice und warum schadet zu viel Auswahl?", options:["Mehr Auswahl ist immer besser","Zu viele Optionen überfordern und lähmen die Entscheidung. Empfehlung: maximal 3 klare Optionen, klare Empfehlung geben","Auswahl fördert Kaufbereitschaft immer","Nur relevant für Endkunden"], correct:1, explanation:"Barry Schwartz: mehr Auswahl = mehr Entscheidungsaufwand = Entscheidungsangst. Im Vertrieb: biete maximal 3 Varianten an und gib eine klare Empfehlung. 'Für Ihre Konstellation empfehle ich...' ist Service, nicht Bevormundung.", prinzip:"3 Optionen max. + klare Empfehlung." },
  { id:"p10", question:"Was ist Commitment und Konsistenz als Überzeugungsprinzip?", options:["Menschen sind generell konsequent","Menschen handeln konsistent zu ihren früheren Aussagen – kleine Commitments führen zu größeren. Kleine Ja's einsammeln führt zu größerem Ja","Nur bei persönlichen Entscheidungen","Ein manipulatives Konzept"], correct:1, explanation:"Cialdini: wer einmal 'Ja' zu X gesagt hat, tendiert dazu auch bei Y Ja zu sagen. Anwendung: im Gespräch kleine Zustimmungen aufbauen ('Stimmt das mit Ihrer Situation überein?'). Jedes kleine Ja bewegt psychologisch in Richtung Entscheidung.", prinzip:"Kleine Ja's sammeln → großes Ja erleichtern." },
  { id:"p11", question:"Was ist der Halo-Effekt im Vertrieb?", options:["Ein positiver Marketing-Begriff","Eine positive Eigenschaft (Expertise, Sympathie) überträgt sich auf die gesamte Wahrnehmung einer Person oder Marke","Ein Produkt-Feature","Nur für bekannte Marken relevant"], correct:1, explanation:"Halo-Effekt: wer kompetent wirkt, dem traut man auch ehrlich zu sein. Wer sympathisch ist, dem glaubt man auch fachlich. Erster Eindruck (pünktlich, vorbereitet, professionell) schafft Halo der alle weiteren Interaktionen überlagert.", prinzip:"Kompetenz und Sympathie verstärken sich gegenseitig." },
  { id:"p12", question:"Was bedeutet 'Framing' bei der Präsentation von Optionen?", options:["Die visuelle Gestaltung","Derselbe Sachverhalt kann positiv oder negativ gerahmt werden und erzeugt völlig unterschiedliche Reaktionen: '90% Verfügbarkeit' vs. '10% Ausfallzeit'","Nur für Marketing relevant","Framing ist irrelevant wenn Fakten gut sind"], correct:1, explanation:"'10% Ausfallzeit' klingt viel schlimmer als '90% Verfügbarkeit' – obwohl identisch. Im Vertrieb: ROI als Gewinn oder als Kostenvermeidung – je nach Motivationsstruktur des Kunden. Verlust-Frame stärker als Gewinn-Frame.", prinzip:"Wie du es sagst ist wichtiger als was du sagst." },
  { id:"p13", question:"Was ist die 'Door-in-the-Face' Technik?", options:["Eine aggressive Verkaufstechnik","Erst eine große Bitte stellen die abgelehnt wird, dann die eigentliche kleinere Bitte – nach dem großen Nein wirkt das Kleine als Zugeständnis","Eine Closing-Technik","Identisch mit 'Foot-in-the-Door'"], correct:1, explanation:"Door-in-the-Face: Vollprojekt vorstellen → abgelehnt → Pilotprojekt als Alternative. Pilot wird nach dem großen Nein als fairer Kompromiss wahrgenommen (Reziprozität + Kontrast-Prinzip). Kombination macht Pilotprojekt leichter zugänglich.", prinzip:"Groß anfragen → klein wird als Kompromiss wahrgenommen." },
  { id:"p14", question:"Was ist Unconscious Thought Theory (Dijksterhuis) und was bedeutet das für Kaufentscheidungen?", options:["Unbewusstes Denken ist schlechter","Komplexe Entscheidungen werden besser durch unbewusste Verarbeitung getroffen – der Verstand braucht Abstand. Kunden brauchen Zeit nach Präsentationen","Nur für private Entscheidungen relevant","Unbewusstes Denken ist unkontrollierbar"], correct:1, explanation:"Bei sehr komplexen Entscheidungen ist unbewusste Verarbeitung der bewussten überlegen. Nach Präsentation nicht sofort auf Entscheidung drängen – Kunde braucht Zeit. 'Schlafen Sie eine Nacht drüber' ist Psychologie, kein Zugeständnis.", prinzip:"Zeitdruck zerstört komplexe Kaufentscheidungen." },
  { id:"p15", question:"Was ist der Unterschied zwischen intrinsischer und extrinsischer Motivation beim Kauf?", options:["Identisch im B2B-Kontext","Intrinsisch: Kunde will das Problem wirklich lösen (eigene Überzeugung). Extrinsisch: Kauf durch externen Druck (Chef, Compliance, Markt). Beide brauchen unterschiedliche Argumente","Extrinsisch ist wichtiger","Intrinsisch ist im B2B seltener"], correct:1, explanation:"Intrinsisch motivierter Kunde: zeige Lösung und Mehrwert. Extrinsisch motivierter Kunde (z.B. Compliance-Druck, BSI-Anforderungen): zeige Konformität und Risikominimierung. Falsche Argumentation für den Motivationstyp: Gespräch verfehlt.", prinzip:"Kauf-Motivation bestimmt dein Argument." },
],

cialdini: [
  { id:"ci1", question:"Was sind die 6 Prinzipien nach Robert Cialdini?", options:["Preis, Qualität, Service, Marke, Referenzen, Garantie","Reziprozität, Commitment/Konsistenz, Soziale Bewährtheit, Autorität, Sympathie, Verknappung","Bedarf, Budget, Entscheider, Timing, Konkurrenz, Lösung","Aufmerksamkeit, Interesse, Verlangen, Aktion, Zufriedenheit, Loyalität"], correct:1, explanation:"Cialdinis 6 Prinzipien aus 'Influence': Reziprozität (Geben → Zurückgeben), Commitment/Konsistenz (Ja zu kleinem → Ja zu großem), Soziale Bewährtheit (andere tun es), Autorität (Experten vertrauen), Sympathie (kaufen von Menschen die wir mögen), Verknappung (Knappheit steigert Wert).", prinzip:"6 universelle Hebel der menschlichen Beeinflussung." },
  { id:"ci2", question:"Wie setzt du Reziprozität ethisch im B2B-Vertrieb ein?", options:["Durch Geschenke und Einladungen","Zuerst echten Mehrwert geben ohne Erwartung: Markteinblicke, Studien, Branchenvergleiche, kostenlose Analyse – erzeugt natürlichen Wunsch zur Gegenseitigkeit","Durch Rabatte als Vorkasse-Angebot","Reziprozität funktioniert im B2B nicht"], correct:1, explanation:"Reziprozität: wer gibt erhält zurück. Ethisch: echter Mehrwert ohne versteckte Agenda. 'Ich habe eine Bitkom-Studie zu IT-Sicherheit im Mittelstand – schicke ich gerne zu, unabhängig davon ob wir zusammenarbeiten.' Nicht-ethisch: kleine Gefälligkeit mit offensichtlicher Erwartung.", prinzip:"Gib zuerst ohne Erwartung – Reziprozität entsteht von selbst." },
  { id:"ci3", question:"Was ist Soziale Bewährtheit (Social Proof) und wie verwendest du es?", options:["Das Zeigen von Zertifikaten","Anderen ähnlichen Unternehmen verhalten sich so – wirkt als Entscheidungs-Shortcut: 'Wenn ähnliche Unternehmen das tun, ist es wahrscheinlich richtig'","Nur für Konsumgüter","Eine Manipulation ohne Basis"], correct:1, explanation:"Social Proof im B2B: 'Drei mittelständische Maschinenbauunternehmen in Württemberg haben in den letzten 12 Monaten auf diese Lösung umgestellt.' Spezifisch ist besser als allgemein – 'viele Unternehmen' ist schwächer als '3 Metallbauunternehmen Ihrer Größe'.", prinzip:"Spezifischer Social Proof > vage Aussagen." },
  { id:"ci4", question:"Wie demonstrierst du Autorität glaubwürdig im Vertrieb?", options:["Durch Titel und Auszeichnungen","Durch echte Expertise: Branchenwissen demonstrieren, spezifische Herausforderungen kennen, wertvolle Einblicke geben – Autorität durch Wissen nicht Selbstbehauptung","Durch aggressive Aussagen wie 'Wir sind die Besten'","Autorität braucht keine Demonstration"], correct:1, explanation:"Autorität durch Kompetenz: IT-Leiter merkt ob du seine Situation verstehst. Branchenspezifische Probleme benennen ohne dass er es dir sagt: 'Bei Maschinenbauunternehmen Ihrer Größe sehen wir oft X – ist das bei euch auch so?' Zeigt Expertise ohne Angeberei.", prinzip:"Zeige Expertise durch Fragen, nicht durch Aussagen." },
  { id:"ci5", question:"Was ist Verknappung im B2B-Vertrieb und wie setzt du es ethisch ein?", options:["Falsche Knappheit erzeugen","Echte Knappheit kommunizieren: begrenzte Implementierungskapazität im Q4, Fördergelder die auslaufen, Preiserhöhungen ab Januar – nur wenn real","Immer Zeitdruck erzeugen","Verknappung ist im B2B unethisch"], correct:1, explanation:"Verknappung wirkt nur wenn sie echt ist. Falsche Verknappung: sofort erkannt, zerstört Vertrauen. Echte: 'Wir können im Q4 nur 3 Projekte in Ihrer Größenordnung umsetzen' oder 'Die BAFA-Förderung läuft Ende November aus'. Kein Druck erzeugen, Realität kommunizieren.", prinzip:"Echte Knappheit kommunizieren – nie erfinden." },
  { id:"ci6", question:"Was ist Commitment/Konsistenz und wie wendest du es im Verkaufsprozess an?", options:["Den Kunden zu frühen Commitments drängen","Kleine aufeinanderfolgende Commitments aufbauen: Zwischenfazits vereinbaren, Minimalzustimmungen sammeln – Konsistenz-Prinzip führt zu größerem Commitment","Eine Manipulationstechnik","Nur bei Abschluss relevant"], correct:1, explanation:"'Haben wir uns darauf geeinigt dass X eine Herausforderung ist?' → 'Wäre eine Lösung die X adressiert grundsätzlich interessant?' → 'Macht es Sinn das Thema weiter zu vertiefen?' Jedes Ja bringt den Kunden näher zum großen Ja.", prinzip:"Aufbauende Zustimmungen vorbereiten den Abschluss." },
  { id:"ci7", question:"Wie nutzt du Sympathie als Prinzip ohne künstlich zu wirken?", options:["Immer lächeln und zustimmen","Echtes Interesse zeigen: Namen verwenden, ähnliche Werte ansprechen, auf Persönliches eingehen das der Kunde von sich aus teilt, authentisch sein","Gleiche Kleidung wie der Kunde tragen","Sympathie ist manipulativ"], correct:1, explanation:"Sympathie: Ähnlichkeit fördert Sympathie. Wenn IT-Leiter etwas Persönliches erwähnt: kurz darauf eingehen. Kein Schmeicheln – echtes Interesse. 'Ihr Team hat das bisher alles alleine gestemmt – das ist beeindruckend.' Authentizität ist nicht schaltbar.", prinzip:"Echter Interesse erzeugt echte Sympathie." },
  { id:"ci8", question:"Was ist der Unterschied zwischen Autorität und Arroganz im Vertrieb?", options:["Es gibt keinen Unterschied","Autorität: Wissen teilen das dem Kunden hilft, ehrlich sein auch wenn es unbequem ist. Arroganz: auf Überlegenheit bestehen, Kunden-Meinung abwerten","Autorität ist immer positiv","Arroganz kann im Vertrieb funktionieren"], correct:1, explanation:"Autorität wirkt wenn du dem Kunden hilfst seine Situation besser zu verstehen. Arroganz wirkt gegen dich wenn du den Kunden kleiner machst. Sei der Experte der dem Kunden auf Augenhöhe begegnet – nicht der der zeigt was er alles weiß.", prinzip:"Experte sein für den Kunden, nicht vor dem Kunden." },
  { id:"ci9", question:"Was ist der 'Foot-in-the-Door' Effekt?", options:["Das Scheitern beim ersten Kontakt","Kleine Bitte zuerst wird akzeptiert → dann größere Bitte. Das erste Ja erhöht die Wahrscheinlichkeit für das zweite Ja durch Konsistenz-Prinzip","Eine Kaltakquise-Technik","Nur im Endkundengeschäft"], correct:1, explanation:"Foot-in-the-Door: erst um 15 Minuten bitten, dann um Meeting. Erst kostenlosen Check anbieten, dann Angebot. Erst Analyse, dann Pilotprojekt, dann Vollprojekt. Jedes kleine Ja erhöht Commitment.", prinzip:"Klein anfangen, graduell erweitern." },
  { id:"ci10", question:"Wie kombinierst du Social Proof mit Autorität für maximale Wirkung?", options:["Getrennt einsetzen","Fallstudien mit Expertenaussagen kombinieren: konkrete Referenz (Social Proof) + Erklärung warum es funktioniert (Autorität) = doppelte Überzeugungskraft","Social Proof ist immer stärker","Autorität alleine reicht aus"], correct:1, explanation:"Kombination: 'Ein Maschinenbauunternehmen mit 180 Mitarbeitern in BW hat genau diese Situation gehabt. Wir haben analysiert dass das Problem auf falschem Backup-Design basierte – nach Umstellung null Datenverluste.' Social Proof + Diagnose (Autorität) = sehr überzeugend.", prinzip:"Referenz + Diagnose = stärkstes Argument." },
  { id:"ci11", question:"Wie nutzt du Reziprozität ohne in die Gefälligkeit-Falle zu tappen?", options:["Immer gleichwertige Gefälligkeiten bieten","Mehrwert ohne direkte Erwartung geben – nicht als versteckter Kaufzwang. Qualität entscheidend: nützliche Studie > billige Werbegeschenke","Kleine Geschenke immer mitbringen","Reziprozität nur bei Bestandskunden nutzen"], correct:1, explanation:"Gefälligkeit-Falle: billige Geschenke die als Manipulationsversuch wahrgenommen werden. Echter Mehrwert: 'Ich habe eine Analyse der häufigsten IT-Risiken in Maschinenbauunternehmen Ihrer Größe – kann ich Ihnen die schicken?' Keine Erwartung formulieren.", prinzip:"Qualität des Mehrwerts bestimmt die Wirkung." },
  { id:"ci12", question:"Was ist die Limitation des Knappheits-Prinzips im B2B?", options:["Es gibt keine Limitationen","B2B-Käufer merken falsche Knappheit schnell – zerstört Vertrauen dauerhaft. Knappheit muss immer real und nachweisbar sein","Knappheit wirkt nur bei kleinen Summen","Knappheit ist im B2B irrelevant"], correct:1, explanation:"B2B-Käufer haben Erfahrung mit Verkaufstaktiken. Falsche Deadline: 'Das Angebot gilt nur bis Freitag' ohne Grund → dauerhafter Vertrauensverlust. Echte Knappheit: 'Implementierungskapazität begrenzt – im Q1 haben wir noch 2 freie Slots.' Muss wahrheitsgemäß und nachvollziehbar sein.", prinzip:"Einmal erkannte falsche Knappheit = Deal verloren." },
  { id:"ci13", question:"Was ist der Unterschied zwischen positivem und negativem Social Proof?", options:["Identisch in der Wirkung","Positiv: 'Unternehmen X hat dadurch Y erreicht.' Negativ: 'Ohne X verlieren Unternehmen Y.' Beide wirken – kombiniert am stärksten für verschiedene Entscheider-Typen","Negativer Social Proof ist unethisch","Nur positiver ist erlaubt"], correct:1, explanation:"Negativer Social Proof: 'Von Mittelstandsunternehmen ohne Ransomware-Schutz haben 43% in 2023 einen Angriff erlitten.' Kombination: positiv für Gewinn-Orientierte, negativ für risikoaverse Kunden. Audience-Analyse entscheidend.", prinzip:"Positiv für Gewinn-Orientierte, negativ für Risikoaverse." },
  { id:"ci14", question:"Wie setzt du Autorität ein wenn du noch keinen langen Track Record hast?", options:["Autorität ohne Track Record ist unmöglich","Durch Branchenwissen demonstrieren, Fragen stellen die Expertise zeigen, Partnernetzwerk und Hersteller-Referenzen nutzen, ehrlich Grenzen benennen","Durch Übertreiben des Erfahrungsschatzes","Durch aggressive Aussagen"], correct:1, explanation:"Neue Anbieter ohne Track Record: Hersteller-Zertifizierungen (Nutanix Partner, Veeam Pro), Branchenkenntnis durch gezielte Fragen, auf Hersteller-Referenzen zurückgreifen, ehrliche Positionierung. Ehrlichkeit über Begrenzungen schafft Vertrauen.", prinzip:"Ehrlichkeit über Grenzen schafft mehr Vertrauen als Übertreibung." },
  { id:"ci15", question:"Warum kaufen Menschen von Menschen die sie mögen (Sympathie-Prinzip)?", options:["Das ist nur für Endkunden relevant","Sympathie ist einer der stärksten Kaufmotivoren auch im B2B: ähnliche Werte, echtes Interesse – gleiche Wellenlänge fördert Vertrauen und Kaufbereitschaft","Sympathie ist unprofessionell im B2B","Fachliche Kompetenz ersetzt Sympathie"], correct:1, explanation:"Cialdinis Sympathie-Prinzip: wir kaufen von Menschen die wir mögen und denen wir ähnlich sind. Im IT-Mittelstandsvertrieb: IT-Leiter kauft vom Verkäufer der ihn versteht – nicht vom kompetentesten den er nicht mag.", prinzip:"Gleiche Wellenlänge > überlegenes Produkt." },
],

praesentation: [
  { id:"pr1", question:"Was ist der Unterschied zwischen Features, Advantages und Benefits (FAB)?", options:["Identisch – nur verschiedene Bezeichnungen","Feature: was das Produkt hat. Advantage: was es kann. Benefit: was der Kunde davon hat. Kunden kaufen Benefits, nicht Features","Benefits sind weniger wichtig als Features","Features sind am überzeugendsten"], correct:1, explanation:"FAB: Feature ('immutable Storage'), Advantage ('Backups können von Ransomware nicht verändert werden'), Benefit ('Sie können im Angriffsfall alle Daten vollständig wiederherstellen ohne Lösegeld zu zahlen'). Im Gespräch immer zu Benefit durchdenken.", prinzip:"Feature erklärt → Benefit überzeugt." },
  { id:"pr2", question:"Was ist Storytelling im B2B-Vertrieb und warum ist es mächtiger als Fakten?", options:["Marketing-Methode ohne Relevanz im B2B","Geschichten aktivieren mehr Gehirnbereiche als reine Fakten, werden besser erinnert und erzeugen emotionale Verbindung. Eine Erfolgs-Geschichte ähnlicher Kunden ist überzeugender als Statistiken","Nur für Marketingmaterialien","Kunden im B2B wollen nur Fakten"], correct:1, explanation:"Neurowissenschaft: Fakten aktivieren Logik-Zentren. Geschichten aktivieren Emotions-, Sinnes- und Bewegungszentren – das Gehirn erlebt die Geschichte mit. 'Ein Maschinenbauer in Ihrer Situation hat folgendes erlebt...' ist wirkungsvoller als 'Studien zeigen dass...'", prinzip:"Geschichten werden erinnert, Fakten vergessen." },
  { id:"pr3", question:"Was ist die Elevator Pitch Regel und wie baust du ihn auf?", options:["In 30 Minuten alle Features erklären","In 30-60 Sekunden: Wer du bist, welches Problem du löst, für wen, mit welchem Ergebnis – klar genug dass der Zuhörer sofort versteht ob es relevant ist","Ein Pitch der im Aufzug stattfindet","Nur relevant für Investoren-Gespräche"], correct:1, explanation:"Elevator Pitch: Problem → Zielgruppe → Lösung → Differenzierung. 'Wir helfen IT-Leitern im Mittelstand dabei, IT-Infrastruktur-Entscheidungen vendor-neutral und vergleichbar zu treffen.' In 30 Sekunden. Kein Jargon, keine Features.", prinzip:"30 Sekunden – Problem, Zielgruppe, Lösung, Differenzierung." },
  { id:"pr4", question:"Was ist die 'Rule of Three' in Präsentationen?", options:["Maximal 3 Folien","Menschen behalten Dreier-Strukturen besser: 3 Kernbotschaften, 3 Hauptprobleme, 3 Lösungsoptionen – nicht 7 Features und 12 Vorteile","Präsentationen dauern genau 3 Minuten","Ein Verkaufsprinzip mit 3 Phasen"], correct:1, explanation:"Rule of Three: das menschliche Gehirn gruppiert und erinnert Dreier-Strukturen gut. Im Vertrieb: nenne die 3 wichtigsten Probleme die du löst, 3 Gründe warum dein Ansatz funktioniert, 3 Schritte zum Ergebnis. Mehr als 3: die mittleren verblassen.", prinzip:"3 Punkte – nicht mehr, nicht weniger." },
  { id:"pr5", question:"Was ist der Primacy und Recency Effekt in Präsentationen?", options:["Kein Unterschied in der Erinnerung","Primacy: das Erste wird gut erinnert. Recency: das Letzte wird gut erinnert. Alles in der Mitte verblasst. Wichtigstes an Anfang und Ende platzieren","Die Mitte ist am wichtigsten","Reihenfolge ist für Erinnerung irrelevant"], correct:1, explanation:"Dein Kernargument und Call-to-Action gehören an Anfang und Ende. Niemals mit Admin-Details beginnen oder enden. Opener: sofort relevant und aufmerksamkeitsstark. Closing: konkreter Nächster Schritt.", prinzip:"Gold an den Rändern, Details in der Mitte." },
  { id:"pr6", question:"Was ist der Unterschied zwischen ROI-Argument und TCO-Argument?", options:["Identisch","ROI: was bringt die Investition zurück (für Mehrwert-Sucher). TCO: Gesamtkosten über Nutzungsdauer (für preisbewusste Käufer). Je nach Entscheider-Typ den richtigen Rahmen wählen","TCO ist unwichtiger","Nur ROI ist im B2B relevant"], correct:1, explanation:"ROI-Argument: 'Die Lösung kostet 20.000€ und spart 8.000€ Personalaufwand pro Jahr – ROI nach 2,5 Jahren.' TCO-Argument: 'Im 5-Jahres-Vergleich ist unsere Lösung trotz höherem Preis 15% günstiger.' Entscheider-Typ bestimmt den Frame.", prinzip:"ROI für Gewinn-Sucher, TCO für Kosten-Optierer." },
  { id:"pr7", question:"Was bedeutet 'den Kunden in die Geschichte setzen'?", options:["Den Kunden als Beispiel ohne Erlaubnis verwenden","Kundenpräsentation nicht über dein Unternehmen – sondern Kunde als Hauptcharakter: 'Sie stehen vor...' 'Was das für Sie bedeutet...' – Kunde sieht sich in der Geschichte","Fallstudien anderer Kunden vorstellen","Eine Marketing-Technik"], correct:1, explanation:"Kundenzentrierte Präsentation: 'Ihr Unternehmen hat folgende Herausforderungen... Sie können durch X folgendes erreichen...' Nicht: 'Unser Produkt hat... Wir können...' Wenn der Kunde sich selbst in der Story sieht: Relevanz ist sofort spürbar.", prinzip:"Du als Regisseur, Kunde als Hauptcharakter." },
  { id:"pr8", question:"Wie präsentierst du Preis ohne ihn zu entschuldigen?", options:["Immer Rabatt anbieten bevor der Kunde fragt","Preis sicher nennen: nach dem Wert, in Kontext gestellt, keine Entschuldigungs-Signale wie 'eigentlich' oder 'ich weiß das ist viel, aber' – dann Stille","Preis so lange wie möglich vermeiden","Preis erst am Ende ganz kurz erwähnen"], correct:1, explanation:"Preis ohne Entschuldigung: erst Wert aufbauen, dann Preis nennen. 'Die Investition beträgt 24.000€ im ersten Jahr.' Kein 'leider', kein 'aber'. Danach Stille – nicht rechtfertigen. Wer den Preis entschuldigt signalisiert dass er selbst ihn nicht für gerechtfertigt hält.", prinzip:"Preis nennen, schweigen, warten." },
  { id:"pr9", question:"Was ist aktives Einbeziehen des Kunden in die Präsentation?", options:["Den Kunden fragen ob er die Präsentation gut findet","Regelmäßige Check-Ins: 'Passt das mit Ihrer Erfahrung überein?', 'Wie relevant ist das für Ihren Kontext?' – verhindert Monolog, hält Kunden aktiv","Monolog ist professioneller","Einbeziehung lenkt vom Inhalt ab"], correct:1, explanation:"Monolog-Präsentation: Kunde schaltet nach 10 Minuten ab. Einbeziehung: Kunde bleibt aktiv, bestätigt Relevanz, liefert neue Informationen. Regel: alle 5-7 Minuten Check-In. Präsentation wird zu Dialog – viel höhere Überzeugungskraft.", prinzip:"Dialog > Monolog. Alle 5-7 Min Check-In." },
  { id:"pr10", question:"Was ist ein Executive Summary im Kontext einer Angebotspräsentation?", options:["Eine Zusammenfassung am Ende","Komprimierter Überblick am Anfang: Problem + Lösung + Ergebnis in 1-2 Seiten. Für Entscheider die keine Zeit haben – entscheiden oft auf Basis des Summaries","Technische Spezifikationen auf einer Seite","Nur für Berater relevant"], correct:1, explanation:"Executive Summary: GF/CFO liest oft nur die ersten 2 Seiten. Diese müssen das Wesentliche enthalten: welches Problem gelöst wird, wie, was es kostet, was es bringt. IT-Leiter liest Details – GF braucht Überblick. Zweistufige Präsentation für gemischtes Publikum.", prinzip:"GF liest 2 Seiten. IT-Leiter liest alles. Beide bedienen." },
  { id:"pr11", question:"Was ist der Unterschied zwischen präsentieren und verkaufen?", options:["Identisch","Präsentieren: Informationen vermitteln. Verkaufen: Entscheidung herbeiführen durch relevante Informationen, Vertrauen aufbauen, Einwände behandeln, Nächsten Schritt vereinbaren","Verkaufen ist aggressiver","Präsentieren ist moderner"], correct:1, explanation:"Präsentation ohne Verkaufs-Intention: schöner Vortrag, kein Ergebnis. Verkaufen durch Präsentation: jede Folie hat eine Funktion. Immer mit Nächstem Schritt enden: 'Was ist für Sie der sinnvolle nächste Schritt?'", prinzip:"Jede Präsentation endet mit einer konkreten Frage." },
  { id:"pr12", question:"Was ist die SUCCES-Formel nach Heath für einprägsame Botschaften?", options:["Speed, Understanding, Clarity, Credibility, Emotion, Story","Simple, Unexpected, Concrete, Credible, Emotional, Story – sechs Prinzipien für Botschaften die haften bleiben","Structure, Understanding, Context, Creativity, Example, Solution","Start, Use-case, Cost, Customer, End, Summary"], correct:1, explanation:"Heath Brothers: Simple (Kernbotschaft in einem Satz), Unexpected (Überraschungs-Moment der Aufmerksamkeit erzeugt), Concrete (spezifische Zahlen/Bilder), Credible (Glaubwürdigkeit durch Referenz), Emotional (persönliche Relevanz), Story (Narrativ statt Fakten-Liste).", prinzip:"SUCCES: Simple, Unexpected, Concrete, Credible, Emotional, Story." },
  { id:"pr13", question:"Was ist der Unterschied zwischen einer Demo und einem Proof-of-Concept?", options:["Identisch","Demo: zeigt was das Produkt kann (vorgefertigtes Szenario, Best Case). PoC: Produkt wird in echter Kundenumgebung getestet – überzeugender aber aufwendiger","Demo ist detaillierter","PoC ist günstiger als Demo"], correct:1, explanation:"Demo: du kontrollierst das Szenario. PoC: Kunde testet in echter Umgebung – zeigt Realität, weniger wahrgenommenes Risiko. Im IT-Mittelstandsvertrieb: Demo für erste Überzeugung, PoC für Beseitigung von Restzweifeln bei großen Investitionen.", prinzip:"PoC beseitigt Restzweifel, Demo erzeugt erstes Interesse." },
  { id:"pr14", question:"Was bedeutet Nutzenkommunikation auf Entscheider-Ebene vs. Fachebene?", options:["Identisch für alle Zuhörer","Fachebene (IT-Leiter): technische Details, Architektur, Integration. Entscheider-Ebene (GF, CFO): Kosten, Risiken, Wettbewerbsvorteil, Zeit. Gleiche Lösung, andere Sprache","Entscheider verstehen technische Details","Nur eine Ansprache für alle"], correct:1, explanation:"Multi-Level-Selling: für den IT-Leiter zeigst du die technische Eleganz. Für den GF: 'Das reduziert Ihre Abhängigkeit von einem einzelnen Anbieter und spart X€ im 5-Jahres-Vergleich.' Gleiche Lösung, völlig andere Sprache.", prinzip:"Gleiche Lösung, entscheider-spezifische Sprache." },
  { id:"pr15", question:"Was ist der Unterschied zwischen einer Nutzen-Frage und einer Feature-Aussage?", options:["Identisch in der Wirkung","Nutzen-Frage: 'Was würde das für Ihr Team bedeuten?' lässt den Kunden selbst den Nutzen formulieren – überzeugender als wenn du den Nutzen behauptest","Feature-Aussagen sind überzeugender","Nutzen-Fragen wirken manipulativ"], correct:1, explanation:"Wenn der Kunde selbst den Nutzen formuliert ('Das würde uns 2 Stunden Arbeit pro Woche sparen'), ist er überzeugter als wenn du behauptest 'Das spart Ihnen 2 Stunden pro Woche.' Eigene Worte sind glaubwürdiger als Verkäufer-Worte.", prinzip:"Kunden den Nutzen selbst formulieren lassen = stärkste Überzeugung." },
],

abschluss: [
  { id:"a1", question:"Was ist der Unterschied zwischen einem weichen und einem harten Abschluss?", options:["Identisch in der Wirkung","Weicher Abschluss: 'Was ist für Sie der sinnvolle Nächste Schritt?' Harter Abschluss: 'Sollen wir den Auftrag jetzt aufsetzen?' Weicher führt zu mehr echten Ja's im B2B","Harter Abschluss ist immer besser","Weicher Abschluss ist zu passiv"], correct:1, explanation:"Im B2B: harter Abschluss erzeugt oft Reaktanz – Käufer fühlen sich gedrückt. Weicher Abschluss lässt dem Kunden die Kontrolle und führt dennoch zu einem klaren Nächsten Schritt. Heinrich: nie drängen, immer begleiten.", prinzip:"Begleiten statt drängen." },
  { id:"a2", question:"Was ist ein 'Trial Close' und wann wendest du ihn an?", options:["Ein Abschluss ohne Verpflichtung","Testfrage die den Entscheidungsstand prüft ohne Druck: 'Wenn wir X lösen können – wäre das grundsätzlich ein Ansatz der für Sie interessant wäre?' Zeigt ob Kunde bereit ist ohne zu drängen","Eine aggressive Closing-Technik","Nur am Ende des Gesprächs relevant"], correct:1, explanation:"Trial Close: du testest die Kaufbereitschaft ohne formellen Abschluss zu verlangen. Reaktion des Kunden zeigt wo er steht. Positiv: weiter zum Abschluss. Zögernd: mehr Arbeit an Wert oder Einwänden nötig.", prinzip:"Kaufbereitschaft testen, nicht erzwingen." },
  { id:"a3", question:"Was ist die größte Gefahr beim Nachfassen?", options:["Zu früh nachzufassen","Ohne Mehrwert nachzufassen – 'wollte nur kurz fragen ob Sie sich entschieden haben' – wirkt als Belastung nicht als Partner","Zu spät nachzufassen","Zu oft nachzufassen"], correct:1, explanation:"Nachfassen ohne Mehrwert: du wirst als Verkäufer der auf seinen Abschluss wartet wahrgenommen. Nachfassen mit Mehrwert: 'Hatte das Thema X erwähnt – habe hier eine aktuelle Bitkom-Zahl dazu.' Du bleibst als Partner der Wert bringt.", prinzip:"Jeder Kontakt = Mehrwert. Sonst nicht melden." },
  { id:"a4", question:"Wie strukturierst du einen Nächsten Schritt am Ende eines Gesprächs?", options:["Dem Kunden überlassen wann er sich meldet","Konkret: Was passiert, wann, wer macht es – 'Ich schicke Ihnen bis Donnerstag die Analyse, und wir telefonieren am Dienstag 14 Uhr um die Fragen zu klären – passt das?'","Nur eine E-Mail schicken","Fragen ob der Kunde sich meldet wenn er bereit ist"], correct:1, explanation:"Nächster Schritt muss konkret sein: Aktion + Datum + Verantwortlicher. Kein 'ich melde mich' oder 'wir schauen was sich ergibt'. Kunde muss zustimmen. Ohne konkreten Nächsten Schritt: Deal schläft ein.", prinzip:"Kein Gespräch ohne konkreten Nächsten Schritt." },
  { id:"a5", question:"Was ist 'Multi-Level Selling' und warum ist es wichtig beim Abschluss?", options:["Mit mehreren Kunden gleichzeitig sprechen","Beziehungen zu mehreren Entscheidungsebenen aufbauen: IT-Leiter, GF, CFO, Einkauf – schützt vor Single Point of Failure beim Entscheidungsprozess","Eine Technik für komplexe Produkte","Nur bei Enterprise-Kunden relevant"], correct:1, explanation:"Wenn du nur den IT-Leiter kennst: GF blockiert den Deal aus unbekannten Gründen und du hast keinen Einfluss. Multi-Level: du kennst alle Entscheider, verstehst ihre Agenden, kannst intern navigieren. Komplexe B2B-Deals brauchen mehrere Kontaktpunkte.", prinzip:"Mehr Kontaktpunkte = mehr Abschluss-Sicherheit." },
  { id:"a6", question:"Was ist der Unterschied zwischen einem Angebot und einem Proposal?", options:["Identisch","Angebot: Preisliste, wenig individuell. Proposal: maßgeschneidert auf spezifische Kundensituation – zeigt Verständnis der Herausforderungen, schlägt Lösung vor, kalkuliert ROI","Proposal ist teurer in der Erstellung ohne Mehrwert","Angebot ist moderner"], correct:1, explanation:"Proposal: beginnt mit dem Kunden-Problem (nicht mit deinem Unternehmen), beschreibt die spezifische Lösung, enthält ROI-Kalkulation, endet mit klarem Nächsten Schritt. Generisches Angebot wirkt wie Copy-Paste. Individuelles Proposal zeigt dass du verstanden hast.", prinzip:"Proposal startet mit dem Problem des Kunden." },
  { id:"a7", question:"Was ist 'Assumptive Close' und wann ist er angebracht?", options:["Den Kunden zu einem Abschluss zwingen","Spreche als ob die Entscheidung bereits getroffen ist: 'Wenn wir im Oktober starten...' – nur angebracht wenn klare positive Signale vorhanden sind","Immer verwenden","Eine manipulative Technik die immer zu vermeiden ist"], correct:1, explanation:"Assumptive Close: 'Wenn wir Mitte Oktober starten – welche Abteilung soll zuerst migriert werden?' Setzt voraus dass der Kunde Ja sagt ohne es zu fragen. Nur wenn klare Kaufsignale vorhanden – zu früh angewandt: wirkt arrogant und erzeugt Reaktanz.", prinzip:"Kaufsignale erkennen bevor du assumptive schließt." },
  { id:"a8", question:"Wie gehst du mit 'Ich muss nochmal intern besprechen' kurz vor dem Abschluss um?", options:["Warten bis der Kunde sich meldet","Verstehen was intern besprochen werden muss und ob du helfen kannst den internen Prozess zu unterstützen – Material vorbereiten, Termin für danach vereinbaren","Druck machen damit der Kunde sofort entscheidet","Den Deal als verloren betrachten"], correct:1, explanation:"'Intern besprechen' bedeutet: du redest nicht mit allen Entscheidungsträgern oder es gibt offene Bedenken. Frage: 'Was wird intern besprochen?' und 'Wie kann ich helfen dass das Gespräch intern gut verläuft?' Angebot: internes Briefing-Material oder direktes Gespräch mit der nächsten Ebene.", prinzip:"Internen Prozess verstehen und unterstützen." },
  { id:"a9", question:"Was ist ein Follow-up System und warum braucht du es?", options:["Ein CRM-System","Strukturierter Prozess der sicherstellt dass jeder Lead zum richtigen Zeitpunkt kontaktiert wird – verhindert dass Deals im Chaos untergehen","Eine E-Mail-Vorlage","Ein automatisches Antwort-System"], correct:1, explanation:"Ohne Follow-up System: Leads gehen verloren weil du den Überblick verlierst, Timing verpassen, Deals kalt werden lassen. Mit System (CRM, Kalender-Wiedervorlagen): jeder Lead bekommt zum richtigen Zeitpunkt den richtigen Kontakt. Konsequenz im Follow-up unterscheidet mittelmäßige von guten Verkäufern.", prinzip:"System schlägt Talent beim Follow-up." },
  { id:"a10", question:"Was ist ein Summary Close?", options:["Eine kurze Zusammenfassung der Präsentation","Vor dem Abschluss alle vereinbarten Punkte zusammenfassen: 'Wir haben uns darauf geeinigt dass X das Problem ist, Y die Lösung und Z das Ergebnis – dann ist der nächste Schritt...' – erzeugt Konsistenz-Druck","Eine Technik für kurze Gespräche","Nur für komplexe Deals relevant"], correct:1, explanation:"Summary Close: du fasst alle positiven Punkte zusammen auf die sich der Kunde im Gespräch geeinigt hat. Die Logik des Abschlusses ergibt sich aus den eigenen Aussagen des Kunden. Wirkt nicht wie Druck sondern wie logische Konsequenz.", prinzip:"Lass die Aussagen des Kunden den Abschluss logisch machen." },
  { id:"a11", question:"Wie lange sollte eine Follow-up Sequenz für einen warmen Lead dauern?", options:["Maximal 2 Wochen","Solange Kontakt sinnvoll ist – 6-12 Monate mit wertvollem Mehrwert bei jedem Kontakt. Budgets ändern sich, Prioritäten verschieben sich","Bis der Kunde Nein sagt","Maximal 3 Kontaktversuche"], correct:1, explanation:"Timing ist im B2B oft entscheidend: der Lead der heute kein Budget hat, hat in 6 Monaten Budget. Wer langfristig präsent bleibt (mit Mehrwert, nicht mit Spam) ist top-of-mind wenn die Situation sich ändert. Geduld ist eine Vertriebsstärke.", prinzip:"Top-of-mind bleiben bis der Zeitpunkt stimmt." },
  { id:"a12", question:"Was ist der Unterschied zwischen einem Einwand kurz vor dem Abschluss und einem Rückzug?", options:["Identisch","Einwand: konkrete Bedingung die erfüllt werden kann. Rückzug: Kunde hat grundsätzlich das Interesse verloren – braucht anderen Ansatz als Einwandbehandlung","Rückzug ist immer ein Preisproblem","Einwände kommen immer vor dem Abschluss"], correct:1, explanation:"Einwand kurz vor Abschluss: 'Können wir die Implementierung auf Q1 verschieben?' – lösbar. Rückzug: 'Wir haben das intern nochmal besprochen und das ist gerade kein Thema.' – hier hilft Einwandbehandlung nicht. Erst diagnostizieren was passiert ist, dann reagieren.", prinzip:"Erst diagnostizieren – Einwand oder Rückzug?" },
  { id:"a13", question:"Was ist ein Referral und wie bittest du darum?", options:["Eine Kundenempfehlung die von selbst kommt","Aktiv nach Weiterempfehlung fragen nach erfolgreichem Abschluss: 'Kennen Sie andere Unternehmen in Ihrem Netzwerk die vor ähnlichen Herausforderungen stehen?' – warmer Lead durch Vertrauen","Nur bei sehr zufriedenen Kunden möglich","Referrals sind in B2B unüblich"], correct:1, explanation:"Referral-Anfrage nach Erfolg: 'Wenn Sie zufrieden mit dem Ergebnis sind – kennen Sie jemanden in Ihrem Netzwerk dem ich helfen könnte?' Warmer Lead durch bestehenden Vertrauenstransfer ist deutlich einfacher zu konvertieren als Kaltakquise.", prinzip:"Bester Lead = warm durch Empfehlung." },
  { id:"a14", question:"Was ist ein 'Ben Franklin Close'?", options:["Eine historische Verkaufstechnik ohne heutige Relevanz","Pro/Contra-Liste gemeinsam mit dem Kunden erstellen: Gründe dafür und dagegen aufschreiben – macht Entscheidung transparent und Pros überwiegen meist","Eine Manipulationstechnik","Nur für sehr rationale Kunden"], correct:1, explanation:"Ben Franklin Close: 'Lassen Sie uns das gemeinsam aufschreiben – was spricht dafür, was dagegen?' Gemeinsame Liste. Pros die du kennst können vollständig aufgelistet werden. Cons: Kunde nennt sie selbst – du kannst darauf eingehen. Macht Entscheidungsprozess transparent.", prinzip:"Entscheidung transparent machen reduziert Angst." },
  { id:"a15", question:"Wie misst du den Erfolg deines Vertriebsprozesses jenseits des Abschlusses?", options:["Nur der Abschluss zählt","Conversionrate pro Stufe (Lead → Termin → Angebot → Abschluss), durchschnittliche Dealsize, Sales Cycle Länge, Win/Loss-Analyse – zeigt wo der Prozess optimiert werden muss","Umsatz alleine ist ausreichend","Erfolg kann nur subjektiv bewertet werden"], correct:1, explanation:"Pipeline-Metriken: Conversionrate jeder Stufe zeigt wo Leads verloren gehen. Wenn 80% aller Leads beim Angebot verloren gehen: Problem ist nicht die Kaltakquise sondern der Angebotsprozess. Ohne Metriken: blinde Optimierung.", prinzip:"Messen was optimiert werden soll." },
],

mittelstand: [
  { id:"m1", question:"Was sind typische Entscheidungsstrukturen im deutschen Mittelstand?", options:["Schnelle Entscheidungen durch einen zentralen Entscheider","Oft Konsens-orientiert: GF, IT-Leiter, manchmal Einkauf und Betriebsrat involviert – längere Entscheidungszyklen als im Startup, aber loyalere Kunden wenn gewonnen","Nur IT-Leiter entscheidet","Einkauf entscheidet immer alleine"], correct:1, explanation:"Mittelstand: Entscheidungen werden selten von einer Person allein getroffen. GF für Budget, IT-Leiter für fachliche Eignung, manchmal Betriebsrat bei Datenschutzthemen. Wer nur den IT-Leiter kennt: verliert an GF oder Einkauf. Alle Stakeholder kennen.", prinzip:"Alle Stakeholder kennen und bedienen." },
  { id:"m2", question:"Was bedeutet 'Mittelstandsmentalität' im Vertriebskontext?", options:["Mittelstand kauft ausschließlich nach Preis","Mittelstand kauft Vertrauen: langjährige Beziehungen, Zuverlässigkeit, lokale Präsenz, persönlicher Ansprechpartner wichtiger als Markenname oder niedrigster Preis","Entscheidungen werden immer rational getroffen","Mittelstand ist nicht innovationsbereit"], correct:1, explanation:"Mittelstand: 'Ich brauche jemanden dem ich vertrauen kann, der da ist wenn es brennt, und der meinen Betrieb versteht.' Nicht: 'Ich brauche den günstigsten Anbieter.' Beziehungsaufbau ist Investition, nicht Overhead. Loyalität belohnt langfristige Präsenz.", prinzip:"Vertrauen > Preis im Mittelstand." },
  { id:"m3", question:"Was ist der Unterschied zwischen einem IT-Leiter und einem IT-Verantwortlichen im Mittelstand?", options:["Identisch","IT-Leiter: dedizierte IT-Führungsrolle, oft in größeren Mittelstandsunternehmen. IT-Verantwortlicher: Nebenrolle (oft kaufmännischer Leiter oder GF der auch IT macht) – in kleinen Unternehmen häufig","IT-Verantwortlicher hat mehr Budget","IT-Leiter ist immer der Entscheider"], correct:1, explanation:"Im kleinen Mittelstand (50-150 MA): oft kein dedizierter IT-Leiter. Die IT-Verantwortung liegt beim GF oder kaufmännischen Leiter. Andere Ansprache: kein technischer Jargon, mehr Fokus auf Geschäftsauswirkungen und Risiken.", prinzip:"Wer ist wirklich verantwortlich für IT? Nicht annehmen." },
  { id:"m4", question:"Was sind typische IT-Schmerzpunkte im deutschen Mittelstand?", options:["Ausschließlich Kostendruck","Fachkräftemangel in der IT, Ransomware-Angst, Compliance-Anforderungen (DSGVO, BSI), veraltete Infrastruktur, kein Budget für Eigenentwicklung, Abhängigkeit von einzelnen Personen ('Wissenssilo')","Mittelstand hat keine IT-Probleme","Nur Cloud-Migration ist relevant"], correct:1, explanation:"Typische Schmerzpunkte: 'Unser einziger IT-Admin ist ausgefallen und niemand weiß wie das System funktioniert', 'Wir wurden letztes Jahr gehackt', 'DSGVO-Audit nächstes Quartal', 'Unsere Server sind 8 Jahre alt.' Diese Sprache öffnet Türen.", prinzip:"Mittelstand-Schmerzen kennen und benennen." },
  { id:"m5", question:"Wie unterscheidet sich die Ansprache im Maschinenbau von der im Handel?", options:["Identisch – alle Branchen werden gleich angesprochen","Maschinenbau: OT/IT-Konvergenz, Produktionsverfügbarkeit, ISO-Normen. Handel: ERP-Anbindung, Kassenterminals, saisonale Lastspitzen. Branchenspezifische Sprache zeigt Expertise","Branchenunterschiede sind im IT-Vertrieb irrelevant","Nur Preis unterscheidet die Branchen"], correct:1, explanation:"Branchenkenntnis = Vertrauen. Wenn du beim Maschinenbauer sagst 'Sie haben sicher auch das Thema OT-Security auf dem Schirm nach den neuen NIS2-Anforderungen' – sofort andere Reaktion als generische IT-Sprache. Branchen-Vokabular lernen ist Investition.", prinzip:"Branchensprache = sofortige Glaubwürdigkeit." },
  { id:"m6", question:"Was ist NIS2 und warum ist es ein relevantes Vertriebsthema im Mittelstand?", options:["Eine veraltete EU-Richtlinie","EU-Richtlinie zur Netzwerk- und Informationssicherheit die seit Oktober 2024 in nationales Recht umgesetzt wird – verpflichtet viele Mittelstandsunternehmen zu konkreten IT-Sicherheitsmaßnahmen","Nur für Großunternehmen relevant","Eine freiwillige Zertifizierung"], correct:1, explanation:"NIS2 betrifft erheblich mehr Unternehmen als NIS1: viele mittelgroße Unternehmen in kritischen Sektoren (Maschinenbau, Logistik, Gesundheit) werden erstmals verpflichtet. Compliance-Druck = konkreter Handlungsbedarf = Vertriebsöffner. 'Sind Sie von NIS2 betroffen?' ist eine starke Einstiegsfrage.", prinzip:"Compliance-Druck ist der stärkste externe Kaufmotivator." },
  { id:"m7", question:"Was ist der typische Budget-Zyklus im Mittelstand und wie nutzt du ihn?", options:["Mittelstand hat keine festen Budget-Zyklen","Oft Jahresbudget das Q4 geplant wird für das Folgejahr – Gespräche im Q3 sind optimal um in das Budget zu kommen, Q4 oft für laufende Budget-Reste","Investitionsentscheidungen jederzeit möglich","Budget spielt im Mittelstand keine Rolle"], correct:1, explanation:"Budget-Timing: Q3-Gespräche landen im Jahresbudget. Q4-Gespräche: oft 'nichts mehr im Budget, melden Sie sich im Januar.' Januar-März: Budget vorhanden aber Entscheidung dauert. Optimal: Q2-Q3 für große Investitionen. 'Wann wird bei Ihnen für das nächste Jahr geplant?' – wichtige Qualifizierungsfrage.", prinzip:"Budget-Zyklus kennen = richtiges Timing." },
  { id:"m8", question:"Was bedeutet 'DACH-Markt' und welche Besonderheiten hat er im IT-Vertrieb?", options:["Nur Deutschland ist relevant","Deutschland, Österreich, Schweiz – ähnliche Sprache aber unterschiedliche Regulierung, Datenschutzkultur und Kaufverhalten. CH: hohe Preisbereitschaft, strenge Compliance. AT: ähnlich DE aber eigene Regelungen","DACH ist identisch in allen Aspekten","Österreich und Schweiz sind für IT-Vertrieb nicht relevant"], correct:1, explanation:"DACH-Unterschiede: Schweiz hat eigenes Datenschutzgesetz (revDSG), hohe Preisbereitschaft, viele internationale Unternehmen mit GDPR-Zusatz. Österreich: DSB als Aufsichtsbehörde, eigene Ausschreibungskultur. DE: DSGVO, BSI, starke Mittelstands-IT-Dienstleister-Dichte.", prinzip:"DACH ist kein homogener Markt." },
  { id:"m9", question:"Was ist der Unterschied zwischen einem Familienunternehmen und einem Private-Equity-geführten Mittelständler im Vertriebskontext?", options:["Identisch","Familienunternehmen: Langfristdenken, persönliche Beziehungen entscheidend, GF oft Eigentümer. PE-geführt: kurzfristige KPIs, schnellere Entscheidungen, mehr Formalprozesse, EBITDA-Fokus","PE-Unternehmen kaufen mehr IT","Familienunternehmen haben mehr Budget"], correct:1, explanation:"Familienunternehmen: 'Wir wollen einen Partner für die nächsten 10 Jahre.' → Vertrauen und Langfristigkeit betonen. PE-geführt: 'Wie viel spart das im ersten Jahr?' → ROI und schnelle Payback-Zeit. Gleiche Lösung, völlig andere Argumentation.", prinzip:"Eigentümerstruktur bestimmt den Buying-Style." },
  { id:"m10", question:"Was sind häufige Einwände spezifisch im Mittelstand und wie begegnest du ihnen?", options:["Mittelstand hat dieselben Einwände wie Enterprise","'Wir sind zu klein dafür', 'Das ist für große Firmen', 'Unsere IT ist nicht so komplex' – Reaktion: Mittelstand-Referenzen ähnlicher Größe, skalierbare Lösungen zeigen, Komplexität ehrlich einschätzen","Mittelstand hat keine spezifischen Einwände","'Zu teuer' ist der einzige Mittelstand-Einwand"], correct:1, explanation:"'Wir sind zu klein' ist oft Selbstunterschätzung oder Angst vor Enterprise-Preisen. Reaktion: 'Wir haben Kunden mit 80 Mitarbeitern und welche mit 400 – unser Ansatz skaliert. Darf ich zeigen wie das bei einem ähnlichen Unternehmen aussieht?' Mittelstand-Referenzen sind der beste Hebel.", prinzip:"Mittelstand-Referenzen schlagen jedes Argument." },
  { id:"m11", question:"Wie wichtig ist Lokalität und Regionalität im Mittelstandsvertrieb?", options:["Nicht relevant in der digitalen Welt","Sehr wichtig: lokaler Ansprechpartner, regionale Referenzen, Messepräsenz (Hannover Messe, Südback etc.), Sprache des Regionaldialekts als Signal für Vertrautheit","Mittelstand kauft nur bundesweit","Online-Präsenz ersetzt regionale Präsenz vollständig"], correct:1, explanation:"'Kennen Sie XY aus der Region – die haben wir ebenfalls betreut' ist wirkungsvoller als eine bundesweite Referenz. Regionaler Ansprechpartner ('ich kann morgen bei Ihnen vorbeikommen') schafft Vertrauen. Mittelstand kauft lokal wenn Qualität stimmt.", prinzip:"Regionale Referenzen und Erreichbarkeit sind Kaufargumente." },
  { id:"m12", question:"Was sind die Hauptunterschiede im Kaufverhalten Mittelstand vs. Enterprise?", options:["Identisch","Enterprise: lange Ausschreibungen, viele Entscheider, Compliance-getrieben. Mittelstand: kürzere Zyklen, persönlichere Entscheidungen, GF oft direkt involviert, weniger Bürokratie","Enterprise kauft schneller","Mittelstand hat mehr Bürokratie"], correct:1, explanation:"Mittelstand: GF entscheidet oft final und persönlich, kürzere Entscheidungszyklen wenn Vertrauen vorhanden, weniger formale Ausschreibungen. Chance: direkter Zugang zum Entscheider. Risiko: eine Person blockiert → Deal weg.", prinzip:"Direkter GF-Zugang = Chance und Risiko zugleich." },
  { id:"m13", question:"Was ist der 'Hidden Champion' Typ im Mittelstand und wie sprichst du ihn an?", options:["Ein mittelgroßes Unternehmen ohne Besonderheiten","Weltmarktführer in einer Nische, global aktiv, hohe Qualitätsansprüche, oft wenig bekannt – braucht Enterprise-Level IT aber denkt wie Mittelstand: Zuverlässigkeit und Langzeitpartnerschaft","Nur in Bayern vorhanden","Hidden Champions kaufen nicht bei kleinen Anbietern"], correct:1, explanation:"Hidden Champions: 'Wir exportieren in 40 Länder und haben 300 Mitarbeiter' – IT-Anforderungen entsprechen Enterprise (HA, DR, Sicherheit) aber Entscheidungskultur ist Mittelstand (persönlich, langfristig, vertrauensbasiert). Ansprache: Enterprise-Lösungen, Mittelstands-Kommunikation.", prinzip:"Enterprise-Lösung, Mittelstands-Ansprache bei Hidden Champions." },
  { id:"m14", question:"Wie nutzt du LinkedIn gezielt im Mittelstandsvertrieb?", options:["LinkedIn ist für Mittelstand nicht relevant","Warm-up durch Content der Mittelstand-spezifische Probleme adressiert, dann Connection-Request mit personalisierten Nachricht, dann Gespräch via InMail oder Telefonanruf","Nur Kaltakquise über LinkedIn","LinkedIn ersetzt alle anderen Kanäle"], correct:1, explanation:"Mittelstand auf LinkedIn: IT-Leiter und GF sind zunehmend aktiv. Content-Strategie: Mittelstand-spezifische Probleme (NIS2, IT-Fachkräftemangel, Ransomware) ansprechen ohne Produkt-Pitch. Wer relevant klingt: wird als Experte wahrgenommen. Dann Conversation starten.", prinzip:"Relevant werden bevor du akquirierst." },
  { id:"m15", question:"Was ist die BAFA-Förderung und welche Relevanz hat sie im IT-Vertrieb?", options:["Ein veraltetes Förderprogramm","Bundesamt für Wirtschaft und Ausfuhrkontrolle: verschiedene Förderprogramme für Digitalisierung und Energieeffizienz im Mittelstand – IT-Sicherheit, Prozessdigitalisierung teils förderfähig – senkt Einstiegshürde","Nur für produzierende Unternehmen","BAFA ist für IT nicht relevant"], correct:1, explanation:"BAFA und KfW-Programme: Mittelstand erhält Zuschüsse oder günstige Kredite für Digitalisierungsprojekte. Wenn du dem Kunden sagst 'Für ein Projekt dieser Art gibt es unter Umständen BAFA-Förderung – haben Sie das geprüft?' – zeigst du Mehrwert über das Produkt hinaus.", prinzip:"Fördermittelwissen ist ein Vertriebsvorteil." },
],

kaltakquise: [
  { id:"k1", question:"Was ist der Unterschied zwischen einem Kaltanruf und einem Warmkontakt?", options:["Identisch in der Methode","Kaltanruf: kein vorheriger Kontakt, Gesprächspartner kennt dich nicht. Warmkontakt: vorherige Interaktion (LinkedIn-Kommentar, Event, Empfehlung) – Conversionrate 3-5x höher","Warmkontakt ist nur durch persönliche Beziehungen möglich","Kaltanrufe sind immer effektiver"], correct:1, explanation:"Warm-up vor Akquise: LinkedIn-Verbindung + Kommentar auf Post + dann Anruf. Oder: gemeinsames Event + Follow-up. Der Gesprächspartner kennt deinen Namen bereits. Eisbrecher-Effekt: 'Ich habe Ihren Kommentar zu NIS2 gesehen und wollte mich kurz vorstellen.' Sofort andere Gesprächsqualität.", prinzip:"Jede Vorbereitung die den Anruf warm macht, verdreifacht den Erfolg." },
  { id:"k2", question:"Was ist die optimale Struktur eines Kaltanruf-Einstiegs (erste 30 Sekunden)?", options:["Sofort alle Features erklären","1. Wer du bist (kurz) 2. Warum du anrufst (konkreter Grund) 3. Was der Gesprächspartner davon hat (Nutzen) 4. Frage die Engagement erzeugt – keine Präsentation","Fragen ob der Gesprächspartner Zeit hat","Lange Einleitung über das Unternehmen"], correct:1, explanation:"30-Sekunden-Einstieg: 'Guten Tag, [Name], ich bin [Marius] von [IT-Check]. Ich rufe an weil wir gerade mehrere IT-Leiter im Maschinenbau zu NIS2-Anforderungen begleiten – darf ich kurz fragen ob das bei Ihnen aktuell ein Thema ist?' Konkret, relevant, Frage am Ende.", prinzip:"Name, Grund, Nutzen, Frage – in 30 Sekunden." },
  { id:"k3", question:"Was ist der 'Permission-based Approach' in der Kaltakquise?", options:["Eine rechtliche Anforderung","Um Erlaubnis bitten bevor du weitere Informationen gibst: 'Darf ich kurz sagen worum es geht?' – gibt Gesprächspartner Kontrolle und reduziert Widerstand","Eine veraltete Methode","Nur relevant wenn der Gesprächspartner beschäftigt klingt"], correct:1, explanation:"Permission-based: 'Ich weiß ich rufe unangekündigt an – darf ich in 30 Sekunden erklären warum?' Die meisten sagen Ja. Dadurch: du hast aktive Zustimmung zum Weiterreden, kein Gefühl der Überrumpelung. Respektiert die Zeit des Gesprächspartners.", prinzip:"Erlaubnis holen reduziert Widerstand dramatisch." },
  { id:"k4", question:"Wie bereitest du einen Kaltanruf vor um den ersten Satz relevant zu machen?", options:["Keine Vorbereitung nötig","Website lesen, LinkedIn-Profil prüfen, aktuelle News zum Unternehmen – dann konkreten Bezug herstellen: 'Ich habe gesehen dass Sie gerade expandieren...' – zeigt echtes Interesse","Standardskript verwenden","Nur Firmenname und Branche kennen reicht"], correct:1, explanation:"5-Minuten-Vorbereitung pro Call: Website (Was verkaufen sie? Wo sind sie aktiv?), LinkedIn (Wer ist der Ansprechpartner? Was hat er zuletzt gepostet?), News (Expansion, neue Produkte, Auszeichnungen). Dann: personalisierter Einstieg der zeigt dass du nicht das 50. Unternehmen auf einer Liste abarbeitest.", prinzip:"5 Minuten Recherche = 10x besserer Gesprächseinstieg." },
  { id:"k5", question:"Was ist ein Gesprächsleitfaden (Skript) und wie nutzt du ihn richtig?", options:["Wort für Wort ablesen","Struktur und Kernpunkte als Leitfaden, aber natürlich formulieren – kein Ablesen. Skript gibt Sicherheit für Struktur, nicht für Wortlaut","Skripts sind unnötig","Immer dasselbe Skript für alle Kunden"], correct:1, explanation:"Skript als Gerüst: kenne die Struktur (Einstieg, Qualifizierung, Nächster Schritt) und die häufigen Einwände auswendig. Aber: klingt nach gelesen = sofort erkannt, sofort Widerstand. Internalisiere das Skript bis es natürlich klingt. Übung macht den Unterschied.", prinzip:"Skript lernen bis es kein Skript mehr klingt." },
  { id:"k6", question:"Was ist der beste Zeitpunkt für Kaltanrufe im B2B?", options:["Montag früh um 8 Uhr","Dienstag bis Donnerstag, 9-11 Uhr und 14-16 Uhr – weniger Meetings, Entscheider erreichbarer. Montag und Freitag: schlechtere Erreichbarkeit","Freitag Nachmittag","Abends nach 17 Uhr"], correct:1, explanation:"Empirie: Dienstag bis Donnerstag zwischen 9-11 und 14-16 Uhr haben die höchsten Verbindungsraten. Montag: voller Agenda-Überblick, schlechte Stimmung. Freitag: Wochenend-Modus, Entscheider im Außendienst. Auch: kurz vor dem Urlaub oder nach Feiertagen oft schlechte Zeiten.", prinzip:"Timing optimieren erhöht Erreichbarkeit ohne Mehraufwand." },

// ─── EXERCISE LOADING ──────────────────────
function loadExercise(mod, catId){
  activeCat=catId; activeQ=null; phase='question';
  mcSel=null; showEx=false; fillVal=''; fillCk=null;
  narFb=null; showMod=false; dynQ=null; fbText='';
  activeModule=mod;

  if(mod==='de'){
    if(catId==='Narration'){
      const P=P_DE; const lv=P.cats.Narration.lv||1;
      const pool=DE_NARRATION[lv]||DE_NARRATION[1];
      activeQ=rand(pool); activeExType='narration';
    } else if(catId==='Situationen'){
      activeQ=DE_SITUATIONS[situIdx%DE_SITUATIONS.length];
      situIdx++; activeExType='situation';
    } else if(catId==='Vocab-Upgrade'){
      activeQ=DE_VOCAB_UPGRADES[vocabIdx%DE_VOCAB_UPGRADES.length];
      vocabIdx++; activeExType='vocab';
    } else {
      const P=P_DE; const lv=P.cats[catId]?.lv||1;
      const pool=DE_GRAMMAR[catId]?.[lv]||DE_GRAMMAR[catId]?.[1]||[];
      if(pool.length){activeQ=rand(pool); activeExType=activeQ.opts?'mc':'fill';}
    }
  } else if(mod==='it'){
    const P=P_IT; const lv=P.cats[catId]?.lv||1;
    const pool=IT_QUESTIONS[catId]||[]; const lvPool=pool.filter((_,i)=>true); // all
    if(lvPool.length){activeQ=rand(lvPool); activeExType='mc_explain';}
  } else if(mod==='vt'){
    const P=P_VT; const lv=P.cats[catId]?.lv||1;
    const pool=VT_QUESTIONS[catId]||[];
    if(pool.length){activeQ=rand(pool); activeExType='mc_explain';}
  }
  if(mod==='de') deTab='ex';
  else if(mod==='it') itTab='ex';
  else vtTab='ex';
  render();
}

      prompt=`Erstelle eine B2B-Vertrieb-Frage (Mittelstand DACH), Kategorie ${activeCat}.
NUR JSON: {"type":"mc","question":"Situation...","options":["A","B","C","D"],"correct":1,"explanation":"...","prinzip":"Kurzes Prinzip"}`;
