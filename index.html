  { id:"os8", question:"Was ist SELinux und wozu dient es?", options:["Ein grafisches Interface für Linux","Security-Enhanced Linux: Mandatory Access Control (MAC) – definiert genau welche Prozesse auf welche Dateien und Netzwerke zugreifen dürfen, auch wenn sie als root laufen","Ein Firewall-System für Linux","Eine Benutzerauthentifizierungsmethode"], correct:1, explanation:"SELinux (RHEL/CentOS): jeder Prozess hat ein Label, jede Ressource hat ein Label – Zugriff nur wenn Policy es erlaubt. Kompromittierter Webserver kann nur auf freigegebene Dateien zugreifen, nicht aufs gesamte System. Oft deaktiviert wegen Komplexität – aber erheblicher Sicherheitsgewinn. AppArmor: ähnliches Konzept auf Ubuntu." },
  { id:"os9", question:"Was ist Systemd und welche Rolle spielt es in modernen Linux-Systemen?", options:["Ein grafisches Desktop-System","Init-System und Service-Manager: startet Services beim Boot, verwaltet Abhängigkeiten, loggt mit journald, verwaltet Sockets und Timers","Ein Netzwerk-Konfigurationstool","Ein Linux-Kernel-Modul"], correct:1, explanation:"Systemd ersetzt klassisches SysV-Init. Vorteile: paralleles Starten von Services (schnellerer Boot), Dependency-Management zwischen Services, Restart-on-Failure konfigurierbar, systemctl für Service-Management. Befehle: `systemctl status/start/stop/enable/disable`. `journalctl -u nginx`: Logs eines Services. Standard auf allen modernen Linux-Distros." },
  { id:"os10", question:"Was ist ein Linux-Cron-Job?", options:["Ein automatisches Backup-System","Zeitgesteuerter Aufgaben-Planer: führt Skripte oder Befehle zu definierten Zeiten automatisch aus","Ein Netzwerk-Dienst","Ein Prozess-Manager"], correct:1, explanation:"Cron-Syntax: `MIN STD TAG MON WOCHENTAG Befehl`. Beispiel: `0 2 * * * /backup.sh` = täglich um 2:00 Uhr Backup-Skript ausführen. `crontab -e`: Benutzer-Cron bearbeiten. `/etc/cron.d/`: System-weite Cron-Jobs. Systemd-Timers als modernere Alternative. Typische Einsätze: Backups, Log-Rotation, Monitoring-Checks." },
  { id:"os11", question:"Was ist der Unterschied zwischen Windows Server Core und Full GUI Installation?", options:["Identisch – nur Darstellung unterscheidet sich","Server Core: kein grafisches Interface, nur PowerShell/CMD – kleinere Angriffsfläche, weniger Updates nötig, weniger RAM-Verbrauch. Full GUI: grafische Oberfläche, einfacher für weniger erfahrene Admins","Server Core ist für Produktivumgebungen nicht geeignet","Full GUI ist immer zu bevorzugen"], correct:1, explanation:"Microsoft-Empfehlung: Server Core für Produktionsserver. Vorteile: ~60% weniger Updates (weniger GUI-Komponenten), reduzierte Angriffsfläche, weniger RAM. Verwaltung über Remote Server Administration Tools (RSAT) von Windows 10/11 Client oder PowerShell Remote. Lernkurve, aber Best Practice für sichere Umgebungen." },
  { id:"os12", question:"Was ist PowerShell und warum ist es für Windows-Administratoren unverzichtbar?", options:["Ein einfaches Terminal für Windows","Objektorientierte Shell und Skriptsprache für Windows: verwaltet AD, Exchange, Azure, VMware, Netzwerk – alles was in der GUI geht, geht in PowerShell – oft mehr","PowerShell ist nur für Entwickler relevant","Ein Ersatz für CMD ohne wesentliche Unterschiede"], correct:1, explanation:"PowerShell-Stärken: Pipe-Objekte (nicht Text wie bash), .NET-Integration, Remote-Verwaltung (WinRM), DSC (Desired State Configuration). Beispiel: alle AD-Benutzer die 90 Tage nicht angemeldet: `Get-ADUser -Filter {LastLogonDate -lt (Get-Date).AddDays(-90)}`. Automation: Onboarding-Skripte, Compliance-Reports, Massen-Änderungen." },
  { id:"os13", question:"Was ist Windows Update for Business und WSUS?", options:["Identische Produkte","Windows Update for Business: Microsoft-Cloud-basiertes Update-Management für Azure AD-joined Geräte (Rings, Defer-Zeiträume). WSUS (Windows Server Update Services): on-premise Server der Updates cached und deployt – zentrale Kontrolle im Intranet","WSUS ist veraltet und nicht mehr nutzbar","Beide ersetzen Windows Update vollständig"], correct:1, explanation:"WSUS: on-premise, Updates werden einmal heruntergeladen und intern verteilt – spart Bandbreite, zentrale Kontrolle über welche Updates wann deployt werden. WUfB (Windows Update for Business): cloud-basiert, Deployment Rings (pilot → breite Rollout), GPO oder Intune. Für Hybrid-Umgebungen: oft Kombination oder Microsoft Endpoint Manager (Intune + ConfigMgr)." },
  { id:"os14", question:"Was ist NTFS und welche Berechtigungen kennt es?", options:["Ein Netzwerk-Protokoll","New Technology File System: Windows-Dateisystem mit Berechtigungen (Lesen, Schreiben, Ausführen, Ändern, Vollzugriff) pro Benutzer/Gruppe, Kompression, Encryption (EFS), Journaling","Ein Dateiformat","Ein Backup-System"], correct:1, explanation:"NTFS-Berechtigungen: feingranular (Read, Write, Execute, Modify, Full Control), auf Dateien und Ordner, vererbt durch Ordnerhierarchie, kombiniert mit Share-Berechtigungen (beim Netzwerkzugriff gilt das Restriktivere). Best Practice: NTFS-Berechtigungen über AD-Gruppen vergeben – nie direkt für Benutzer. ReFS als neueres Dateisystem für Storage Spaces." },
  { id:"os15", question:"Was ist Linux LVM (Logical Volume Manager)?", options:["Ein Netzwerk-Verwaltungssystem","Abstraktionsschicht über physische Festplatten: flexible Partitionierung ohne feste Grenzen, Online-Erweiterung von Volumes möglich, Snapshots","Ein Dateisystem","Ein Backup-System für Linux"], correct:1, explanation:"LVM: Physical Volumes (PVs) → Volume Group (VG) → Logical Volumes (LVs). Vorteil: LV nachträglich vergrößern ohne Neupartitionierung (`lvextend`), mehrere Festplatten zu einem VG zusammenfassen, Snapshots für konsistente Backups. Standard auf RHEL/CentOS. Moderne Alternative: ZFS oder Btrfs mit ähnlichen Features." },
  { id:"os16", question:"Was ist Windows Deployment Services (WDS) und welchen Zweck hat es?", options:["Ein Windows-Update-Dienst","Ermöglicht Netzwerk-basiertes OS-Deployment: PXE-Boot, Windows-Images werden über Netzwerk auf neue PCs installiert – hunderte PCs schnell provisionieren","Ein Remote-Desktop-Dienst","Ein Backup-Dienst für Windows"], correct:1, explanation:"WDS: PXE-Boot lädt Boot-Image vom Netzwerk, dann Windows-Image (WIM). Kombiniert mit MDT (Microsoft Deployment Toolkit) oder SCCM/Intune für vollautomatische OS-Installations + Konfiguration. Für größere Umgebungen: Windows Autopilot (cloud-basiert, Zero-Touch-Deployment über Internet ohne WDS)." },
  { id:"os17", question:"Was ist der Unterschied zwischen Standard und Datacenter Edition bei Windows Server?", options:["Nur der Preis unterscheidet sich","Standard: 2 virtuelle Maschinen inklusive. Datacenter: unbegrenzte VMs, zusätzliche Features (Storage Spaces Direct, Software-Defined Networking, Shielded VMs)","Datacenter ist für Desktops","Standard ist für große Rechenzentren"], correct:1, explanation:"Windows Server Standard: Lizenz deckt physischen Host und 2 VMs ab. Für mehr VMs: weitere Standard-Lizenzen nötig. Datacenter: eine Lizenz für unbegrenzte VMs auf einem Host – ab ~7 VMs günstiger als Standard. Zusätzlich: Datacenter-exklusive Features (S2D, SDN, Shielded VMs). Für virtualisierte Umgebungen: fast immer Datacenter wirtschaftlicher." },
  { id:"os18", question:"Was ist SSH und warum ist es Standard für Linux-Remote-Verwaltung?", options:["Ein Dateiübertragungsprotokoll","Secure Shell: verschlüsseltes Remote-Terminal-Protokoll. Port 22, asymmetrische Verschlüsselung (Public/Private Key oder Passwort), ersetzt Telnet vollständig","Ein VPN-Protokoll","Ein Netzwerk-Monitoring-Protokoll"], correct:1, explanation:"SSH: verschlüsselte Verbindung zum Linux-Server, Port 22. Best Practice: Key-basierte Authentifizierung (kein Passwort), Passwort-Login deaktivieren, Port 22 nur aus Management-Netz erreichbar, fail2ban gegen Brute-Force. Zusatztools: scp/rsync (Dateitransfer), SSH-Tunnel, Port-Forwarding. Ansible nutzt SSH für Automation." },
  { id:"os19", question:"Was ist Windows Task Manager vs. Prozess-Explorer (Sysinternals)?", options:["Identisch in Funktion","Task Manager: eingebaut, Basis-Übersicht. Process Explorer (Sysinternals): zeigt vollständige Prozess-Hierarchie, geladene DLLs, Handles, Netzwerkverbindungen pro Prozess – deutlich mächtiger für Troubleshooting","Process Explorer ist veraltet","Task Manager ist für Admins ausreichend"], correct:1, explanation:"Sysinternals (Microsoft-Akquisition) enthält unverzichtbare Admin-Tools: Process Explorer (tiefe Prozessanalyse), Process Monitor (alle Datei/Registry/Netzwerkzugriffe tracen), Autoruns (alles was beim Start ausgeführt wird), TCPView (aktive Verbindungen). Standard-Toolset für Windows-Troubleshooting und Malware-Analyse." },
  { id:"os20", question:"Was ist ein Windows-Ereignisprotokoll (Event Log) und welche Logs sind wichtig?", options:["Nur für Fehler-Diagnose relevant","Windows schreibt alle Systemereignisse in Event Logs: System (Hardware/OS-Fehler), Application (Software-Fehler), Security (Anmeldungen, Zugriffsversuche), Setup, Forwarded Events","Event Logs werden automatisch gelöscht","Event Logs sind nur für Entwickler relevant"], correct:1, explanation:"Wichtigste Logs: Security Log (Event ID 4624: erfolgreiche Anmeldung, 4625: fehlgeschlagene Anmeldung, 4648: explicit credentials, 4740: Account gesperrt). System Log: Dienst-Abstürze, Hardware-Fehler. Application Log: Anwendungsfehler. Zentrales Log-Management: Windows Event Forwarding + SIEM. Ohne Log-Analyse: Sicherheitsvorfälle werden übersehen." },
  { id:"os21", question:"Was ist das Windows-Registry und welche Risiken bestehen?", options:["Eine Datenbank für Windows-Benutzerdaten","Hierarchische Datenbank die OS- und Anwendungskonfigurationen speichert. Risiken: Malware persistiert oft über Registry-Autostart-Einträge, fehlerhafte Änderungen können System destabilisieren","Ein Backup-System für Windows-Konfigurationen","Ein Netzwerk-Konfigurationsspeicher"], correct:1, explanation:"Registry: HKLM (alle Nutzer), HKCU (aktueller Nutzer), HKCR (Dateiassoziationen). Malware-Persistenz: `HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run` für Autostart. Autorun-Analyse mit Autoruns.exe (Sysinternals). Backup: Registry-Backups vor Änderungen erstellen (reg export), Systemwiederherstellungspunkt setzen." },
  { id:"os22", question:"Was ist der Unterschied zwischen 32-bit und 64-bit Betriebssystemen?", options:["Nur der Prozessor-Typ unterscheidet sich","64-bit: bis 128 TB RAM adressierbar, native 64-bit-Anwendungen effizienter. 32-bit: max. 4 GB RAM – für Server längst obsolet, im Embedded-Bereich noch relevant","32-bit ist sicherer","64-bit läuft auf allen Prozessoren seit 2000"], correct:1, explanation:"32-bit-Grenze: 2^32 Bytes = 4 GB RAM. Server mit 64-bit-OS: 256 GB, 512 GB, 1 TB RAM nutzbar. 64-bit-Anwendungen: Register größer, effizienter. WoW64 (Windows-on-Windows 64-bit): Compatibility-Layer für 32-bit-Apps auf 64-bit-Windows. Heute: alle Server-OS und praktisch alle Desktop-OS 64-bit. 32-bit nur noch für Legacy oder spezifische Embedded-Geräte." },
  { id:"os23", question:"Was ist Ansible und wie unterscheidet es sich von anderen Konfigurationsmanagement-Tools?", options:["Ein Monitoring-Tool für Linux","Agentless Konfigurationsmanagement und Automation: YAML-Playbooks beschreiben gewünschten Zustand, keine Agent-Installation nötig (nutzt SSH/WinRM). Einfacher als Puppet/Chef, populär für Ad-hoc-Automation","Ein Container-Orchestrierungssystem","Ein Backup-Automatisierungstool"], correct:1, explanation:"Ansible: Push-Modell, verbindet per SSH, kein Agent. Playbooks (YAML): einfach lesbar, Idempotenz (mehrfaches Ausführen = gleicher Zustand). Einsatz: Server-Konfiguration, Patch-Deployment, Anwendungsinstallation, Cloud-Provisioning. Puppet/Chef: agentenbasiert, komplexer, Pull-Modell. Für Mittelstand: Ansible ist oft ausreichend und einfacher." },
  { id:"os24", question:"Was ist NTP (Network Time Protocol) und warum ist es kritisch?", options:["Ein Protokoll für Netzwerkdrucker","Synchronisiert Systemuhren im Netzwerk. Kritisch: AD-Kerberos erlaubt max. 5 Minuten Zeitdifferenz, fehlerhafte Zeiten führen zu Authentifizierungsfehlern, Zertifikatsproblemen und inkonsistenten Log-Dateien","Ein Protokoll für Netzwerkkonfiguration","Ein Backup-Synchronisationsprotokoll"], correct:1, explanation:"NTP-Hierarchie (Stratum): Stratum 0 (Atomuhr), Stratum 1 (direkt mit Stratum 0), Stratum 2 (synchronisiert mit Stratum 1). Domain Controller: Stratum 2 (synchronisiert mit externen NTP-Servern), alle Domain-Mitglieder synchronisieren mit DC. Zeitdifferenz > 5 Minuten in AD: Kerberos-Tickets werden verweigert – Anmeldefehler für alle Nutzer." },
  { id:"os25", question:"Was ist Hyper-V und welche Rolle spielt es als Server-OS-Feature?", options:["Eine virtuelle Maschine","Windows Server-Rolle die einen Typ-1-Hypervisor bereitstellt. In Windows Server kostenlos enthalten (Lizenz für VMs separat). Konkurriert mit VMware ESXi","Ein Cloud-Dienst","Ein Backup-System"], correct:1, explanation:"Hyper-V: in Windows Server 2012+ enthalten, Typ-1-Hypervisor. Features: Live Migration (entspricht vMotion), Hyper-V Replica (entspricht vSphere Replication), Failover Clustering (entspricht VMware HA), Generation 2 VMs (UEFI, SecureBoot). Vorteil: kein separater Hypervisor nötig wenn Windows Server vorhanden. Nachteil: kleineres Ecosystem, weniger Features als vSphere." },
  { id:"os26", question:"Was ist ein Linux-RAID unter mdadm vs. Hardware-RAID?", options:["Identisch in Performance und Funktion","Software-RAID (mdadm): OS verwaltet RAID, flexibler, kein proprietärer Controller. Hardware-RAID: dedizierter RAID-Controller mit eigenem Prozessor und Cache (BBU) – bei großen Arrays performanter, aber Abhängigkeit von Controller-Hardware","Hardware-RAID ist immer besser","Software-RAID ist nicht produktionstauglich"], correct:1, explanation:"mdadm Software-RAID: kostenlos, keine proprietäre Hardware, bei modernen Server-CPUs ausreichend performant, ZFS als mächtigere Alternative. Hardware-RAID: dedizierter Cache (BBU schützt bei Stromausfall), optimal für sehr IOPS-intensive Workloads. Problem: Controller-Ausfall = neue Controller gleicher Firmware nötig. Trend: Software-defined Storage ersetzt Hardware-RAID." },
  { id:"os27", question:"Was ist Windows Remote Management (WinRM) und PowerShell Remoting?", options:["Ein VPN-Dienst für Windows","WinRM: HTTP/HTTPS-basiertes Remote-Management-Protokoll für Windows. Basis für PowerShell Remoting: `Enter-PSSession`, `Invoke-Command` – verwalte Server remote per PowerShell ohne RDP","Ein Remote-Desktop-Protokoll","Ein Netzwerk-Monitoring-Protokoll"], correct:1, explanation:"PowerShell Remoting nutzt WinRM (Port 5985 HTTP / 5986 HTTPS). Befehle: `Enter-PSSession -ComputerName Server01` (interaktive Session), `Invoke-Command -ComputerName Server01,Server02 -ScriptBlock {Get-Service}` (Befehl auf mehreren Servern gleichzeitig). Besser als RDP für Automation und Massen-Verwaltung. Im AD: oft schon konfiguriert." },
  { id:"os28", question:"Was ist der Linux-Kernel und welche Aufgaben hat er?", options:["Das grafische Interface von Linux","Kern des Betriebssystems: verwaltet Hardware (CPU, RAM, Geräte), Prozesse, Dateisysteme, Netzwerk. Kommuniziert zwischen Hardware und Userspace-Anwendungen","Ein Dateisystem","Ein Netzwerk-Stack"], correct:1, explanation:"Linux-Kernel: monolithisch (alles im Kernel-Space), aber modular (Kernel-Module laden/entladen). Aufgaben: Prozess-Scheduling, Speicherverwaltung, Gerätetreiber, Netzwerk-Stack, Dateisystem-Unterstützung. Kernel-Updates: wichtig für neue Hardware-Unterstützung und Security-Patches. `uname -r`: aktuelle Kernel-Version anzeigen." },
  { id:"os29", question:"Was ist Windows Server Update Services (WSUS) Best Practice für Unternehmensumgebungen?", options:["WSUS sollte alle Updates sofort deployen","WSUS-Best-Practice: Testgruppe (Pilotrechner) erhält Updates zuerst, nach erfolgreicher Testphase breite Rollout. Automatische Genehmigung für kritische Security-Updates, manuelle Prüfung für andere. Cleanup-Skripte regelmäßig ausführen","WSUS ersetzt Antivirus","Alle Updates ablehnen bis manuell geprüft"], correct:1, explanation:"WSUS-Deployment in Rings: Ring 1 (Pilot, 5-10 Rechner) → 1 Woche → Ring 2 (breitere Gruppe) → 1 Woche → Ring 3 (alle). Automatisch genehmigen: Critical/Security-Updates für Pilot sofort. Problematische Updates werden in Pilot-Phase erkannt. WSUS-DB regelmäßig aufräumen (`wsusutil.exe`), sonst Performance-Probleme." },
  { id:"os30", question:"Was ist ein Container-optimiertes OS und welche Beispiele gibt es?", options:["Ein normales Linux mit Docker installiert","Minimales OS das ausschließlich für Container-Betrieb optimiert ist: reduzierte Angriffsfläche, immutable (read-only), automatische Updates. Beispiele: CoreOS/Flatcar, RancherOS, Google Container-Optimized OS, Windows Server Core","Ein spezielles Linux für Kubernetes","Ein Cloud-Betriebssystem"], correct:1, explanation:"Container-optimierte OS: kein Paketmanager, kein SSH (Verwaltung per API), immutable (Systempartition read-only), automatische atomic updates. Vorteile: maximale Sicherheit (keine unnötige Software), konsistente Umgebungen. In K8s-Clusters: Knoten laufen oft Flatcar/CoreOS. Für traditionelle Anwendungen ungeeignet – nur für Container-Workloads." },
],
};
